  <dialog id="profile-dialog" class="dialog" aria-labelledby="edit-title"><h2 id="edit-title">更新健康档案</h2><p>写下你知道的信息，记不清的内容可以留空，之后再核对。</p><form id="profile-form"></form></dialog>
  <input id="attachment-input" type="file" accept=".pdf,.png,.jpg,.jpeg" multiple hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    const B='button px-6 py-3 rounded-full font-medium transition-colors duration-300';
    const C='panel bg-[#faf6f1] rounded-[2rem] border border-stone-200';
    const F='field px-5 py-3 bg-white border border-stone-200 rounded-full text-stone-800 placeholder:text-stone-400 focus:border-stone-400 focus:ring-2 focus:ring-stone-200 transition-all duration-300';
    const pages={chat:'AI 问诊',records:'问诊记录',health:'健康档案',followups:'随访计划',reminders:'用药提醒'};
    const state={page:'chat',stage:'summary',record:'a',recordSearch:'',question:'',attachments:[],messages:[],followFilter:'all',reminderFilter:'today',profile:{name:'林女士',gender:'女',height:'165',weight:'58',allergies:'',chronic:'',medications:''},prep:{a:{checks:[false,false,false],questions:''},b:{checks:[false,false,false],questions:''}},visits:{a:{hospital:'',department:'',notes:''},b:{hospital:'',department:'',notes:''}},tasks:[{date:'09.30',when:'今天',title:'记录这两天的身体变化',description:'补充症状有没有变化，以及是否已经就诊。',done:false},{date:'10.03',when:'周六',title:'补充本次就诊情况',description:'就诊后，记录医生的结论和后续安排。',done:false},{date:'09.28',when:'已完成',title:'整理已有检查资料',description:'已标记完成 · 患者自报',done:true}],reminders:[{id:'r1',time:'08:00',period:'今天上午',title:'示例处方药 A',status:'sent'},{id:'r2',time:'12:00',period:'今天中午',title:'示例处方药 B',status:'failed'},{id:'r3',time:'20:00',period:'今天晚上',title:'示例处方药 A',status:'pending'},{id:'r4',time:'08:00',period:'明天上午',title:'示例处方药 A',status:'pending'}]};
    const records=[{id:'a',title:'最近反复胃部不适',date:'2026.09.30',status:'待准备就诊',summary:'这两天出现间歇性胃部不适，希望了解就诊前应该怎样整理症状。',duration:'约 2 天',context:'饭后更明显，具体频率待补充',department:'全科医学科 / 普通内科',reason:'作为尚未明确原因的一般不适，可先了解综合评估入口；医院科室名称可能不同。'},{id:'b',title:'皮肤瘙痒的咨询',date:'2026.09.22',status:'待补充就诊情况',summary:'近期出现皮肤瘙痒，已经整理发生时间和相关接触情况，准备向医生进一步说明。',duration:'约 1 周',context:'部位、皮疹照片及接触物待核对',department:'皮肤科',reason:'示例展示针对皮肤相关症状的常见科室入口；实际分诊需结合具体情况。'}];
    const main=document.querySelector('#main');const dialog=document.querySelector('#profile-dialog');let toastTimer;
    const esc=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const icon=id=>`<svg aria-hidden="true"><use href="#${id}"/></svg>`;
    const button=(text,action,classes='')=>`<button class="${B} ${classes}" data-action="${action}" type="button">${text}</button>`;
    const field=(id,label,value='',type='text',placeholder='')=>`<label class="label" for="${id}">${label}</label><input id="${id}" name="${id}" class="${F}" type="${type}" value="${esc(value)}" placeholder="${placeholder}">`;
    const area=(id,label,value='',placeholder='')=>`<label class="label" for="${id}">${label}</label><textarea id="${id}" name="${id}" class="${F}" placeholder="${placeholder}">${esc(value)}</textarea>`;
    const footer=()=>`<footer class="page-footer"><span>医枢 MedAxis · 把健康的事，慢慢理清。</span><span>交互原型 · 合成数据 · 刷新后恢复示例</span></footer>`;
    function toast(text){document.querySelector('#toast').textContent=text;clearTimeout(toastTimer);toastTimer=setTimeout(()=>document.querySelector('#toast').textContent='',5000);}
    function stash(){if(state.page==='chat'){const q=document.querySelector('#question');if(q)state.question=q.value;}if(state.page==='records'){const p=state.prep[state.record],v=state.visits[state.record];if(state.stage==='preparation'){p.checks=[...document.querySelectorAll('[data-prep-check]')].map(x=>x.checked);p.questions=document.querySelector('#prep-questions')?.value??p.questions;}if(state.stage==='visit'){for(const key of ['hospital','department','notes'])v[key]=document.querySelector('#visit-'+key)?.value??v[key];}}}
    function heading(title,description,action=''){return `<header class="page-head"><div><h1>${title}</h1><p>${description}</p></div>${action}</header>`;}
    function today(){return `<aside class="today" aria-label="近期安排"><div class="today-heading"><h2>接下来的一小步</h2>${icon('leaf')}</div><div class="today-item"><span class="tag">今天 · ${state.tasks[0].done?'已完成':'待完成'}</span><h3>记录身体变化</h3><p class="muted">${state.tasks[0].done?'已标记完成 · 患者自报':'随访计划里，有一项待补充。'}</p><a class="text-link" href="#followups">看看随访计划 ${icon('arrow')}</a></div><div class="today-item"><span class="tag">健康档案</span><h3>${state.profile.allergies?'核对过敏信息':'过敏史还未填写'}</h3><p class="muted">${state.profile.allergies?'如有变化，记得及时更新。':'未填写，不代表没有过敏。'}</p><a class="text-link" href="#health">${state.profile.allergies?'查看健康档案':'补充这条信息'} ${icon('arrow')}</a></div><p class="leaf-note">不用一次说得很完整，<br>我们可以从一件小事开始。</p></aside>`;}
    function composer(){return `<form id="chat-form" class="composer ${C}"><label class="label" for="question">${state.messages.length?'继续说说你的情况':'这次，想聊聊哪里不舒服？'}</label><textarea id="question" class="${F}" maxlength="2000" placeholder="比如：什么时候开始、哪里不舒服、有什么变化……">${esc(state.question)}</textarea><div class="attachments" ${state.attachments.length?'':'hidden'}>${state.attachments.map(esc).join(' · ')}<br>已选文件，仅展示文件名，尚未解析。</div><div class="composer-actions">${button(icon('attach')+' 添加资料','attach','quiet')}<span class="muted">一次说一点也可以</span><button class="${B} primary" type="submit">${state.messages.length?'发送':'开始问诊'} ${icon('arrow')}</button></div></form>`;}
    function chatPage(){const conversation=state.messages.length>0;return `${conversation?heading('AI 问诊','把身体的变化说清楚，一步一步来。',button('重新开始','restart','quiet')):`<section class="greeting"><div><p class="personal">你好，${esc(state.profile.name)}。</p><h1>关心你的每一次<span class="line-break">身体变化。</span></h1><p>说说最近的情况，<br>一起整理症状，准备好下一步。</p></div><svg class="botanical" aria-hidden="true"><use href="#plant"/></svg></section>`}<div class="chat-grid"><div class="chat-core">${conversation?`<div class="conversation-title"><h2>本次交流</h2><span class="tag">演示对话 · 尚未连接 AI</span></div><div class="messages" aria-live="polite">${state.messages.map(m=>`<article class="message ${m.role}">${m.role==='ai'?`<div class="message-author">${icon('leaf')}<span>医枢 · 演示回复</span></div>`:'<div class="sr-only">你说：</div>'}<p>${esc(m.text)}</p></article>`).join('')}</div><div class="chat-toolbar"><span class="muted">先保留已提供的信息，方便后续补充。</span>${button('整理为问诊记录 '+icon('arrow'),'summarize')}</div>`:''}${composer()}${conversation?'':`<div class="suggestions" aria-label="症状描述示例">${['最近胃部不舒服','皮肤有些痒','想整理已有检查报告'].map(t=>button(t,'suggest:'+t)).join('')}</div>`}<p class="note chat-footnote">${icon('alert')}<span>AI 辅助整理信息，不能替代医生诊断。紧急情况请及时寻求线下急救帮助。</span></p>${conversation?'':`<section class="recent"><div class="section-head"><h2>继续上次的记录</h2><a class="text-link" href="#records">全部记录 ${icon('arrow')}</a></div>${records.slice(0,2).map(r=>`<div class="history-row"><div><strong>${esc(r.title)}</strong><br><time>${r.date} · ${r.status}</time></div>${button('查看 '+icon('arrow'),'open-record:'+r.id,'quiet small')}</div>`).join('')}</section>`}</div>${today()}</div>${footer()}`;}
    function recordsPage(){const r=records.find(x=>x.id===state.record),p=state.prep[r.id],v=state.visits[r.id];const stages=[['summary','01','本次问诊总结','回顾重点'],['preparation','02','准备去就诊','带着问题去'],['visit','03','记录就诊结果','留下医生的安排']];let content='';if(state.stage==='summary'){content=`<div class="article-title"><div><h2>${esc(r.title)}</h2><p>${r.demo?'患者输入 · 未生成 AI 总结':'AI 整理示例 · 待本人核对'}</p></div><time>${r.date}</time></div><p class="record-lead">${esc(r.summary)}</p><dl class="fact-list"><div><dt>持续时间</dt><dd>${esc(r.duration)}</dd></div><div><dt>相关情况</dt><dd>${esc(r.context)}</dd></div><div><dt>尚待补充</dt><dd>症状频率、既往检查及当前用药</dd></div></dl><hr class="rule"><h3>接下来怎么做</h3><p style="margin-top:12px;font-size:14px">先把已有资料和想问的问题放在一起，就诊时更容易说清楚。</p><details><summary>查看整理依据</summary><p>${r.demo?'根据你在当前预览中输入的内容原样保留，没有执行医学分析。':'合成示例：患者描述与时间线。没有真实病历或医学分析结果。'}</p></details><div class="record-actions"><span class="muted">信息可以继续补充，不必一次填完。</span>${button('准备去就诊 '+icon('arrow'),'stage:preparation','primary')}</div>`;}else if(state.stage==='preparation'){content=`<div class="article-title"><div><h2>带着重点，去见医生</h2><p>准备好这三件事，就诊时从容一点。</p></div></div><h3>可以先了解的科室</h3><p style="margin-top:12px;color:var(--olive);font-size:18px">${esc(r.department)}</p><p class="muted" style="margin-top:8px">${esc(r.reason)}</p><hr class="rule"><h3>记得带上</h3><div style="margin:10px 0 24px">${['已有检查报告或病历','当前用药清单和过敏信息','症状发生时间、频率和变化'].map((t,i)=>`<label class="check-row"><input type="checkbox" data-prep-check="${i}" ${p.checks[i]?'checked':''}>${t}</label>`).join('')}</div>${area('prep-questions','想问医生的问题',p.questions,'记下最关心的 1–3 个问题')}<div class="record-actions"><span class="muted">科室为演示建议，请以实际医院分诊为准。</span>${button('保存就诊准备','save-prep','primary')}</div>`;}else{content=`<div class="article-title"><div><h2>记下这次就诊的安排</h2><p>记录医生已说明的内容，不确定的地方可以留空。</p></div></div><div class="fields-two"><div>${field('visit-hospital','就诊医院',v.hospital,'text','医院名称')}</div><div>${field('visit-department','就诊科室',v.department,'text','实际就诊科室')}</div></div><div class="form-group" style="margin-top:24px">${area('visit-notes','医生的结论与后续安排',v.notes,'比如：检查结果、医生说明、复查时间。用药以正式处方为准。')}</div><p class="subtle-note">仅记录你提供的内容，不会自动生成处方、用药提醒或随访任务。</p><div class="record-actions"><a class="text-link" href="#followups">查看已有随访计划 ${icon('arrow')}</a>${button('保存就诊记录','save-visit','primary')}</div>`;}return `${heading('问诊记录','从本次交流，到准备就诊，再到记录结果。',button(icon('plus')+' 新问诊','new-chat'))}<div class="record-grid"><aside class="record-sidebar" aria-label="我的问诊记录"><h2>我的记录</h2><label class="sr-only" for="record-search">搜索问诊记录</label><input id="record-search" type="search" class="${F}" value="${esc(state.recordSearch)}" placeholder="搜索记录"><ul id="record-list" class="record-list">${recordItems()}</ul><p class="empty" id="record-empty" ${matchingRecords().length?'hidden':''}>没有找到相关记录。</p></aside><div><nav class="journey" aria-label="问诊记录的三个阶段">${stages.map(([id,n,title,desc])=>`<button class="${B} stage" data-action="stage:${id}" ${state.stage===id?'aria-current="step"':''}><b>${n}</b><div><strong>${title}</strong><span>${desc}</span></div></button>`).join('')}</nav><article class="${C} record-article">${content}</article></div></div>${footer()}`;}
    function matchingRecords(){return records.filter(r=>(r.title+r.date).includes(state.recordSearch));}
    function recordItems(){return matchingRecords().map(r=>`<li><button class="${B} record-select" data-action="select-record:${r.id}" aria-current="${r.id===state.record}"><time>${r.date}</time><strong>${esc(r.title)}</strong><span>${esc(r.status)}</span></button></li>`).join('');}
    function healthPage(){const p=state.profile,complete=!!p.allergies&&!!p.chronic&&!!p.medications;return `${heading('健康档案','把重要信息放在一起，问诊时少一点重复。')}<div class="profile-completeness">${icon('leaf')}<div><strong>${complete?'重要信息已补充，可以继续核对':'还有几条重要信息，等你补充'}</strong><p>过敏史、既往疾病和当前用药，未填写时保留为“未知”。</p></div></div><div class="profile-grid"><section class="${C} profile-card"><div class="section-head"><h2>基本信息</h2>${button('编辑','edit-profile','quiet')}</div><div class="profile-identity"><span class="large-mark" aria-hidden="true">${esc(p.name.slice(0,1)||'你')}</span><div><strong>${esc(p.name||'待填写姓名')}</strong><p>本人档案 · 信息由本人填写</p></div></div><dl class="profile-facts"><div><dt>性别</dt><dd>${esc(p.gender)}</dd></div><div><dt>身高</dt><dd>${p.height?esc(p.height)+' cm':'未填写'}</dd></div><div><dt>体重</dt><dd>${p.weight?esc(p.weight)+' kg':'未填写'}</dd></div><div><dt>信息来源</dt><dd>患者自报</dd></div></dl><p class="note" style="margin-top:24px">${icon('leaf')}<span>基础信息有变化时，记得更新。原型不会根据身高体重作医学判断。</span></p></section><section class="${C} profile-card"><div class="section-head"><h2>问诊需要知道的事</h2>${button('补充','edit-profile','quiet')}</div><div class="clinical-row"><h3>过敏史 ${p.allergies?'':'<span class="tag warning">未填写</span>'}</h3><p>${esc(p.allergies||'暂未提供过敏信息')}</p><p class="muted">${p.allergies?'患者自报 · 就诊时请与医生核对':'不能据此判断为“无过敏史”。'}</p></div><div class="clinical-row"><h3>既往疾病</h3><p>${esc(p.chronic||'未填写')}</p><p class="muted">曾确诊的疾病，以及正在随访的情况。</p></div><div class="clinical-row"><h3>当前用药</h3><p>${esc(p.medications||'未填写')}</p><p class="muted">按药盒或处方记录名称，剂量不清楚时请先核对。</p></div></section></div><div class="profile-bottom"><p>用药提醒中的合成示例，不会被当作你的真实用药写入档案。</p><a href="#chat" class="text-link">带着档案开始问诊 ${icon('arrow')}</a></div>${footer()}`;}
    function followupsPage(){const done=state.tasks.filter(t=>t.done).length,visible=state.tasks.map((t,i)=>({...t,index:i})).filter(t=>state.followFilter==='all'||(state.followFilter==='pending'?!t.done:t.done));return `${heading('随访计划','把后续安排拆成小步，按自己的节奏完成。')}<div class="segmented" aria-label="随访任务筛选">${[['all','全部安排'],['pending','待完成'],['done','已完成']].map(([id,label])=>`<button class="${B}" data-action="follow-filter:${id}" aria-pressed="${state.followFilter===id}">${label}</button>`).join('')}</div><div class="followup-grid"><section class="${C}"><div class="plan-heading"><div><h2>本次问诊后的跟进</h2><p>09.28 — 10.03 · 示例随访计划</p></div><span class="tag">${done===state.tasks.length?'已完成':'进行中'}</span></div><div class="progress" role="progressbar" aria-label="随访任务完成进度" aria-valuemin="0" aria-valuemax="3" aria-valuenow="${done}"><span style="width:${done/3*100}%"></span></div><div class="plan-stats"><span>已完成 ${done} / 3 项</span><span>完成状态由本人确认</span></div><div class="task-list">${visible.length?visible.map(t=>`<div class="task-row"><div class="task-date">${t.date}<small>${t.when}</small></div><div class="task-copy"><h3>${t.title}</h3><p>${t.description}</p></div>${t.done?`<span class="task-done">${icon('check')}已完成</span>`:button('标记完成','complete-task:'+t.index)}</div>`).join(''):'<p class="empty">这个分类下暂无任务。</p>'}</div></section><aside class="side-reading"><h2>一步一步，也很好。</h2><p>有变化时及时记录，下一次交流就不用从头回想。</p><hr class="rule"><p>如果已线下就诊，可以先把医生的说明补进问诊记录。</p><a class="text-link" href="#records">补充就诊记录 ${icon('arrow')}</a></aside></div><p class="note" style="margin-top:24px">${icon('leaf')}<span>这是用于查看排版与交互的示例计划，实际随访安排应来自已确认的诊疗计划。</span></p>${footer()}`;}
    function remindersPage(){const list=state.reminders.filter(r=>state.reminderFilter==='tomorrow'?r.id==='r4':state.reminderFilter==='done'?r.status==='acknowledged':r.id!=='r4');const status={sent:['待你确认',''],failed:['发送失败','warning'],pending:['等待发送',''],acknowledged:['已打卡 · 患者自报','']};return `${heading('用药提醒','提醒按时核对处方，记录自己的服用情况。')}<div class="notice">${icon('alert')}<p><strong>药名、剂量和服用方式以正式处方为准。</strong><br>页面中的药物为虚构示例，不提供用药建议。</p></div><div class="segmented" aria-label="用药提醒筛选">${[['today','今天'],['tomorrow','明天'],['done','已打卡']].map(([id,label])=>`<button class="${B}" data-action="reminder-filter:${id}" aria-pressed="${state.reminderFilter===id}">${label}</button>`).join('')}</div><div class="reminder-top"><div><h2>${state.reminderFilter==='tomorrow'?'10 月 1 日':state.reminderFilter==='done'?'已记录的打卡':'9 月 30 日'}</h2><p>${state.reminderFilter==='done'?'本人确认的服用记录':'时间安排清楚，状态也清楚。'}</p></div><span class="muted">${list.length} 条提醒</span></div><div class="reminder-list">${list.length?list.map(r=>`<article class="${C} reminder-row"><div class="reminder-time">${r.time}<small>${r.period}</small></div><div class="reminder-copy"><span class="tag ${status[r.status][1]}">${r.status==='acknowledged'?icon('check'):r.status==='failed'?icon('alert'):''}${status[r.status][0]}</span><h3>${r.title}</h3><p>剂量与服法：请核对原处方</p></div><div class="reminder-action">${r.status==='sent'?button('我已按处方服用','ack:'+r.id,'primary'):r.status==='failed'?button('演示重新发送','retry:'+r.id):r.status==='acknowledged'?`<span class="task-done">${icon('check')}本次已记录</span>`:'<p class="muted">到时发送提醒</p>'}${r.status==='sent'?'<p class="muted">打卡仅代表本人确认</p>':''}</div><details><summary>查看提醒来源与说明</summary><p>来源：合成处方与提醒数据，仅用于设计预览。\n未附真实处方文件，不能据此决定服药。\n${r.status==='failed'?'示例失败原因：提醒通道暂时不可用。重试仅演示状态变化。':''}</p></details></article>`).join(''):'<p class="empty">还没有打卡记录。确认服用后，这里会显示本人记录。</p>'}</div>${footer()}`;}
    function render(focus=false){main.innerHTML=({chat:chatPage,records:recordsPage,health:healthPage,followups:followupsPage,reminders:remindersPage})[state.page]();document.querySelector('#page-label').textContent=pages[state.page];document.querySelector('#patient-name').textContent=state.profile.name||'本人';document.querySelector('.patient-mark').textContent=state.profile.name.slice(0,1)||'你';document.querySelectorAll('[data-page]').forEach(a=>{if(a.dataset.page===state.page)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});document.title=pages[state.page]+' · 医枢 MedAxis 设计预览';if(focus){main.focus({preventScroll:true});window.scrollTo(0,0);}}
    function navigate(page){stash();if(location.hash.slice(1)===page){state.page=page;render(true);}else location.hash=page;}
    function editProfile(){const p=state.profile;document.querySelector('#profile-form').innerHTML=`<div class="fields-two"><div>${field('name','称呼',p.name,'text','你希望怎样被称呼')}</div><div>${field('gender','性别',p.gender,'text','未填写')}</div></div><div class="fields-two form-group"><div>${field('height','身高（cm）',p.height,'number','可留空')}</div><div>${field('weight','体重（kg）',p.weight,'number','可留空')}</div></div><div class="form-group">${area('allergies','过敏史',p.allergies,'已知过敏请写明；未知可留空')}</div><div class="form-group">${area('chronic','既往疾病',p.chronic,'已确诊的疾病；未知可留空')}</div><div class="form-group">${area('medications','当前用药',p.medications,'按处方或药盒记录；不确定可留空')}</div><div class="dialog-actions">${button('取消','close-dialog')}<button class="${B} primary" type="submit">保存档案</button></div><p class="muted">仅保留在本次预览中，不会上传任何资料。</p>`;document.querySelectorAll('#profile-form input[type="number"]').forEach(input=>{input.min='1';input.max=input.id==='height'?'250':'500';input.step='.1';});document.querySelector('#name').maxLength=40;document.querySelector('#gender').maxLength=20;dialog.showModal();}
    document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(!target)return;const [action,...parts]=target.dataset.action.split(':');const arg=parts.join(':');stash();if(action==='suggest'){state.question=arg;document.querySelector('#question').value=arg;document.querySelector('#question').focus();}else if(action==='attach'){document.querySelector('#attachment-input').click();}else if(action==='restart'||action==='new-chat'){state.messages=[];state.question='';state.attachments=[];document.querySelector('#attachment-input').value='';navigate('chat');}else if(action==='summarize'){const userText=state.messages.filter(m=>m.role==='user').map(m=>m.text).join('\n');const id='preview-'+records.length;records.unshift({id,title:'本次交流的记录',date:'2026.09.30',status:'待本人核对',summary:userText,duration:'尚未补充',context:'尚未补充',department:'待评估后给出科室建议',reason:'当前未连接 AI，不能根据输入生成科室推荐。',demo:true});state.prep[id]={checks:[false,false,false],questions:''};state.visits[id]={hospital:'',department:'',notes:''};state.record=id;state.stage='summary';state.recordSearch='';navigate('records');toast('已保留你的输入；未执行 AI 分析，仅在本次预览有效。');}else if(action==='open-record'||action==='select-record'){state.record=arg;state.stage='summary';if(action==='open-record')navigate('records');else render();}else if(action==='stage'){state.stage=arg;render();document.querySelector(`[data-action="stage:${arg}"]`).focus({preventScroll:true});}else if(action==='save-prep'){toast('就诊准备已保留在本次预览中，刷新后恢复示例。');}else if(action==='save-visit'){records.find(r=>r.id===state.record).status=state.visits[state.record].notes.trim()?'已补充就诊情况':'待补充就诊情况';render();toast('就诊记录已保留在本次预览中，刷新后恢复示例。');}else if(action==='edit-profile'){editProfile();}else if(action==='close-dialog'){dialog.close();}else if(action==='follow-filter'){state.followFilter=arg;render();document.querySelector(`[data-action="follow-filter:${arg}"]`).focus({preventScroll:true});}else if(action==='complete-task'){state.tasks[Number(arg)].done=true;render();toast('已标记完成 · 患者自报，仅在本次预览有效。');}else if(action==='reminder-filter'){state.reminderFilter=arg;render();document.querySelector(`[data-action="reminder-filter:${arg}"]`).focus({preventScroll:true});}else if(action==='ack'){state.reminders.find(r=>r.id===arg).status='acknowledged';render();toast('已记录本次打卡 · 患者自报，仅在本次预览有效。');}else if(action==='retry'){state.reminders.find(r=>r.id===arg).status='sent';render();toast('重发状态演示完成，没有发送真实通知。');}});
    document.addEventListener('submit',event=>{if(event.target.id==='chat-form'){event.preventDefault();stash();const text=state.question.trim();if(!text){toast('先写一点想交流的情况。');document.querySelector('#question').focus();return;}state.messages.push({role:'user',text},{role:'ai',text:state.messages.length?'已保留这条补充。你可以继续描述变化，或把本次输入整理为问诊记录。\n\n这是交互演示，没有执行医学分析。':'我已记下你提供的信息。为了把情况说清楚，可以继续补充：什么时候开始、主要在哪里、最近有没有变化？\n\n这是固定的演示回复，当前没有进行诊断、科室分诊或报告解读。'});state.question='';render();document.querySelector('#question').focus({preventScroll:true});}else if(event.target.id==='profile-form'){event.preventDefault();const values=new FormData(event.target);for(const key of Object.keys(state.profile))state.profile[key]=String(values.get(key)||'').trim();dialog.close();render();toast('档案已保留在本次预览中，刷新后恢复示例。');}});
    document.addEventListener('input',event=>{if(event.target.id==='record-search'){state.recordSearch=event.target.value;document.querySelector('#record-list').innerHTML=recordItems();document.querySelector('#record-empty').hidden=matchingRecords().length>0;}});
    document.querySelector('#attachment-input').addEventListener('change',event=>{stash();state.attachments=[...event.target.files].map(f=>f.name);render();toast('仅展示已选文件名，不会上传或解析。');});
    window.addEventListener('hashchange',()=>{stash();state.page=pages[location.hash.slice(1)]?location.hash.slice(1):'chat';render(true);});
    state.page=pages[location.hash.slice(1)]?location.hash.slice(1):'chat';render();
  </script>
</body>
</html>
