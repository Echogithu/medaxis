<body id="top">
  <div class="texture" aria-hidden="true"></div>
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" aria-hidden="true" style="position:absolute;overflow:hidden">
    <defs>
      <symbol id="leaf" viewBox="0 0 24 30"><path d="M5 25C5 13 10 6 20 3c2 11-2 20-12 20M6 25 17 9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="arrow" viewBox="0 0 24 24"><path d="M4 12c6-.3 10 .3 16 0m-5-5 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
      <symbol id="search" viewBox="0 0 24 24"><path d="M17 16c3-4 1-11-5-11S3 9 5 14s8 6 12 2l4 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></symbol>
      <symbol id="check" viewBox="0 0 20 20"><path d="m4 10 4 5 8-10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </defs>
  </svg>
  <header class="site-header">
    <div class="container header-inner">
      <a href="#top" class="brand" aria-label="医枢 MedAxis，返回顶部"><svg aria-hidden="true"><use href="#leaf"/></svg><span>医枢<small>MedAxis</small></span></a>
      <span class="header-note">好好记录，也好好照顾自己。</span>
      <button id="new-record" class="button px-6 py-3 rounded-full font-medium transition-colors duration-300"><svg aria-hidden="true"><use href="#plus"/></svg>新建问诊</button>
    </div>
  </header>
  <main class="container py-16 md:py-24">
    <div class="intro">
      <div><h1>问诊记录</h1><p>把每次问诊的重点，带到下一次照顾里。</p></div>
      <svg class="botanical" viewBox="0 0 240 150" aria-hidden="true">
        <path d="M39 125c-13-21-9-45 13-59 21-15 44-7 63-13 22-7 23-26 47-27 33-2 61 28 55 59-6 35-47 37-75 43-35 8-78 19-103-3Z" fill="#ece7d9"/>
        <g fill="none" stroke="#728362" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M54 131c42-20 71-52 102-109M90 109c-24-1-40-12-46-25 28-5 45 1 50 19M111 88c8-25 25-36 41-34-5 24-17 36-37 37M131 61c-21-1-37-11-38-28 20-1 37 9 39 24M143 43c16-5 24-16 24-28-16 1-25 9-27 22M77 122c3-13-2-23-14-28M100 102c20 2 37-2 50-11M102 107c24 5 45 1 60-12"/><path d="M176 130c3-17 9-31 19-42m-15 30c-9-2-13-8-13-17 11 1 16 7 17 13m1-8c15-1 20-9 22-18-11 0-17 5-20 13"/></g>
        <path d="M31 131c22 5 45 8 66 5" fill="none" stroke="#b68d61" stroke-width="1.3" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="workspace">
      <aside class="record-sidebar" aria-label="问诊记录列表">
        <div class="list-heading"><h2>我的记录</h2><span class="count" id="record-count">3 份</span></div>
        <div class="search-wrap"><svg aria-hidden="true"><use href="#search"/></svg><label class="sr-only" for="search-records">搜索问诊记录</label><input id="search-records" class="field px-5 py-3 bg-white border border-stone-200 rounded-full text-stone-800 placeholder:text-stone-400 focus:border-stone-400 focus:ring-2 focus:ring-stone-200 transition-all duration-300" placeholder="搜索症状或日期" type="search"></div>
        <ul class="record-list" id="record-list"></ul>
        <p class="empty" id="no-records" hidden>没有找到相关记录，试试其他关键词。</p>
        <div class="sidebar-footer"><svg aria-hidden="true"><use href="#leaf"/></svg><p>记录可以慢慢补充。<br>记不清的地方，留给医生一起核对。</p></div>
      </aside>
      <div class="record-area">
        <nav aria-label="问诊记录阶段">
          <ol class="journey">
            <li><button class="stage px-6 py-3 rounded-full font-medium transition-colors duration-300" data-stage="summary" aria-label="本次问诊总结" aria-current="step" aria-controls="panel"><span class="stage-number" aria-hidden="true">01</span><span class="stage-copy"><strong>本次问诊总结</strong><span>回顾病情与建议</span></span></button></li>
            <li><button class="stage px-6 py-3 rounded-full font-medium transition-colors duration-300" data-stage="preparation" aria-label="准备去就诊" aria-controls="panel"><span class="stage-number" aria-hidden="true">02</span><span class="stage-copy"><strong>准备去就诊</strong><span>带上重点与资料</span></span></button></li>
            <li><button class="stage px-6 py-3 rounded-full font-medium transition-colors duration-300" data-stage="visit" aria-label="记录就诊结果" aria-controls="panel"><span class="stage-number" aria-hidden="true">03</span><span class="stage-copy"><strong>记录就诊结果</strong><span>留下医生的建议</span></span></button></li>
          </ol>
        </nav>
        <article id="panel" class="organic-card bg-[#faf6f1] rounded-[2rem] border border-stone-200 p-6 md:p-8" aria-labelledby="panel-title"></article>
        <div class="stage-footer" id="stage-footer"></div>
      </div>
    </div>
    <footer class="page-footer"><span class="footer-leaf"><svg aria-hidden="true"><use href="#leaf"/></svg>每一份记录，都是照顾自己的开始。</span><span>示例病历 · 仅供设计预览</span></footer>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="new-dialog" class="dialog" aria-labelledby="dialog-title">
    <form id="new-form"><h2 id="dialog-title">新的一次问诊</h2><p class="note">写下这次想咨询的问题，创建一份预览记录。</p><div class="field-group"><label class="form-label" for="new-complaint">这次哪里不舒服？</label><textarea id="new-complaint" required maxlength="120" class="field textarea px-5 py-3 bg-white border border-stone-200 rounded-full text-stone-800 placeholder:text-stone-400 focus:border-stone-400 focus:ring-2 focus:ring-stone-200 transition-all duration-300" placeholder="例如：最近几天咳嗽，想咨询一下"></textarea></div><div class="dialog-actions"><button type="button" id="cancel-new" class="button px-6 py-3 rounded-full font-medium transition-colors duration-300">暂不创建</button><button type="submit" class="button primary px-6 py-3 rounded-full font-medium transition-colors duration-300">创建预览记录</button></div></form>
  </dialog>
  <script>
    const buttonClass='button px-6 py-3 rounded-full font-medium transition-colors duration-300';
    const fieldClass='field px-5 py-3 bg-white border border-stone-200 rounded-full text-stone-800 placeholder:text-stone-400 focus:border-stone-400 focus:ring-2 focus:ring-stone-200 transition-all duration-300';
    const leaf='<svg aria-hidden="true"><use href="#leaf"/></svg>';
    const arrow='<svg aria-hidden="true"><use href="#arrow"/></svg>';
    const records=[
      {id:'a',date:'2026.09.30',name:'餐后腹部不适',detail:'腹部不适伴腹泻，持续三天',onset:'3 天前开始',pattern:'餐后比较明显，每日腹泻约 3 次',unknown:'诱因、既往用药情况待补充',advice:['向医生说明症状持续时间，以及排便次数的变化。','带上已有检查资料，便于医生对照。'],caution:'如出现剧烈腹痛、便血或明显脱水，请及时就医。',prep:{checked:[],questions:'这种情况需要做哪些检查？\n饮食方面需要注意什么？',saved:false},visit:{date:'',department:'',summary:'',followup:'',saved:false}},
      {id:'b',date:'2026.09.22',name:'咳嗽与咽部不适',detail:'咳嗽伴咽部不适，病因待医生评估',onset:'5 天前开始',pattern:'夜间咳嗽较明显',unknown:'诱因、当前用药待核对',advice:['记录咳嗽出现的时间，以及伴随症状。','就诊时告知医生目前正在使用的药物。'],caution:'如出现呼吸困难、咯血或症状快速恶化，请及时就医。',prep:{checked:['reports'],questions:'夜间咳嗽比较明显，需要进一步检查吗？',saved:true},visit:{date:'',department:'',summary:'',followup:'',saved:false}},
      {id:'c',date:'2026.09.10',name:'皮肤瘙痒',detail:'皮肤瘙痒，具体诱因尚待核对',onset:'约一周前开始',pattern:'夜间偶有瘙痒',unknown:'近期接触物与过敏史待核对',advice:['记录瘙痒部位和出现时间。','告知医生近期使用的药物和护理用品。'],caution:'如果出现呼吸困难或面部、口唇肿胀，请立即就医。',prep:{checked:['reports','medicines'],questions:'是否需要调整目前的护理方式？',saved:true},visit:{date:'2026-09-12',department:'皮肤科',summary:'已向医生说明症状与近期使用的护理用品。',followup:'根据医生安排复诊。',saved:true}},
    ];
    let selectedId='a',stage='summary',toastTimer;
    const $=id=>document.getElementById(id);
    const current=()=>records.find(record=>record.id===selectedId);
    const escape=value=>String(value??'').replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    function toast(message){clearTimeout(toastTimer);$('toast').textContent=message;toastTimer=setTimeout(()=>{$('toast').textContent='';},4200);}
    function renderList(){const query=$('search-records').value.trim();const visible=records.filter(record=>(record.name+record.date+record.detail).includes(query));$('record-count').textContent=records.length+' 份';$('no-records').hidden=visible.length>0;$('record-list').innerHTML=visible.map(record=>`<li><button class="record-button px-6 py-3 rounded-full font-medium transition-colors duration-300" data-record="${record.id}" aria-label="${escape(record.name)}，${record.date}" aria-current="${record.id===selectedId}"><time class="record-date">${record.date}</time><span class="record-name">${escape(record.name)}</span><span class="record-state">${record.visit.saved?'<svg aria-hidden="true"><use href="#check"/></svg>已记录就诊结果':record.prep.saved?leaf+'已保存就诊准备':'可回顾问诊总结'}</span></button></li>`).join('');}
    function stash(){const record=current();if(stage==='preparation'&&$('prep-questions')){record.prep.questions=$('prep-questions').value;record.prep.checked=[...document.querySelectorAll('[data-check]:checked')].map(input=>input.dataset.check);}if(stage==='visit'&&$('visit-summary')){record.visit.date=$('visit-date').value;record.visit.department=$('visit-department').value;record.visit.summary=$('visit-summary').value;record.visit.followup=$('visit-followup').value;}}
    function summaryText(){const record=current();return `就诊摘要（患者自述，供医生核对）\n\n本次问题：${record.name}\n起病时间：${record.onset}\n主要表现：${record.pattern}\n待核对：${record.unknown}\n\n想问医生：\n${record.prep.questions||'暂无补充'}\n\n患者自述不等于医生确认。`;}
    function heading(title,record){return `<header class="article-heading"><div><h2 id="panel-title">${title}</h2><p>${escape(record.name)}${stage==='summary'?' · 本次问诊':''}</p></div><time>${record.date}</time></header>`;}
    function renderPanel(){const record=current();document.querySelectorAll('[data-stage]').forEach(button=>{if(button.dataset.stage===stage)button.setAttribute('aria-current','step');else button.removeAttribute('aria-current');});let html=heading(stage==='summary'?'本次问诊总结':stage==='preparation'?'准备去就诊':'记录就诊结果',record);
      if(stage==='summary')html+=`<p class="note accent">${leaf}AI 辅助整理，供你与医生一起核对</p><h3 class="summary-title">${escape(record.detail)}</h3><p class="lead">先回顾这次描述的情况，再把重要信息和想问的问题带给医生。具体原因，需要结合实际诊察进一步确认。</p><hr class="divider"><div class="report-columns"><div><h3>你描述的情况</h3><dl class="facts"><div><dt>起病时间</dt><dd>${escape(record.onset)}</dd></div><div><dt>主要表现</dt><dd>${escape(record.pattern)}</dd></div><div><dt>待核对</dt><dd>${escape(record.unknown)}</dd></div></dl></div><div><h3>建议下一步</h3><ol class="simple-list">${record.advice.map(value=>`<li>${escape(value)}</li>`).join('')}</ol></div></div>${record.caution?`<p class="hand-note">${leaf}<span>需要留意：${escape(record.caution)}</span></p>`:''}<details class="details"><summary>查看整理依据与说明</summary><p>本页面为合成设计预览。展示内容模拟患者描述，不是医疗建议，也没有连接真实病历系统。</p></details><div class="article-actions"><span class="note">看完总结，可以开始整理就诊准备。</span><button class="${buttonClass} primary" data-go="preparation">准备去就诊 ${arrow}</button></div>`;
      if(stage==='preparation')html+=`<p class="note accent">${leaf}带上需要的资料，不必把所有信息记在心里。</p><hr class="divider"><h3 class="section-label">出发前，核对这几件事</h3><div class="checklist">${[['reports','带上已有检查报告或就诊资料'],['medicines','记下当前正在使用的药物'],['questions','整理这次想问医生的问题']].map(([id,label])=>`<label class="check-row"><input type="checkbox" data-check="${id}" ${record.prep.checked.includes(id)?'checked':''}><span>${label}</span></label>`).join('')}</div><label class="form-label" for="prep-questions">想问医生的问题</label><textarea id="prep-questions" class="textarea ${fieldClass}" placeholder="每行记一个问题，记不清的地方也可以写下来">${escape(record.prep.questions)}</textarea><details class="details"><summary>查看给医生的完整摘要</summary><p id="summary-preview" class="summary-preview">${escape(summaryText())}</p></details><div class="article-actions"><button class="${buttonClass} text-link" id="copy-summary">复制给医生的摘要</button><button class="${buttonClass} primary" id="save-prep">保存就诊准备 ${arrow}</button></div>`;
      if(stage==='visit')html+=`<p class="note accent">${leaf}就诊后，把医生的建议留在这份记录里。</p><hr class="divider"><form id="visit-form"><div class="two-fields"><div class="field-group"><label class="form-label" for="visit-date">就诊日期</label><input id="visit-date" type="date" class="${fieldClass}" value="${escape(record.visit.date)}"></div><div class="field-group" style="margin-top:0"><label class="form-label" for="visit-department">实际就诊科室</label><input id="visit-department" class="${fieldClass}" placeholder="填写实际就诊的科室" value="${escape(record.visit.department)}"></div></div><div class="field-group"><label class="form-label" for="visit-summary">医生说了什么？</label><textarea id="visit-summary" class="textarea ${fieldClass}" placeholder="记下医生对情况的说明、建议或用药安排">${escape(record.visit.summary)}</textarea><p class="form-help">按你记得的内容填写，以医生的正式病历和处方为准。</p></div><div class="field-group"><label class="form-label" for="visit-followup">接下来需要做什么？</label><textarea id="visit-followup" class="textarea ${fieldClass}" placeholder="例如：复查时间、需要准备的资料">${escape(record.visit.followup)}</textarea></div><div class="article-actions"><span class="note">作为你本人的就诊记录保留。</span><button type="submit" class="${buttonClass} primary">保存就诊结果 ${arrow}</button></div></form>`;
      $('panel').innerHTML=html;$('stage-footer').innerHTML=stage==='summary'?'':stage==='preparation'?`<button class="${buttonClass} text-link" data-go="summary">返回问诊总结</button><button class="${buttonClass} text-link" data-go="visit">已经看过医生？记录就诊结果 →</button>`:`<button class="${buttonClass} text-link" data-go="preparation">返回就诊准备</button>`;}
    function go(next){stash();stage=next;renderPanel();}
    document.addEventListener('click',async event=>{const recordButton=event.target.closest('[data-record]');if(recordButton){stash();selectedId=recordButton.dataset.record;stage='summary';renderList();renderPanel();return;}const navigation=event.target.closest('[data-stage],[data-go]');if(navigation){go(navigation.dataset.stage||navigation.dataset.go);return;}if(event.target.closest('#save-prep')){stash();current().prep.saved=true;renderList();toast('就诊准备已保留在本次预览中。');}if(event.target.closest('#copy-summary')){stash();try{await navigator.clipboard.writeText(summaryText());toast('已复制患者自述摘要。');}catch{const preview=$('summary-preview');if(preview){preview.closest('details').open=true;preview.textContent=summaryText();}toast('复制未完成；请回到就诊准备，在完整摘要中手动选择并复制。');}}});
    document.addEventListener('input',event=>{if(event.target.id==='search-records')renderList();else{stash();if($('summary-preview'))$('summary-preview').textContent=summaryText();}});
    document.addEventListener('change',event=>{if(event.target.matches('[data-check]'))stash();});
    document.addEventListener('submit',event=>{if(event.target.id==='visit-form'){event.preventDefault();stash();current().visit.saved=true;renderList();toast('就诊结果已保留在本次预览中。');}});
    const dialog=$('new-dialog');$('new-record').addEventListener('click',()=>dialog.showModal());$('cancel-new').addEventListener('click',()=>dialog.close());$('new-form').addEventListener('submit',event=>{event.preventDefault();stash();const name=$('new-complaint').value.trim();if(!name)return;const record={id:'record-'+Date.now(),date:new Date().toISOString().slice(0,10).replaceAll('-','.'),name,detail:'本次问题已记下，尚未生成问诊总结',onset:'待补充',pattern:'待补充',unknown:'病情经过与既往情况待核对',advice:['补充病情经过和已有资料。','如需判断病情，请咨询专业医护人员。'],caution:'',prep:{checked:[],questions:'',saved:false},visit:{date:'',department:'',summary:'',followup:'',saved:false}};records.unshift(record);selectedId=record.id;stage='summary';$('search-records').value='';renderList();renderPanel();dialog.close();$('new-form').reset();toast('已创建预览记录，尚未进行真实问诊。');});
    renderList();renderPanel();
  </script>
</body>
</html>
