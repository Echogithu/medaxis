e-08/09/17 |\r\n| `/reports/:reportid` | 原件、ai、草稿、核对、关联 | 多状态轴、旧预览/修订冲突 | 本人报告及本人病例 | e-08/09/17 |\r\n| `/doctor` | 工作台及定向咨询 | 部分硬编码统计；咨询资格重查 | 页面 doctor/admin bypass；api 各自判定 | e-01/11/12，局部静态 |\r\n| `/doctor/cases` | 分配病例列表 | 固定 risk_level；非完整咨询列表 | 后端 assigned doctor | e-12 |\r\n| `/doctor/cases/:caseid` | 详情/评论/计划输入 | mock_case 混入；评论缺 handler/plan501 | 分配病例；患者全量会话查询范围疑点 | e-12/13 |\r\n| `/admin` | 仪表盘 | 统计与依赖状态待逐项联调 | admin api | e-01/19/21，路由级 |\r\n| `/admin/users` | 查询/修改/踢用户 | 最后 admin 保护；踢为删除 | admin | e-19，关键操作静态 |\r\n| `/admin/doctors` | 审核资格 | 邮件结果不可信；拒绝含删除 | admin | e-20 |\r\n| `/admin/providers` | 模型提供方配置 | 连接/保存失败未逐操作验 | admin | e-21，接口级 |\r\n| `/admin/settings` | 系统配置 | 配置状态/失败未逐操作验 | admin | e-21，接口级 |\r\n| `/admin/knowledge` | 上传与检索资料管理 | 解析/索引/审核状态 | admin | e-14/21，接口级 |\r\n| `/admin/reviews` | 审核队列 | 审核结果、驳回失败未逐项验 | admin | e-21，接口级 |\r\n| `/admin/audit-logs` | 筛选审计记录 | 空/分页/过滤；覆盖不完整 | admin | e-20 |\r\n| `/admin/notifications` | 通知/广播/读取 | 发送方/接收方软删；业务状态独立 | admin api 各操作规则 | e-21，接口级 |\r\n| `/admin/email` | 配置、模板、日志与发送 | smtp 未测试；不可承诺送达 | admin | e-21，接口级 |\r\n| `*` | 未知路由重定向 | 返回 `/` | 公共路由策略 | e-01 |\r\n\r\n**范围内未定位的规划能力：** 在 frontend/src、backend/app/api/v1、models、services 搜索 institution/research/export/case library/病例库/科研/导出，未定位机构级病例库或研究导出页面/api。researchagent 与报告 institution 字段不等于这两项能力；仓库其他范围不据此作否定结论。\r\n\r\n## 4. 历史证据，保留代价与失败\r\n\r\n| 记录 | 可引用结果 | 必须一起保留的限定 |\r\n|---|---|---|\r\n| [语义召回 2026-10-08](../semantic_recall_acceptance.md) | 同45题/4文档125片段；40正例完整覆盖28/40→32/40，跨语言0/5→4/5 | 4/5无答案仍返回候选；缓存检索p50/p95 69.97/91.14→170.37/191.71ms；专业gold审核0；不是页面/临床准确率 |\r\n| [原文支持评测](../evidence_support_evaluation.md) v4 / 2026-10-09 | 53题冻结回归，36执行、17能力缺失、0异常；语义准确率 null | 该次没有额外模型/http；专业审核0；v3的52题和baseline-v2属于旧版本，不能替换v4 |\n| [问题覆盖优化更新](../evidence_support_evaluation.md) / query-assessment-v3 | 给定候选：开发分类24/24、v4问题相关性切片15/16；完整/部分回答保留，无关误保留开发8→0、回归6→0 | 同语料非盲测；ng143仍误判；24次成功模型调用、23,957服务tokens，金额未知；每组中位1.726秒，非完整问诊；新问诊/api/保存刷新待验。不是recall@k、原文陈述支持或临床正确率 |\n| [报告切片](../patient_reports_requirements.md) 2026-10-06复核 | t1–t5有合成隔离api/db/ocr/队列/页面证据，去重与引用有实现 | t6组合、实拍ocr、linux、真实模型质量待验；当日记录演示库未迁移，本轮未复核部署 |\r\n| [诊后候选](../post_visit_ai_actions_spec.md) | 有隔离验收方法、同意/原文/幂等/来源变更场景 | 合成替身不证明真实模型、smtp、长期任务和部署 |\r\n| [openmed规则借鉴](../openmed_borrowing_acceptance.md) | 原话语境、核对、遮蔽的规则集成记录 | 不代表真实sdk接入或完整语义理解 |\r\n| [openmed sdk独立实验](../../../evals/openmed-transfer/sdk_results.md) | hold；24题非盲测，sdk断言19/28；隐私字符92/101、误遮23；数值/时长保留6/14 | 不接生产、无临床审核；cpu中位约37.1ms/加载约4.8秒不能作为产品性能基线 |\r\n| [展示素材](../../media/readme.md) 2026-10-09 | 当前前端合成api/sse预置重放，9状态gif和9png | 无模型/实际检索/业务库写入；不能证明恢复成功或真实授权 |\r\n\r\n底层本机 v4 原始记录：`../../..` 下 `.ai/tasks/2026-10-09-evidence-support/baseline-v4-authorized/report.md`；属于未随文档分发的过程材料。公开阅读优先使用上表稳定验收摘要，缺本机材料不伪造逐题复跑证据。\r\n\r\n## 5. 已发现的漂移与待核对\r\n\r\n1. 工程 backend/database 的“先关键词再 embedding”概述早于独立语义召回；本次以 e-14 为现状，未来工程同步应回链语义实验。此次不修改工程实现文档。\r\n2. doctor_prd 的 10月3日 current product 是当日事实；当前新咨询已存在，不能重复宣称整条回复联通未实现。旧病例页问题仍成立。\r\n3. docs 素材旧导航称占位，与现有 media/readme 的录制记录不一致；本次仅修导航。\r\n4. v4无额外模型调用是早先基线；同期新增query-assessment-v3已记录真实模型配对实验与最小接入。两者是不同阶段，不能以早先自然降级否定新实验，也不能把离线回放/模型实验升级成当前页面和数据库验收。最终运行态仍未核对。\n5. consultation_action 的 end 分支目前未显式限制医生角色；目标医生结束与患者取消的操作归属需单独核对，不以流程示意图作为权限证明。\r\n\r\n未覆盖：所有 provider adapter 出口、完整消息/日志数据流、管理端每个表单、数据库级全约束、当前实例配置/迁移、真实供应商处理、所有 sse/异步中断分支。全项目文档覆盖不等于所有代码逐分支审计。\r\n"},{"id":"DEVELOPMENT_READINESS","label":"开发规划就绪","html":"\u003ch1 id=\"medaxis-开发规划就绪评估\">MedAxis 开发规划就绪评估\u003c/h1>\n\u003cblockquote>\n\u003cp>Status: REVIEW · 2026-10-09 · 判定：\u003cstrong>NOT_READY\u003c/strong>\u003c/p>\n\u003cp>本判定针对全项目下一步开发规划。文档可交付、可评审；用户尚未批准整稿，关键权限/数据政策与证据缺口不能由建议代替。没有生成正式 DEVELOPMENT_HANDOFF。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"gate-matrix\">Gate Matrix\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Gate\u003c/th>\n\u003cth>Status\u003c/th>\n\u003cth>证据\u003c/th>\n\u003cth>缺口 / 下一动作\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>G1 问题证据\u003c/td>\n\u003ctd>PASS（假设模式）\u003c/td>\n\u003ctd>PRD §2明确问题、替代方式与反证\u003c/td>\n\u003ctd>无访谈；不得称需求已验证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G2 用户与任务\u003c/td>\n\u003ctd>PARTIAL（阻断）\u003c/td>\n\u003ctd>PRD §3\u003c/td>\n\u003ctd>首测人群/机构/监护模型与商业角色未裁决，见 U-01/U-05\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G3 价值与结果\u003c/td>\n\u003ctd>PASS（定义层）\u003c/td>\n\u003ctd>PRD §1/6\u003c/td>\n\u003ctd>行为变化明确；真实价值待验证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G4 MVP范围\u003c/td>\n\u003ctd>PARTIAL（阻断）\u003c/td>\n\u003ctd>PRD §4、MX目录\u003c/td>\n\u003ctd>优先级和首轮报告范围为建议，见 U-02\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G5 行为与流程\u003c/td>\n\u003ctd>PASS（定义层）\u003c/td>\n\u003ctd>USER_FLOWS、SPEC A-01–19\u003c/td>\n\u003ctd>已写主线/异常/退出；旧端与目标差距另表记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G6 领域模型\u003c/td>\n\u003ctd>PASS（定义层）\u003c/td>\n\u003ctd>DOMAIN_MODEL\u003c/td>\n\u003ctd>未知项显式保留；机构/监护扩展不能直接开发\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G7 验收与指标\u003c/td>\n\u003ctd>PARTIAL（阻断）\u003c/td>\n\u003ctd>SPEC、PRD §6、现有评测协议\u003c/td>\n\u003ctd>专业gold/真实入口基线未知；后续实验方案需裁决\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G8 风险与可行性\u003c/td>\n\u003ctd>FAIL\u003c/td>\n\u003ctd>E-12/13/16/17/20，差距矩阵\u003c/td>\n\u003ctd>旧医生范围、外发说明、保留/恢复政策与目标部署缺口\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G9 决策与一致性\u003c/td>\n\u003ctd>PARTIAL（阻断）\u003c/td>\n\u003ctd>DECISIONS、EVIDENCE §5\u003c/td>\n\u003ctd>未批准建议；旧工程概述漂移已标识，不等于同步完成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G10 Owner Review\u003c/td>\n\u003ctd>FAIL\u003c/td>\n\u003ctd>本次只授权文档整理\u003c/td>\n\u003ctd>无整稿明确 approve；不能以“继续”视为产品批准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>G11 产品承诺与证明\u003c/td>\n\u003ctd>PASS（定义层）\u003c/td>\n\u003ctd>SPEC证明表、下方能力事实\u003c/td>\n\u003ctd>每项P0列失败/取证/边界；未升级现有成熟度\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>G8/G10失败，关键 PARTIAL 也未解除，因此 NOT_READY。通过的定义门不代表运行验收。批准范围后应重新计算全部门禁，而非只修改状态标签。\u003c/p>\n\u003ch2 id=\"实现差距矩阵\">实现差距矩阵\u003c/h2>\n\u003cp>“获准/目标”一列仅 Q1–Q3引用既有文档裁决，其余为待批准建议。本次请求不授权修复下面问题。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>领域\u003c/th>\n\u003cth>当前行为\u003c/th>\n\u003cth>获准/目标行为来源\u003c/th>\n\u003cth>可观察差距\u003c/th>\n\u003cth>规划影响 / 下一步\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>患者整理与恢复\u003c/td>\n\u003ctd>有病例/准备/反馈API、版本和部分历史验证\u003c/td>\n\u003ctd>原专项规格；本次整合仍 REVIEW\u003c/td>\n\u003ctd>当前环境、失败恢复组合尚未重跑\u003c/td>\n\u003ctd>先隔离合成冒烟，再目标环境核对\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>独立报告\u003c/td>\n\u003ctd>本地取字/同意/候选/核对/关联/回收代码\u003c/td>\n\u003ctd>原报告需求 IMPLEMENTING\u003c/td>\n\u003ctd>历史演示库未迁移；T6/实拍/Linux/模型待验证\u003c/td>\n\u003ctd>先确认环境，完成组合验证；不可直接宣称整模块可用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>定向咨询\u003c/td>\n\u003ctd>新咨询有认证/快照/单活动/回复/撤销\u003c/td>\n\u003ctd>DOCTOR_PRD Q1/Q2，来源内已确认\u003c/td>\n\u003ctd>当前部署/并发/撤销组合未查\u003c/td>\n\u003ctd>独立咨询纵向验证；不以旧页代验\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>旧医生页\u003c/td>\n\u003ctd>MOCK_CASE 混入、固定风险/统计、comment未定位、plan501\u003c/td>\n\u003ctd>Q1健康建议，不处方/调药；MX-15待整合裁决\u003c/td>\n\u003ctd>演示字段和“调整用药”入口与目标不一致\u003c/td>\n\u003ctd>先裁决保留/替换入口；修复计划另行授权\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>医生权限\u003c/td>\n\u003ctd>旧 helper仅角色；详情按患者全会话查询\u003c/td>\n\u003ctd>Q2定向对象；MX-15建议跨入口一致\u003c/td>\n\u003ctd>认证和病例/咨询快照范围未统一\u003c/td>\n\u003ctd>阻断扩大协作；先双医生/双病例权限spike\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>咨询结束动作\u003c/td>\n\u003ctd>end分支未显式限定医生\u003c/td>\n\u003ctd>目标医生结束、患者取消\u003c/td>\n\u003ctd>actor约束与产品操作归属需核对\u003c/td>\n\u003ctd>与MX-15同批验证，不靠UI判断安全\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>数据外发\u003c/td>\n\u003ctd>旧附件可发原件；新报告只逐次同意文字\u003c/td>\n\u003ctd>既有报告隐私决定，非全平台承诺\u003c/td>\n\u003ctd>旧入口披露/全出口与接收方保留未完整核对\u003c/td>\n\u003ctd>阻断统一隐私承诺；明确两入口政策\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>运营审核\u003c/td>\n\u003ctd>邮件失败仍可能返回已发送；kick实际删除\u003c/td>\n\u003ctd>MX-16可信结果为建议\u003c/td>\n\u003ctd>状态误导、恢复/审计覆盖不完整\u003c/td>\n\u003ctd>先明确删除/停用/发送语义，再规划\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>机构/研究\u003c/td>\n\u003ctd>本次范围未定位实现入口\u003c/td>\n\u003ctd>DOCTOR_PRD Q3另行授权/审核\u003c/td>\n\u003ctd>机构成员、研究用途/导出/撤销未实现定义\u003c/td>\n\u003ctd>延后，不继承咨询权限\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AI质量/成本\u003c/td>\n\u003ctd>有固定检索实验；专业gold0、语义支持率null\u003c/td>\n\u003ctd>现有评测协议；PRD §6\u003c/td>\n\u003ctd>无真实入口成本、专业支持/适用性基线\u003c/td>\n\u003ctd>先专业核对与受控采样，不能给准确率承诺\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"能力事实表\">能力事实表\u003c/h2>\n\u003cp>YES/PARTIAL是设计/代码覆盖；HISTORICAL仅指链接的旧记录；NOT_RUN是本轮未执行；UNKNOWN是无足够证据。所有真人列目前均不能声称专业有效性已验证。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>能力\u003c/th>\n\u003cth>已设计\u003c/th>\n\u003cth>已实现\u003c/th>\n\u003cth>自动化 / 集成证据\u003c/th>\n\u003cth>本轮目标环境\u003c/th>\n\u003cth>真人/专业\u003c/th>\n\u003cth>降级 / 当前允许表述\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>多轮采集/来源报告\u003c/td>\n\u003ctd>YES\u003c/td>\n\u003ctd>PARTIAL\u003c/td>\n\u003ctd>HISTORICAL：\u003ca href=\"../CONSULTATION_OPTIMIZATION_ACCEPTANCE.md\">优化验收\u003c/a>\u003c/td>\n\u003ctd>NOT_RUN\u003c/td>\n\u003ctd>UNKNOWN\u003c/td>\n\u003ctd>可保留输入；有来源门禁，不宣称医学支持已保证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>病例/准备/自报恢复\u003c/td>\n\u003ctd>YES\u003c/td>\n\u003ctd>YES\u003c/td>\n\u003ctd>HISTORICAL：\u003ca href=\"../PATIENT_DEMO_CLOSURE_REVIEW.md\">患者闭环审查\u003c/a>\u003c/td>\n\u003ctd>NOT_RUN\u003c/td>\n\u003ctd>UNKNOWN\u003c/td>\n\u003ctd>仅已保存资料；不承诺所有草稿/聊天同步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新报告中心\u003c/td>\n\u003ctd>YES\u003c/td>\n\u003ctd>PARTIAL\u003c/td>\n\u003ctd>HISTORICAL：T1–T5；T6待验\u003c/td>\n\u003ctd>NOT_RUN\u003c/td>\n\u003ctd>UNKNOWN\u003c/td>\n\u003ctd>原件与手动整理；完整模块未验收\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>手动档案/计划/提醒\u003c/td>\n\u003ctd>YES\u003c/td>\n\u003ctd>PARTIAL\u003c/td>\n\u003ctd>HISTORICAL：专项记录\u003c/td>\n\u003ctd>NOT_RUN\u003c/td>\n\u003ctd>UNKNOWN\u003c/td>\n\u003ctd>本人记录路径；不承诺实时监护/严格一次\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>诊后AI候选\u003c/td>\n\u003ctd>YES\u003c/td>\n\u003ctd>YES\u003c/td>\n\u003ctd>HISTORICAL：合成隔离入口\u003c/td>\n\u003ctd>NOT_RUN\u003c/td>\n\u003ctd>UNKNOWN\u003c/td>\n\u003ctd>需逐项确认；无真实模型质量证明\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>定向咨询\u003c/td>\n\u003ctd>YES\u003c/td>\n\u003ctd>YES（静态链路）\u003c/td>\n\u003ctd>测试源及旧记录未穷尽\u003c/td>\n\u003ctd>NOT_RUN\u003c/td>\n\u003ctd>UNKNOWN\u003c/td>\n\u003ctd>只按指定授权；旧页不作为真实资料证明\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>旧医生工作台\u003c/td>\n\u003ctd>PARTIAL\u003c/td>\n\u003ctd>PARTIAL\u003c/td>\n\u003ctd>无完整闭环证据\u003c/td>\n\u003ctd>NOT_RUN\u003c/td>\n\u003ctd>UNKNOWN\u003c/td>\n\u003ctd>占位/501明确，不能称成熟工作台\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>管理运营\u003c/td>\n\u003ctd>PARTIAL\u003c/td>\n\u003ctd>PARTIAL\u003c/td>\n\u003ctd>未逐操作核对\u003c/td>\n\u003ctd>NOT_RUN\u003c/td>\n\u003ctd>UNKNOWN\u003c/td>\n\u003ctd>有页面/接口，不称全量审核审计可靠\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>独立语义召回\u003c/td>\n\u003ctd>YES\u003c/td>\n\u003ctd>YES\u003c/td>\n\u003ctd>HISTORICAL：45题真实向量/PG对照\u003c/td>\n\u003ctd>NOT_RUN\u003c/td>\n\u003ctd>gold审核0\u003c/td>\n\u003ctd>固定语料覆盖实验；不称页面/临床准确率\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>给定候选问题覆盖\u003c/td>\n\u003ctd>YES\u003c/td>\n\u003ctd>YES（同期接入代码）\u003c/td>\n\u003ctd>HISTORICAL：query-assessment-v3模型对照与离线回放\u003c/td>\n\u003ctd>NOT_RUN\u003c/td>\n\u003ctd>gold专业审核仍待办\u003c/td>\n\u003ctd>分类/排序改善保留NG143误判和额外成本；非全文支持或临床正确率\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>机构病例库/研究导出\u003c/td>\n\u003ctd>REVIEW目标\u003c/td>\n\u003ctd>范围内未定位\u003c/td>\n\u003ctd>无可引用证据\u003c/td>\n\u003ctd>NOT_RUN\u003c/td>\n\u003ctd>UNKNOWN\u003c/td>\n\u003ctd>计划方向，不提供能力宣称\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"风险与必要实验\">风险与必要实验\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>价值/可用性：\u003c/strong> 观察合成病例整理、来源辨识与找回任务；记录退出/错误路径，否证“整理比人工容易”的假设。\u003c/li>\n\u003cli>\u003cstrong>权限：\u003c/strong> 双患者、双医生、跨病例、失效认证与取消后的读取/发布，覆盖新咨询及旧医生API；拒绝越权不能只看前端。\u003c/li>\n\u003cli>\u003cstrong>报告可行性：\u003c/strong> 当前目标环境迁移/OCR模型/任务依赖核对，之后合成组合恢复；真实照片和Linux另验证。\u003c/li>\n\u003cli>\u003cstrong>AI质量：\u003c/strong> 冻结版本、专业gold、无答案与中断单列；真实入口成本/延迟按授权预算采集。专业审核人待指定。\u003c/li>\n\u003cli>\u003cstrong>商业/隐私：\u003c/strong> 确认机构/购买者、服务责任、保留和供应商用途；法律适用性需专业审查，本包不提供合规结论。\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"下一步边界\">下一步边界\u003c/h2>\n\u003cp>唯一下一动作：评审 \u003ca href=\"DECISIONS.md\">DECISIONS\u003c/a> 的范围、权限与数据政策，更新整稿与门禁。允许继续阅读/评审；不能从此状态直接进入真实数据开发、迁移、模型调用、机构导出或发布。后续批准也只进入开发规划，实施和目标环境授权需分别明确。\u003c/p>\n","search":"# medaxis 开发规划就绪评估\n\n> status: review · 2026-10-09 · 判定：**not_ready**\n>\n> 本判定针对全项目下一步开发规划。文档可交付、可评审；用户尚未批准整稿，关键权限/数据政策与证据缺口不能由建议代替。没有生成正式 development_handoff。\n\n## gate matrix\n\n| gate | status | 证据 | 缺口 / 下一动作 |\n|---|---|---|---|\n| g1 问题证据 | pass（假设模式） | prd §2明确问题、替代方式与反证 | 无访谈；不得称需求已验证 |\n| g2 用户与任务 | partial（阻断） | prd §3 | 首测人群/机构/监护模型与商业角色未裁决，见 u-01/u-05 |\n| g3 价值与结果 | pass（定义层） | prd §1/6 | 行为变化明确；真实价值待验证 |\n| g4 mvp范围 | partial（阻断） | prd §4、mx目录 | 优先级和首轮报告范围为建议，见 u-02 |\n| g5 行为与流程 | pass（定义层） | user_flows、spec a-01–19 | 已写主线/异常/退出；旧端与目标差距另表记录 |\n| g6 领域模型 | pass（定义层） | domain_model | 未知项显式保留；机构/监护扩展不能直接开发 |\n| g7 验收与指标 | partial（阻断） | spec、prd §6、现有评测协议 | 专业gold/真实入口基线未知；后续实验方案需裁决 |\n| g8 风险与可行性 | fail | e-12/13/16/17/20，差距矩阵 | 旧医生范围、外发说明、保留/恢复政策与目标部署缺口 |\n| g9 决策与一致性 | partial（阻断） | decisions、evidence §5 | 未批准建议；旧工程概述漂移已标识，不等于同步完成 |\n| g10 owner review | fail | 本次只授权文档整理 | 无整稿明确 approve；不能以“继续”视为产品批准 |\n| g11 产品承诺与证明 | pass（定义层） | spec证明表、下方能力事实 | 每项p0列失败/取证/边界；未升级现有成熟度 |\n\ng8/g10失败，关键 partial 也未解除，因此 not_ready。通过的定义门不代表运行验收。批准范围后应重新计算全部门禁，而非只修改状态标签。\n\n## 实现差距矩阵\n\n“获准/目标”一列仅 q1–q3引用既有文档裁决，其余为待批准建议。本次请求不授权修复下面问题。\n\n| 领域 | 当前行为 | 获准/目标行为来源 | 可观察差距 | 规划影响 / 下一步 |\n|---|---|---|---|---|\n| 患者整理与恢复 | 有病例/准备/反馈api、版本和部分历史验证 | 原专项规格；本次整合仍 review | 当前环境、失败恢复组合尚未重跑 | 先隔离合成冒烟，再目标环境核对 |\n| 独立报告 | 本地取字/同意/候选/核对/关联/回收代码 | 原报告需求 implementing | 历史演示库未迁移；t6/实拍/linux/模型待验证 | 先确认环境，完成组合验证；不可直接宣称整模块可用 |\n| 定向咨询 | 新咨询有认证/快照/单活动/回复/撤销 | doctor_prd q1/q2，来源内已确认 | 当前部署/并发/撤销组合未查 | 独立咨询纵向验证；不以旧页代验 |\n| 旧医生页 | mock_case 混入、固定风险/统计、comment未定位、plan501 | q1健康建议，不处方/调药；mx-15待整合裁决 | 演示字段和“调整用药”入口与目标不一致 | 先裁决保留/替换入口；修复计划另行授权 |\n| 医生权限 | 旧 helper仅角色；详情按患者全会话查询 | q2定向对象；mx-15建议跨入口一致 | 认证和病例/咨询快照范围未统一 | 阻断扩大协作；先双医生/双病例权限spike |\n| 咨询结束动作 | end分支未显式限定医生 | 目标医生结束、患者取消 | actor约束与产品操作归属需核对 | 与mx-15同批验证，不靠ui判断安全 |\n| 数据外发 | 旧附件可发原件；新报告只逐次同意文字 | 既有报告隐私决定，非全平台承诺 | 旧入口披露/全出口与接收方保留未完整核对 | 阻断统一隐私承诺；明确两入口政策 |\n| 运营审核 | 邮件失败仍可能返回已发送；kick实际删除 | mx-16可信结果为建议 | 状态误导、恢复/审计覆盖不完整 | 先明确删除/停用/发送语义，再规划 |\n| 机构/研究 | 本次范围未定位实现入口 | doctor_prd q3另行授权/审核 | 机构成员、研究用途/导出/撤销未实现定义 | 延后，不继承咨询权限 |\n| ai质量/成本 | 有固定检索实验；专业gold0、语义支持率null | 现有评测协议；prd §6 | 无真实入口成本、专业支持/适用性基线 | 先专业核对与受控采样，不能给准确率承诺 |\n\n## 能力事实表\n\nyes/partial是设计/代码覆盖；historical仅指链接的旧记录；not_run是本轮未执行；unknown是无足够证据。所有真人列目前均不能声称专业有效性已验证。\n\n| 能力 | 已设计 | 已实现 | 自动化 / 集成证据 | 本轮目标环境 | 真人/专业 | 降级 / 当前允许表述 |\n|---|---|---|---|---|---|---|\n| 多轮采集/来源报告 | yes | partial | historical：[优化验收](../consultation_optimization_acceptance.md) | not_run | unknown | 可保留输入；有来源门禁，不宣称医学支持已保证 |\n| 病例/准备/自报恢复 | yes | yes | historical：[患者闭环审查](../patient_demo_closure_review.md) | not_run | unknown | 仅已保存资料；不承诺所有草稿/聊天同步 |\n| 新报告中心 | yes | partial | historical：t1–t5；t6待验 | not_run | unknown | 原件与手动整理；完整模块未验收 |\n| 手动档案/计划/提醒 | yes | partial | historical：专项记录 | not_run | unknown | 本人记录路径；不承诺实时监护/严格一次 |\n| 诊后ai候选 | yes | yes | historical：合成隔离入口 | not_run | unknown | 需逐项确认；无真实模型质量证明 |\n| 定向咨询 | yes | yes（静态链路） | 测试源及旧记录未穷尽 | not_run | unknown | 只按指定授权；旧页不作为真实资料证明 |\n| 旧医生工作台 | partial | partial | 无完整闭环证据 | not_run | unknown | 占位/501明确，不能称成熟工作台 |\n| 管理运营 | partial | partial | 未逐操作核对 | not_run | unknown | 有页面/接口，不称全量审核审计可靠 |\n| 独立语义召回 | yes | yes | historical：45题真实向量/pg对照 | not_run | gold审核0 | 固定语料覆盖实验；不称页面/临床准确率 |\n| 给定候选问题覆盖 | yes | yes（同期接入代码） | historical：query-assessment-v3模型对照与离线回放 | not_run | gold专业审核仍待办 | 分类/排序改善保留ng143误判和额外成本；非全文支持或临床正确率 |\n| 机构病例库/研究导出 | review目标 | 范围内未定位 | 无可引用证据 | not_run | unknown | 计划方向，不提供能力宣称 |\n\n## 风险与必要实验\n\n1. **价值/可用性：** 观察合成病例整理、来源辨识与找回任务；记录退出/错误路径，否证“整理比人工容易”的假设。\n2. **权限：** 双患者、双医生、跨病例、失效认证与取消后的读取/发布，覆盖新咨询及旧医生api；拒绝越权不能只看前端。\n3. **报告可行性：** 当前目标环境迁移/ocr模型/任务依赖核对，之后合成组合恢复；真实照片和linux另验证。\n4. **ai质量：** 冻结版本、专业gold、无答案与中断单列；真实入口成本/延迟按授权预算采集。专业审核人待指定。\n5. **商业/隐私：** 确认机构/购买者、服务责任、保留和供应商用途；法律适用性需专业审查，本包不提供合规结论。\n\n## 下一步边界\n\n唯一下一动作：评审 [decisions](decisions.md) 的范围、权限与数据政策，更新整稿与门禁。允许继续阅读/评审；不能从此状态直接进入真实数据开发、迁移、模型调用、机构导出或发布。后续批准也只进入开发规划，实施和目标环境授权需分别明确。\n"},{"id":"DECISIONS","label":"决策与开放项","html":"\u003ch1 id=\"medaxis-决策与开放项\">MedAxis 决策与开放项\u003c/h1>\n\u003cblockquote>\n\u003cp>Status: REVIEW · 2026-10-09 · 决定、假设与事实前提分开记录\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"已有来源的决定\">已有来源的决定\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>类型\u003c/th>\n\u003cth>内容\u003c/th>\n\u003cth>来源 / 当前生效范围\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>O-01\u003c/td>\n\u003ctd>OWNER_DECISION\u003c/td>\n\u003ctd>全项目产品梳理，PRD与配套可视化文档\u003c/td>\n\u003ctd>本次用户请求；仅文档授权\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>O-02\u003c/td>\n\u003ctd>OWNER_DECISION（来源内记载）\u003c/td>\n\u003ctd>医生首期健康咨询与持续留言，不处方/调药/正式诊断\u003c/td>\n\u003ctd>\u003ca href=\"../DOCTOR_PRD.md#11-%E5%B7%B2%E7%A1%AE%E8%AE%A4%E5%86%B3%E5%AE%9A\">DOCTOR_PRD Q1\u003c/a>；不是本次整稿批准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>O-03\u003c/td>\n\u003ctd>OWNER_DECISION（来源内记载）\u003c/td>\n\u003ctd>同病例单一活动医生，取消后改选，不长期绑定\u003c/td>\n\u003ctd>\u003ca href=\"../DOCTOR_PRD.md#11-%E5%B7%B2%E7%A1%AE%E8%AE%A4%E5%86%B3%E5%AE%9A\">DOCTOR_PRD Q2\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>O-04\u003c/td>\n\u003ctd>OWNER_DECISION（来源内记载）\u003c/td>\n\u003ctd>病例库仅同机构认证医生，另行患者同意并脱敏审核\u003c/td>\n\u003ctd>\u003ca href=\"../DOCTOR_PRD.md#11-%E5%B7%B2%E7%A1%AE%E8%AE%A4%E5%86%B3%E5%AE%9A\">DOCTOR_PRD Q3\u003c/a>；实现未定位\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>O-05\u003c/td>\n\u003ctd>OWNER_DECISION（专项来源）\u003c/td>\n\u003ctd>新报告中心本地取字，逐次预览并同意仅发文字\u003c/td>\n\u003ctd>\u003ca href=\"../PATIENT_REPORTS_REQUIREMENTS.md#6-%E9%9A%90%E7%A7%81%E4%B8%8E%E6%9D%83%E9%99%90%E5%B7%B2%E7%A1%AE%E8%AE%A4%E9%9A%90%E7%A7%81%E6%96%B9%E5%BC%8F\">报告需求 §6\u003c/a>；不能扩展到旧附件\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>决定依赖的事实仍需独立验证。例如“采用同机构范围”不能证明机构身份与成员模型已有实现；“同意发送脱敏文字”不能证明文字绝无身份残留。\u003c/p>\n\u003ch2 id=\"本包采用的假设\">本包采用的假设\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>ASSUMPTION\u003c/th>\n\u003cth>理由与可修改条件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>H-01\u003c/td>\n\u003ctd>主要读者为产品评审与研发协作\u003c/td>\n\u003ctd>用户要求产品文档；已询问可选偏好但未据沉默提升为裁决\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H-02\u003c/td>\n\u003ctd>首轮价值主线以患者整理与恢复为核心\u003c/td>\n\u003ctd>当前已有实现，取证范围较小；如用户选医生优先则重评MVP\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H-03\u003c/td>\n\u003ctd>用合成案例与成年人做首轮任务验证\u003c/td>\n\u003ctd>无监护/专业流程证据；真实人群需另行界定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H-04\u003c/td>\n\u003ctd>PRD优先级与迭代关口为建议\u003c/td>\n\u003ctd>缺少正式全项目取舍；不生成日期/人力/成本承诺\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>H-05\u003c/td>\n\u003ctd>文档放既有产品目录的 medaxis 子集\u003c/td>\n\u003ctd>保留原专项细节和历史审查，新增全项目整合层；不是新数据库/开发目录规范\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"开放项与建议取证\">开放项与建议取证\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>UNKNOWN / 待裁决\u003c/th>\n\u003cth>为什么影响产品\u003c/th>\n\u003cth>建议下一动作 / 裁决者\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>U-01\u003c/td>\n\u003ctd>首测人群、成年/监护关系、谁是实际资料主体\u003c/td>\n\u003ctd>决定身份与授权，不由指南语料决定\u003c/td>\n\u003ctd>Owner明确实验用户；监护模型与专业评审另议\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>U-02\u003c/td>\n\u003ctd>首轮MVP是否纳入独立报告、医生咨询\u003c/td>\n\u003ctd>决定完整闭环和验证成本\u003c/td>\n\u003ctd>Owner选择首个纵向切片；同步PRD/Readiness\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>U-03\u003c/td>\n\u003ctd>旧医生页保留、替换或分离演示，如何统一授权\u003c/td>\n\u003ctd>现有演示字段和全患者会话查询与咨询目标冲突\u003c/td>\n\u003ctd>先权限/页面spike，再由Owner裁决范围\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>U-04\u003c/td>\n\u003ctd>保留时长、永久清理/备份、外部供应商用途与保留\u003c/td>\n\u003ctd>影响退出承诺；现有代码不足以答复\u003c/td>\n\u003ctd>Owner指定政策负责人/专业审查，核对接收方证据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>U-05\u003c/td>\n\u003ctd>医生机构成员身份、病例库发布和研究授权/字段\u003c/td>\n\u003ctd>同机构与研究均不是普通doctor role\u003c/td>\n\u003ctd>在授权与机构模型明确前延后\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>U-06\u003c/td>\n\u003ctd>专业gold审核人、适用性评估和质量门限\u003c/td>\n\u003ctd>目前无专业基线，模型复核不能代替\u003c/td>\n\u003ctd>指定专业审核与固定方案，不先填准确率\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>U-07\u003c/td>\n\u003ctd>真实入口模型预算、token费用、延迟目标\u003c/td>\n\u003ctd>演示请求额度不是生产成本模型\u003c/td>\n\u003ctd>Owner授权小样本预算后采集；再设目标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>U-08\u003c/td>\n\u003ctd>旧聊天原件外发的披露、同意或入口取舍\u003c/td>\n\u003ctd>与新报告隐私边界不同\u003c/td>\n\u003ctd>分入口产品审查+外发审计，不推广统一承诺\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>U-09\u003c/td>\n\u003ctd>账号kick/审核拒绝删除与停用、恢复语义\u003c/td>\n\u003ctd>删除与撤销token不能混为可恢复停用\u003c/td>\n\u003ctd>Owner裁决动作；核验关联数据与审计\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>U-10\u003c/td>\n\u003ctd>通知、邮件可靠性与咨询响应预期\u003c/td>\n\u003ctd>用户可能误解为即时医生/实时监护\u003c/td>\n\u003ctd>定义服务可用性与告知文案；送达与处理分离\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>U-11\u003c/td>\n\u003ctd>当前部署/迁移/模型/索引版本\u003c/td>\n\u003ctd>静态代码和历史容器不是当前运行保证\u003c/td>\n\u003ctd>无副作用环境核对后安排合成恢复测试\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>U-12\u003c/td>\n\u003ctd>商业客户、付费方式、运营owner及反馈复盘触发\u003c/td>\n\u003ctd>无法从功能规模推导商业成立\u003c/td>\n\u003ctd>访谈/责任裁决；出现首轮反馈或核心失败时复盘\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"产品批准与变更规则\">产品批准与变更规则\u003c/h2>\n\u003cp>“继续写文档”不等于 approve 产品范围。整稿批准时记录明确内容和保留 concern，写回 PRD、专项增量、Readiness 与生命周期状态；未通过的事实门不因批准自动变真。\u003c/p>\n\u003cp>新用户、能力承诺、授权或指标语义变化回到产品定义；已有获准行为不变但实现失败，进入缺陷规划；仅证据缺失优先补验证。病例库/研究进入范围时重开机构与数据门，不以本次文档授权执行导出。\u003c/p>\n\u003ch2 id=\"反馈与-bad-case\">反馈与 Bad Case\u003c/h2>\n\u003cp>反馈owner待指定；建议复盘触发为首轮合成可用性测试结束、关键权限/隐私失败或批准范围变化（ASSUMPTION）。AI问题回流到既有 \u003ca href=\"../EVALUATION_PROTOCOL.md\">EVALUATION_PROTOCOL\u003c/a> 与原文支持评测记录，保留题集/来源/模型/工具版本及失败原因。收集允许范围为合成案例及经授权的去标识观察；不默认抓生产日志、训练或自动部署。\u003c/p>\n","search":"# medaxis 决策与开放项\n\n> status: review · 2026-10-09 · 决定、假设与事实前提分开记录\n\n## 已有来源的决定\n\n| id | 类型 | 内容 | 来源 / 当前生效范围 |\n|---|---|---|---|\n| o-01 | owner_decision | 全项目产品梳理，prd与配套可视化文档 | 本次用户请求；仅文档授权 |\n| o-02 | owner_decision（来源内记载） | 医生首期健康咨询与持续留言，不处方/调药/正式诊断 | [doctor_prd q1](../doctor_prd.md#11-已确认决定)；不是本次整稿批准 |\n| o-03 | owner_decision（来源内记载） | 同病例单一活动医生，取消后改选，不长期绑定 | [doctor_prd q2](../doctor_prd.md#11-已确认决定) |\n| o-04 | owner_decision（来源内记载） | 病例库仅同机构认证医生，另行患者同意并脱敏审核 | [doctor_prd q3](../doctor_prd.md#11-已确认决定)；实现未定位 |\n| o-05 | owner_decision（专项来源） | 新报告中心本地取字，逐次预览并同意仅发文字 | [报告需求 §6](../patient_reports_requirements.md#6-隐私与权限已确认隐私方式)；不能扩展到旧附件 |\n\n决定依赖的事实仍需独立验证。例如“采用同机构范围”不能证明机构身份与成员模型已有实现；“同意发送脱敏文字”不能证明文字绝无身份残留。\n\n## 本包采用的假设\n\n| id | assumption | 理由与可修改条件 |\n|---|---|---|\n| h-01 | 主要读者为产品评审与研发协作 | 用户要求产品文档；已询问可选偏好但未据沉默提升为裁决 |\n| h-02 | 首轮价值主线以患者整理与恢复为核心 | 当前已有实现，取证范围较小；如用户选医生优先则重评mvp |\n| h-03 | 用合成案例与成年人做首轮任务验证 | 无监护/专业流程证据；真实人群需另行界定 |\n| h-04 | prd优先级与迭代关口为建议 | 缺少正式全项目取舍；不生成日期/人力/成本承诺 |\n| h-05 | 文档放既有产品目录的 medaxis 子集 | 保留原专项细节和历史审查，新增全项目整合层；不是新数据库/开发目录规范 |\n\n## 开放项与建议取证\n\n| id | unknown / 待裁决 | 为什么影响产品 | 建议下一动作 / 裁决者 |\n|---|---|---|---|\n| u-01 | 首测人群、成年/监护关系、谁是实际资料主体 | 决定身份与授权，不由指南语料决定 | owner明确实验用户；监护模型与专业评审另议 |\n| u-02 | 首轮mvp是否纳入独立报告、医生咨询 | 决定完整闭环和验证成本 | owner选择首个纵向切片；同步prd/readiness |\n| u-03 | 旧医生页保留、替换或分离演示，如何统一授权 | 现有演示字段和全患者会话查询与咨询目标冲突 | 先权限/页面spike，再由owner裁决范围 |\n| u-04 | 保留时长、永久清理/备份、外部供应商用途与保留 | 影响退出承诺；现有代码不足以答复 | owner指定政策负责人/专业审查，核对接收方证据 |\n| u-05 | 医生机构成员身份、病例库发布和研究授权/字段 | 同机构与研究均不是普通doctor role | 在授权与机构模型明确前延后 |\n| u-06 | 专业gold审核人、适用性评估和质量门限 | 目前无专业基线，模型复核不能代替 | 指定专业审核与固定方案，不先填准确率 |\n| u-07 | 真实入口模型预算、token费用、延迟目标 | 演示请求额度不是生产成本模型 | owner授权小样本预算后采集；再设目标 |\n| u-08 | 旧聊天原件外发的披露、同意或入口取舍 | 与新报告隐私边界不同 | 分入口产品审查+外发审计，不推广统一承诺 |\n| u-09 | 账号kick/审核拒绝删除与停用、恢复语义 | 删除与撤销token不能混为可恢复停用 | owner裁决动作；核验关联数据与审计 |\n| u-10 | 通知、邮件可靠性与咨询响应预期 | 用户可能误解为即时医生/实时监护 | 定义服务可用性与告知文案；送达与处理分离 |\n| u-11 | 当前部署/迁移/模型/索引版本 | 静态代码和历史容器不是当前运行保证 | 无副作用环境核对后安排合成恢复测试 |\n| u-12 | 商业客户、付费方式、运营owner及反馈复盘触发 | 无法从功能规模推导商业成立 | 访谈/责任裁决；出现首轮反馈或核心失败时复盘 |\n\n## 产品批准与变更规则\n\n“继续写文档”不等于 approve 产品范围。整稿批准时记录明确内容和保留 concern，写回 prd、专项增量、readiness 与生命周期状态；未通过的事实门不因批准自动变真。\n\n新用户、能力承诺、授权或指标语义变化回到产品定义；已有获准行为不变但实现失败，进入缺陷规划；仅证据缺失优先补验证。病例库/研究进入范围时重开机构与数据门，不以本次文档授权执行导出。\n\n## 反馈与 bad case\n\n反馈owner待指定；建议复盘触发为首轮合成可用性测试结束、关键权限/隐私失败或批准范围变化（assumption）。ai问题回流到既有 [evaluation_protocol](../evaluation_protocol.md) 与原文支持评测记录，保留题集/来源/模型/工具版本及失败原因。收集允许范围为合成案例及经授权的去标识观察；不默认抓生产日志、训练或自动部署。\n"},{"id":"WORKFLOW","label":"生命周期","html":"\u003ch1 id=\"medaxis-生命周期入口\">MedAxis 生命周期入口\u003c/h1>\n\u003cblockquote>\n\u003cp>Status: REVIEW · 模式：Standard · 当前 Phase：0 / active · 更新：2026-10-09\u003c/p>\n\u003c/blockquote>\n\u003cp>本表管理全项目产品评审的后续关口，不表示既有项目从未开发，也不把本次图文文档制作当作应用重设计。机器读状态见 \u003ca href=\"phase-manifest.yaml\">phase-manifest.yaml\u003c/a>。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Phase\u003c/th>\n\u003cth>applicability\u003c/th>\n\u003cth>status\u003c/th>\n\u003cth>真源 / 重新进入条件\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>0 产品定义\u003c/td>\n\u003ctd>required\u003c/td>\n\u003ctd>active\u003c/td>\n\u003ctd>\u003ca href=\"PRD.md\">PRD\u003c/a>、\u003ca href=\"DEVELOPMENT_READINESS.md\">Readiness\u003c/a>；待Owner评审与关键门解除\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>1 IA/UX\u003c/td>\n\u003ctd>merged → 0\u003c/td>\n\u003ctd>pending\u003c/td>\n\u003ctd>\u003ca href=\"USER_FLOWS.md\">USER_FLOWS\u003c/a>；现有导航盘点合并评审，改变入口时单独重开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2 Wireframe\u003c/td>\n\u003ctd>deferred\u003c/td>\n\u003ctd>pending\u003c/td>\n\u003ctd>本次无应用页面结构修改；获准重构旧医生/报告页面时重开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3 视觉设计\u003c/td>\n\u003ctd>deferred\u003c/td>\n\u003ctd>pending\u003c/td>\n\u003ctd>文档阅读版不替代应用视觉设计；批准应用视觉变更时重开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4 技术设计\u003c/td>\n\u003ctd>deferred\u003c/td>\n\u003ctd>pending\u003c/td>\n\u003ctd>\u003ca href=\"DOMAIN_MODEL.md\">领域模型\u003c/a>及\u003ca href=\"../../engineering/architecture.md\">架构\u003c/a>；产品批准并明确权限/schema变化时重开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5 实施\u003c/td>\n\u003ctd>deferred\u003c/td>\n\u003ctd>pending\u003c/td>\n\u003ctd>本次不改应用；技术契约及实施授权明确后重开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6 联调\u003c/td>\n\u003ctd>deferred\u003c/td>\n\u003ctd>pending\u003c/td>\n\u003ctd>现有专项验收入口；合成隔离/目标环境验证授权明确后重开\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7 发布\u003c/td>\n\u003ctd>not_applicable\u003c/td>\n\u003ctd>pending\u003c/td>\n\u003ctd>本次只交付文档；指定目标环境、发布授权、回滚与负责人后重评\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"权威文档指针\">权威文档指针\u003c/h2>\n\u003cul>\n\u003cli>产品真源：\u003ca href=\"PRD.md\">PRD\u003c/a>与\u003ca href=\"README.md#%E6%96%87%E6%A1%A3%E7%9C%9F%E6%BA%90%E4%B8%8E%E5%86%B2%E7%AA%81%E5%A4%84%E7%90%86\">专项规格索引\u003c/a>。\u003c/li>\n\u003cli>code_index：\u003ccode>null\u003c/code>，未定位独立代码索引；本次 \u003ca href=\"EVIDENCE.md\">EVIDENCE\u003c/a> 是产品覆盖证据，不冒充工程 code_index。\u003c/li>\n\u003cli>技术白皮书：未定位独立文档；现有 \u003ca href=\"../../engineering/architecture.md\">architecture\u003c/a> 登记为工程架构参考。\u003c/li>\n\u003cli>conventions：\u003ca href=\"../../../AGENTS.md\">AGENTS.md\u003c/a>。\u003c/li>\n\u003cli>trace/handoff：\u003ccode>null\u003c/code>；本次活动记录在 \u003ccode>.ai/tasks/2026-10-09-product-dossier/\u003c/code>，未创建另一套正式跨任务 trace。\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>唯一下一动作：\u003c/strong> 评审 \u003ca href=\"DECISIONS.md\">DECISIONS\u003c/a> 的范围、权限与数据政策，同步 living docs 并重新计算门禁；不自动开始应用开发或发布。\u003c/p>\n","search":"# medaxis 生命周期入口\n\n> status: review · 模式：standard · 当前 phase：0 / active · 更新：2026-10-09\n\n本表管理全项目产品评审的后续关口，不表示既有项目从未开发，也不把本次图文文档制作当作应用重设计。机器读状态见 [phase-manifest.yaml](phase-manifest.yaml)。\n\n| phase | applicability | status | 真源 / 重新进入条件 |\n|---|---|---|---|\n| 0 产品定义 | required | active | [prd](prd.md)、[readiness](development_readiness.md)；待owner评审与关键门解除 |\n| 1 ia/ux | merged → 0 | pending | [user_flows](user_flows.md)；现有导航盘点合并评审，改变入口时单独重开 |\n| 2 wireframe | deferred | pending | 本次无应用页面结构修改；获准重构旧医生/报告页面时重开 |\n| 3 视觉设计 | deferred | pending | 文档阅读版不替代应用视觉设计；批准应用视觉变更时重开 |\n| 4 技术设计 | deferred | pending | [领域模型](domain_model.md)及[架构](../../engineering/architecture.md)；产品批准并明确权限/schema变化时重开 |\n| 5 实施 | deferred | pending | 本次不改应用；技术契约及实施授权明确后重开 |\n| 6 联调 | deferred | pending | 现有专项验收入口；合成隔离/目标环境验证授权明确后重开 |\n| 7 发布 | not_applicable | pending | 本次只交付文档；指定目标环境、发布授权、回滚与负责人后重评 |\n\n## 权威文档指针\n\n- 产品真源：[prd](prd.md)与[专项规格索引](readme.md#文档真源与冲突处理)。\n- code_index：`null`，未定位独立代码索引；本次 [evidence](evidence.md) 是产品覆盖证据，不冒充工程 code_index。\n- 技术白皮书：未定位独立文档；现有 [architecture](../../engineering/architecture.md) 登记为工程架构参考。\n- conventions：[agents.md](../../../agents.md)。\n- trace/handoff：`null`；本次活动记录在 `.ai/tasks/2026-10-09-product-dossier/`，未创建另一套正式跨任务 trace。\n\n**唯一下一动作：** 评审 [decisions](decisions.md) 的范围、权限与数据政策，同步 living docs 并重新计算门禁；不自动开始应用开发或发布。\n"},{"id":"VERIFICATION","label":"文档验证记录","html":"\u003ch1 id=\"产品文档与阅读材料验证记录\">产品文档与阅读材料验证记录\u003c/h1>\n\u003cblockquote>\n\u003cp>Status: REVIEW · 2026-10-09 · 本文记录文档交付检查，不是业务功能或医学质量验收\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"验证范围\">验证范围\u003c/h2>\n\u003cp>检查新文档的需求编号/覆盖、相对链接与行定位、生命周期字段、图源/图片一致性、阅读版桌面/手机布局和思维导图交互。业务 API、数据库、迁移、模型、SMTP、真实患者及发布均未执行。\u003c/p>\n\u003ch2 id=\"实际执行的检查\">实际执行的检查\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>检查\u003c/th>\n\u003cth>命令 / 工具\u003c/th>\n\u003cth>退出码 / 关键结果\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>图片生成\u003c/td>\n\u003ctd>Python \u003ccode>tools/render_diagrams.py\u003c/code>\u003c/td>\n\u003ctd>exit 0；5组SVG/PNG，节点/关系来自图源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>阅读版生成\u003c/td>\n\u003ctd>Node \u003ccode>tools/build_reader.mjs --marked …\u003c/code>\u003c/td>\n\u003ctd>exit 0；10篇Markdown派生为index.html，未引用外部静态资源\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>静态契约\u003c/td>\n\u003ctd>Node \u003ccode>tools/validate_docs.mjs --yaml …\u003c/code>\u003c/td>\n\u003ctd>exit 0 / PASS；19需求、25路由含fallback、5流程/关系图、8阶段、10篇阅读版；相对链接及源码行定位检查通过\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>浏览与交互\u003c/td>\n\u003ctd>Node \u003ccode>tools/verify_reader.mjs --playwright … --output …\u003c/code>\u003c/td>\n\u003ctd>exit 0 / PASS；桌面10/10、390px手机10/10；破图/console/page error/外部请求均0；搜索、内部锚点、手机菜单、嵌入导图通过\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>导图真实画面\u003c/td>\n\u003ctd>同上 Edge/Playwright\u003c/td>\n\u003ctd>54节点可见；折叠后51、恢复展开；缩放与拖动通过；控件区不遮盖初始图节点\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>独立事实审查\u003c/td>\n\u003ctd>两个只读审查者，分别检查事实边界与产品契约\u003c/td>\n\u003ctd>0实质finding；仅定向抽查，不是全仓安全或专业批准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>改动范围/恢复点\u003c/td>\n\u003ctd>本机任务目录before-files.json与当前SHA-256比对，结合本任务写入路径核对\u003c/td>\n\u003ctd>本任务仅新文档/过程材料和docs/README.md两处导航；同期6个AI相关既有路径另有变化，记录后定向复核，不回滚；索引恢复副本匹配原工作区哈希\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>原始浏览结果及截图在本机 \u003ccode>.ai/tasks/2026-10-09-product-dossier/browser/\u003c/code>；范围结果在同任务的 \u003ccode>scope-results.json\u003c/code>。过程目录不随公开克隆分发；上表记录稳定结论，不声称缺少本机证据时仍可复现过去运行。\u003c/p>\n\u003ch3 id=\"完整复跑命令本机已用路径\">完整复跑命令（本机已用路径）\u003c/h3>\n\u003cp>从仓库根目录运行。依赖来自已安装 runtime/Markmap，不新增项目依赖；其他机器应换成已存在路径。\u003c/p>\n\u003cpre>\u003ccode>$docPython = 'C:/Users/56318/.cache/codex-runtimes/codex-primary-runtime/dependencies/python/python.exe'\n$docMarked = 'C:/Users/56318/.cache/codex-runtimes/codex-primary-runtime/dependencies/node/node_modules/marked'\n$docYaml = 'D:/AI-Command-Center/.ai/tools/markmap-mcp/node_modules/yaml'\n$docBrowser = 'C:/Users/56318/.cache/codex-runtimes/codex-primary-runtime/dependencies/node/node_modules/playwright'\n&amp; $docPython docs/product/medaxis/tools/render_diagrams.py\nnode docs/product/medaxis/tools/build_reader.mjs --marked $docMarked\nnode docs/product/medaxis/tools/validate_docs.mjs --yaml $docYaml\nnode docs/product/medaxis/tools/verify_reader.mjs --playwright $docBrowser --output .ai/tasks/2026-10-09-product-dossier/browser\u003c/code>\u003c/pre>\u003cp>思维导图生成接口和派生排版命令见 \u003ca href=\"visuals/README.md\">图源说明\u003c/a>。浏览脚本临时服务仅绑定127.0.0.1，限制在本产品文档和两张合成素材；测试结束关闭自己创建的浏览器和服务。\u003c/p>\n\u003ch3 id=\"检查中发现并修正\">检查中发现并修正\u003c/h3>\n\u003cul>\n\u003cli>图源静态比较曾因Windows换行差异失败，现按规范化换行比较，节点与关系未改变。\u003c/li>\n\u003cli>第一轮截图捕获到切篇平滑滚动/导图适配未稳定的画面；改为切篇即时归位，并增加实际可见节点检查、等待字体与适配完成，重新运行通过。\u003c/li>\n\u003cli>内部锚点测试曾只等hash变化而未等正文渲染，出现测试时序失败；补齐DOM条件后通过，未修改业务代码。\u003c/li>\n\u003cli>依赖检查首次误用frontend的不存在yaml路径；改用实际已安装Markmap依赖后解析通过，没有安装依赖。\u003c/li>\n\u003cli>全工作区“只有索引变化”假设在最终哈希检查失败：同期6个AI服务/评测路径也变动。本任务写入范围未扩展；保留变动，定向复核问题覆盖v3新增证据，更新本包，不把旧快照或他处历史测试当本轮通过。\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"审查重点\">审查重点\u003c/h2>\n\u003cp>最可能失败的五处：把新咨询与旧医生页成熟度混为一谈；把新报告只发文字推广到旧附件；把检索覆盖写成专业准确率；把图源存在写成图片/交互通过；把文档授权写成产品批准或上线授权。逐条以源码/画面/实际命令核对。\u003c/p>\n\u003ch2 id=\"复跑与恢复\">复跑与恢复\u003c/h2>\n\u003cp>图源/阅读版构建见 \u003ca href=\"visuals/README.md\">visuals/README\u003c/a>。Markdown可独立阅读；生成器或交互版失败不影响原文和已有图片。人工检查清单在本机 \u003ccode>.claude/manual-test-product-dossier.md\u003c/code>，覆盖直接打开、图像放大、标签理解和证据阅读。\u003c/p>\n\u003cp>恢复点：\u003ccode>.ai/tasks/2026-10-09-product-dossier/docs-README-before.md\u003c/code> 是两处导航改动前的精确工作区副本，SHA-256已与开工快照匹配。恢复只处理本次新增 \u003ccode>docs/product/medaxis/\u003c/code> 并在确认没有后续索引修改后恢复该副本，保留全部先前业务改动；大范围删除需按项目回收站与确认规则执行，不自动清理。独立Markmap中央输出保留，不自动永久删除。\u003c/p>\n\u003cp>残留边界：整稿REVIEW、开发规划NOT_READY；当前部署、真实患者可用性、专业原文支持/适用性、保留与外发政策未由本次验证解决。文档检查通过不改变这些状态。\u003c/p>\n","search":"# 产品文档与阅读材料验证记录\n\n> status: review · 2026-10-09 · 本文记录文档交付检查，不是业务功能或医学质量验收\n\n## 验证范围\n\n检查新文档的需求编号/覆盖、相对链接与行定位、生命周期字段、图源/图片一致性、阅读版桌面/手机布局和思维导图交互。业务 api、数据库、迁移、模型、smtp、真实患者及发布均未执行。\n\n## 实际执行的检查\n\n| 检查 | 命令 / 工具 | 退出码 / 关键结果 |\n|---|---|---|\n| 图片生成 | python `tools/render_diagrams.py` | exit 0；5组svg/png，节点/关系来自图源 |\n| 阅读版生成 | node `tools/build_reader.mjs --marked …` | exit 0；10篇markdown派生为index.html，未引用外部静态资源 |\n| 静态契约 | node `tools/validate_docs.mjs --yaml …` | exit 0 / pass；19需求、25路由含fallback、5流程/关系图、8阶段、10篇阅读版；相对链接及源码行定位检查通过 |\n| 浏览与交互 | node `tools/verify_reader.mjs --playwright … --output …` | exit 0 / pass；桌面10/10、390px手机10/10；破图/console/page error/外部请求均0；搜索、内部锚点、手机菜单、嵌入导图通过 |\n| 导图真实画面 | 同上 edge/playwright | 54节点可见；折叠后51、恢复展开；缩放与拖动通过；控件区不遮盖初始图节点 |\n| 独立事实审查 | 两个只读审查者，分别检查事实边界与产品契约 | 0实质finding；仅定向抽查，不是全仓安全或专业批准 |\n| 改动范围/恢复点 | 本机任务目录before-files.json与当前sha-256比对，结合本任务写入路径核对 | 本任务仅新文档/过程材料和docs/readme.md两处导航；同期6个ai相关既有路径另有变化，记录后定向复核，不回滚；索引恢复副本匹配原工作区哈希 |\n\n原始
