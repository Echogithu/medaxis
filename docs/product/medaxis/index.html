u003cli>\u003cstrong>当前代码：\u003c/strong> 本次只读核对工作区路由、服务及状态；未启动应用、未连接业务库、未调用模型。\u003c/li>\n\u003cli>\u003cstrong>历史证据：\u003c/strong> 保留其日期、样本和运行条件，不等于本次重新验证，也不证明临床有效性。\u003c/li>\n\u003cli>\u003cstrong>规划需求：\u003c/strong> 未完成能力与建议优先级明确标注；整份产品包尚未获批。\u003c/li>\n\u003cli>\u003cstrong>演示素材：\u003c/strong> 阅读版的患者页面截图来自现有\u003ca href=\"../../media/README.md\">合成预置重放\u003c/a>，不证明真实检索、业务保存或权限验收。\u003c/li>\n\u003c/ul>\n\u003cp>四种标记：\u003ccode>FACT\u003c/code> 有出处的事实；\u003ccode>OWNER_DECISION\u003c/code> 有来源的用户裁决；\u003ccode>ASSUMPTION\u003c/code> 可修改的建议；\u003ccode>UNKNOWN\u003c/code> 缺少证据的事项。代码里名为 diagnosis 的字段不自动赋予内容医疗效力。\u003c/p>\n\u003ch2 id=\"文档真源与冲突处理\">文档真源与冲突处理\u003c/h2>\n\u003cp>本 PRD \u003cstrong>Amends\u003c/strong> \u003ca href=\"../PRD.md\">历史全量审查 PRD\u003c/a>的项目级导航和现状，不删除历史内容。患者作品展示仍见 \u003ca href=\"../PORTFOLIO_PRD.md\">PORTFOLIO_PRD\u003c/a>，它的作品集目标不覆盖本次全项目梳理目标。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>内容层级\u003c/th>\n\u003cth>唯一维护位置\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>全项目定位、范围、跨模块需求\u003c/td>\n\u003ctd>本目录 \u003ca href=\"PRD.md\">PRD\u003c/a>；状态 REVIEW\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>患者专项详细行为\u003c/td>\n\u003ctd>\u003ca href=\"../HEALTH_PROFILE_SPEC.md\">健康档案\u003c/a>、\u003ca href=\"../FOLLOWUP_PLAN_SPEC.md\">手动随访\u003c/a>、\u003ca href=\"../POST_VISIT_AI_ACTIONS_SPEC.md\">诊后 AI 候选\u003c/a>、\u003ca href=\"../VISIT_PREPARATION_SPEC.md\">就医准备\u003c/a>、\u003ca href=\"../PATIENT_REPORTS_REQUIREMENTS.md\">独立报告\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>医生端详细目标与既有裁决\u003c/td>\n\u003ctd>\u003ca href=\"../DOCTOR_PRD.md\">DOCTOR_PRD\u003c/a>；整稿 REVIEW\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>评测方法、分层与判分\u003c/td>\n\u003ctd>\u003ca href=\"../EVALUATION_PROTOCOL.md\">EVALUATION_PROTOCOL\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>当前实现证据\u003c/td>\n\u003ctd>本目录 \u003ca href=\"EVIDENCE.md\">EVIDENCE\u003c/a>；过往成绩归各带日期验收文件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>工程实现与启动\u003c/td>\n\u003ctd>\u003ca href=\"../../engineering/architecture.md\">工程文档\u003c/a>、\u003ca href=\"../../../README.md\">项目 README\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>发生冲突时：当前行为回查源码；目标行为追溯明确用户决定或获批规格；未裁决的冲突记录到 \u003ca href=\"DECISIONS.md\">DECISIONS\u003c/a>，不得由阅读版或旧成绩单替代产品裁决。\u003c/p>\n","search":"# medaxis 产品文档集\n\n> status: review · v1.0 · 2026-10-09 · 主要读者：产品评审与研发协作\n\n**医枢 medaxis：让患者把分散的症状、检查资料和诊后记录，整理为有来源、可核对、可再次找到的就医资料。** 医生通过患者授权的定向咨询提供健康建议；管理端维护账号、资料与模型服务。\n\n## 三分钟读懂\n\n![medaxis 产品全景](visuals/product-map.png)\n\n| 想了解什么 | 从哪里看 |\n|---|---|\n| 产品为什么存在、服务谁、做什么 | [全项目 prd](prd.md) |\n| 一个用户动作怎样算成功 | [行为与验收规格](product_spec.md) |\n| 病例、报告、咨询之间是什么关系 | [领域模型](domain_model.md) |\n| 正常、失败、取消和恢复怎么走 | [用户流程](user_flows.md) |\n| 页面、接口与历史证据对应到哪里 | [项目事实与覆盖矩阵](evidence.md) |\n| 下一步能否进入开发规划 | [就绪评估与实现差距](development_readiness.md) |\n| 哪些已决定，哪些需要讨论 | [决策与开放项](decisions.md) |\n| 各阶段如何衔接 | [生命周期入口](workflow.md) |\n\n可视化阅读：[文档阅读版](index.html) · [交互思维导图](visuals/product-mindmap.html) · [导图静态图片](visuals/product-mindmap.png) · [图源及生成说明](visuals/readme.md)。markdown 是内容真源，html 和图片是派生阅读材料。\n\n## 阅读边界\n\n- **当前代码：** 本次只读核对工作区路由、服务及状态；未启动应用、未连接业务库、未调用模型。\n- **历史证据：** 保留其日期、样本和运行条件，不等于本次重新验证，也不证明临床有效性。\n- **规划需求：** 未完成能力与建议优先级明确标注；整份产品包尚未获批。\n- **演示素材：** 阅读版的患者页面截图来自现有[合成预置重放](../../media/readme.md)，不证明真实检索、业务保存或权限验收。\n\n四种标记：`fact` 有出处的事实；`owner_decision` 有来源的用户裁决；`assumption` 可修改的建议；`unknown` 缺少证据的事项。代码里名为 diagnosis 的字段不自动赋予内容医疗效力。\n\n## 文档真源与冲突处理\n\n本 prd **amends** [历史全量审查 prd](../prd.md)的项目级导航和现状，不删除历史内容。患者作品展示仍见 [portfolio_prd](../portfolio_prd.md)，它的作品集目标不覆盖本次全项目梳理目标。\n\n| 内容层级 | 唯一维护位置 |\n|---|---|\n| 全项目定位、范围、跨模块需求 | 本目录 [prd](prd.md)；状态 review |\n| 患者专项详细行为 | [健康档案](../health_profile_spec.md)、[手动随访](../followup_plan_spec.md)、[诊后 ai 候选](../post_visit_ai_actions_spec.md)、[就医准备](../visit_preparation_spec.md)、[独立报告](../patient_reports_requirements.md) |\n| 医生端详细目标与既有裁决 | [doctor_prd](../doctor_prd.md)；整稿 review |\n| 评测方法、分层与判分 | [evaluation_protocol](../evaluation_protocol.md) |\n| 当前实现证据 | 本目录 [evidence](evidence.md)；过往成绩归各带日期验收文件 |\n| 工程实现与启动 | [工程文档](../../engineering/architecture.md)、[项目 readme](../../../readme.md) |\n\n发生冲突时：当前行为回查源码；目标行为追溯明确用户决定或获批规格；未裁决的冲突记录到 [decisions](decisions.md)，不得由阅读版或旧成绩单替代产品裁决。\n"},{"id":"PRD","label":"全项目 PRD","html":"\u003ch1 id=\"medaxis-全项目产品需求文档\">MedAxis 全项目产品需求文档\u003c/h1>\n\u003cblockquote>\n\u003cp>Status: REVIEW · v1.0 · 2026-10-09 · Amends：历史项目级 PRD 的整合层\u003c/p>\n\u003cp>文档交付不等于产品获批、业务功能验收或上线授权。当前源码与证据定位统一见 \u003ca href=\"EVIDENCE.md\">EVIDENCE\u003c/a>。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"1-产品结论\">1. 产品结论\u003c/h2>\n\u003cp>\u003cstrong>MedAxis 是 AI 辅助问诊与就医资料整理原型。\u003c/strong> 患者描述问题、核对资料、保存病例、准备就医和记录诊后反馈；认证医生按定向授权提供健康建议；管理员维护服务所需的账号、知识与配置。\u003c/p>\n\u003cp>现阶段更有依据的价值是“整理与恢复资料”，不是“证明诊断正确”。报告、来源和本人核对必须能分辨；AI 输出与患者自报均不能冒充医生签署。\u003c/p>\n\u003cp>\u003cimg src=\"visuals/product-map.png\" alt=\"产品角色与能力全景\">\u003c/p>\n\u003ch3 id=\"11-brownfield-四层边界\">1.1 Brownfield 四层边界\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>层级\u003c/th>\n\u003cth>本次定义\u003c/th>\n\u003cth>性质\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Owner Mission\u003c/td>\n\u003ctd>使用产品相关 Skill 梳理整个 MedAxis，形成易读 PRD 与配套图文文档\u003c/td>\n\u003ctd>OWNER_DECISION：本次请求\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Current Product\u003c/td>\n\u003ctd>患者整理链路、独立报告代码、定向咨询、管理功能已存在；旧医生页仍有占位与权限范围疑点\u003c/td>\n\u003ctd>FACT：静态工作区核对；各链路成熟度不同\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Future Target\u003c/td>\n\u003ctd>经证据验证的患者—医生资料协作，后续可讨论同机构授权病例库与研究导出\u003c/td>\n\u003ctd>既有方向；成熟度及商业成立均未证明\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Current Scope\u003c/td>\n\u003ctd>全项目定义、领域/流程/验收、实现差距、图文阅读材料\u003c/td>\n\u003ctd>OWNER_DECISION：仅文档；不包含本次开发、迁移或部署\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"12-工作假设\">1.2 工作假设\u003c/h3>\n\u003cp>产品仍处于 \u003ccode>HYPOTHESIS_MODE\u003c/code>。有需求表达、源码和合成验证记录，缺少系统访谈、真实用户行为和临床专业核对。首轮建议使用合成案例和成年测试者；真实儿科场景的监护人、被照护人身份与授权模型未定义，不能从儿科指南语料推导为已支持。\u003c/p>\n\u003ch2 id=\"2-问题替代方式与反证\">2. 问题、替代方式与反证\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>问题假设\u003c/th>\n\u003cth>当前替代方式（待研究）\u003c/th>\n\u003cth>希望改变的行为\u003c/th>\n\u003cth>反证与证据缺口\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>描述主诉时容易漏掉时间、变化和资料\u003c/td>\n\u003ctd>临时回忆、相册、聊天记录\u003c/td>\n\u003ctd>核对一份保留未知项的摘要\u003c/td>\n\u003ctd>问答负担可能大于收益；无遗漏率基线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>生成资料难以再次找到\u003c/td>\n\u003ctd>截图、复制笔记\u003c/td>\n\u003ctd>重登后在同病例找回已保存资料\u003c/td>\n\u003ctd>浏览器聊天与服务端病例是两种恢复；真实可用性未验证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>诊前准备、检查报告和诊后记录分散\u003c/td>\n\u003ctd>文件夹、纸张、独立备忘录\u003c/td>\n\u003ctd>保持资料来源与本次就医问题关联\u003c/td>\n\u003ctd>人工整理可能已足够；独立报告完整部署验收未完成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>医生不知道谁在等自己回复\u003c/td>\n\u003ctd>分散消息、人工转发\u003c/td>\n\u003ctd>在单一活动咨询内连续处理\u003c/td>\n\u003ctd>医生工作量、响应预期和责任认知未知\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AI 表述容易显得过于确定\u003c/td>\n\u003ctd>用户自行辨别\u003c/td>\n\u003ctd>看清原话、候选、核对与专业建议\u003c/td>\n\u003ctd>有来源不等于原文支持；用户是否理解标签未知\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>选择这一方向的依据是现有实现可以支撑有限实验；不存在已证明的市场规模、付费意愿或“最佳上市时机”结论。先用任务完成、信息辨识和恢复行为验证价值，再扩展协作范围。\u003c/p>\n\u003ch2 id=\"3-用户与任务\">3. 用户与任务\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>角色\u003c/th>\n\u003cth>触发情境 / Job\u003c/th>\n\u003cth>成功结果\u003c/th>\n\u003cth>权限边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>注册患者\u003c/td>\n\u003ctd>需要整理本次症状和资料，准备就医\u003c/td>\n\u003ctd>找到同一病例，辨认未知项和来源，带走已保存摘要\u003c/td>\n\u003ctd>仅本人数据；分享需选择对象与版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>普通访客\u003c/td>\n\u003ctd>试用一次问答\u003c/td>\n\u003ctd>知道试用额度、过期与保存限制\u003c/td>\n\u003ctd>不承诺登录患者所有持久功能；演示模式关闭访客\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>已认证且 active 医生\u003c/td>\n\u003ctd>接到指定患者的健康咨询\u003c/td>\n\u003ctd>查看授权快照、回复/追问/结束\u003c/td>\n\u003ctd>定向咨询授权；不等于拥有患者全部历史\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>管理员\u003c/td>\n\u003ctd>维护账号、资质、资料与服务配置\u003c/td>\n\u003ctd>看清处理结果与失败，防止误操作\u003c/td>\n\u003ctd>管理角色不等于医生资格；审计覆盖仍需补证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>机构/研究使用者\u003c/td>\n\u003ctd>复用另行授权且审核后的病例\u003c/td>\n\u003ctd>待定义的机构范围和导出\u003c/td>\n\u003ctd>规划方向；不继承咨询同意\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>购买者、付费方式、机构合作方、运营负责人均为 \u003ccode>UNKNOWN\u003c/code>。当前产品验证不依赖虚构商业客户。\u003c/p>\n\u003ch2 id=\"4-范围与优先级\">4. 范围与优先级\u003c/h2>\n\u003cp>以下优先级是 \u003ccode>ASSUMPTION\u003c/code>，供评审取舍，不是已批准排期。MVP 指建议的首轮验证闭环，不能把所有已有模块都变成 Must。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>范围层\u003c/th>\n\u003cth>内容\u003c/th>\n\u003cth>首轮产品判断\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>建议 MVP / P0\u003c/td>\n\u003ctd>身份与对象归属；多轮信息采集；证据不足不发布；报告与病例保存；同病例恢复；就医准备；诊后自报；独立报告的外发同意与核对边界\u003c/td>\n\u003ctd>保持“描述—整理—核对—保存—找回”完整闭环；新报告纳入时须先完成目标环境验证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P1 / 条件扩展\u003c/td>\n\u003ctd>手动档案、日常测量、随访与提醒；诊后 AI 候选；定向医生咨询；运营管理体验\u003c/td>\n\u003ctd>可分别作为纵向切片验证；不可用旧医生页代替咨询验收\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>P2 / 延后\u003c/td>\n\u003ctd>同机构病例库、研究导出、外部医疗系统对接\u003c/td>\n\u003ctd>已有方向，不作为首轮完成条件\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Won&#39;t / 本期不做\u003c/td>\n\u003ctd>自动确诊、在线处方、自动调药、无人监护、预约/HIS、自动扩大分享授权、从日志默认训练\u003c/td>\n\u003ctd>不通过命名或界面暗示支持\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"41-全项目需求目录\">4.1 全项目需求目录\u003c/h3>\n\u003cp>编号 \u003ccode>MX-*\u003c/code> 是本次整合索引，保留专项原编号；详细规则不重复维护。每项均有 \u003ca href=\"PRODUCT_SPEC.md\">SPEC 验收行\u003c/a> 与 \u003ca href=\"EVIDENCE.md\">EVIDENCE 证据\u003c/a>。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>用户需求\u003c/th>\n\u003cth>建议优先级\u003c/th>\n\u003cth>当前静态结论\u003c/th>\n\u003cth>详细真源\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>MX-01\u003c/td>\n\u003ctd>明确登录身份、试用与演示限制\u003c/td>\n\u003ctd>P0\u003c/td>\n\u003ctd>有路由/服务；运行配置未查\u003c/td>\n\u003ctd>\u003ca href=\"PRODUCT_SPEC.md#mx-01\">SPEC\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MX-02\u003c/td>\n\u003ctd>分轮补充信息，允许未知与纠正\u003c/td>\n\u003ctd>P0\u003c/td>\n\u003ctd>有编排/SSE\u003c/td>\n\u003ctd>\u003ca href=\"PRODUCT_SPEC.md#mx-02\">SPEC\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MX-03\u003c/td>\n\u003ctd>获得带可核验来源的辅助报告，失败可辨认\u003c/td>\n\u003ctd>P0\u003c/td>\n\u003ctd>来源/引用门禁；原文支持仍有缺口\u003c/td>\n\u003ctd>\u003ca href=\"../EVALUATION_PROTOCOL.md\">评测协议\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MX-04\u003c/td>\n\u003ctd>将结果保存到正确病例，重复提交不产生歧义\u003c/td>\n\u003ctd>P0\u003c/td>\n\u003ctd>幂等服务和病例归属\u003c/td>\n\u003ctd>\u003ca href=\"PRODUCT_SPEC.md#mx-04\">SPEC\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MX-05\u003c/td>\n\u003ctd>恢复病例资料、核对并复制就医准备\u003c/td>\n\u003ctd>P0\u003c/td>\n\u003ctd>保存/修订/过期控制\u003c/td>\n\u003ctd>\u003ca href=\"../VISIT_PREPARATION_SPEC.md\">就医准备\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MX-06\u003c/td>\n\u003ctd>在原病例保存患者自报就诊反馈\u003c/td>\n\u003ctd>P0\u003c/td>\n\u003ctd>版本与历史代码\u003c/td>\n\u003ctd>\u003ca href=\"PRODUCT_SPEC.md#mx-06\">SPEC\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MX-07\u003c/td>\n\u003ctd>归档独立报告，保持顺序、去重与所有权\u003c/td>\n\u003ctd>P0（纳入时）\u003c/td>\n\u003ctd>API/模型存在；部署验收缺口\u003c/td>\n\u003ctd>\u003ca href=\"../PATIENT_REPORTS_REQUIREMENTS.md\">报告需求\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MX-08\u003c/td>\n\u003ctd>预览脱敏文字并逐次同意 AI 整理\u003c/td>\n\u003ctd>P0（纳入时）\u003c/td>\n\u003ctd>本地取字与外发绑定代码\u003c/td>\n\u003ctd>\u003ca href=\"../PATIENT_REPORTS_REQUIREMENTS.md\">报告需求\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MX-09\u003c/td>\n\u003ctd>区分 AI 候选、手动草稿、本人核对和病例引用\u003c/td>\n\u003ctd>P0（纳入时）\u003c/td>\n\u003ctd>分层版本与关联代码\u003c/td>\n\u003ctd>\u003ca href=\"../PATIENT_REPORTS_REQUIREMENTS.md\">报告需求\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MX-10\u003c/td>\n\u003ctd>维护健康档案与测量，保留未知和来源\u003c/td>\n\u003ctd>P1\u003c/td>\n\u003ctd>修订/幂等代码\u003c/td>\n\u003ctd>\u003ca href=\"../HEALTH_PROFILE_SPEC.md\">档案规格\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MX-11\u003c/td>\n\u003ctd>手动创建并执行记录计划，控制启停\u003c/td>\n\u003ctd>P1\u003c/td>\n\u003ctd>生命周期与任务服务\u003c/td>\n\u003ctd>\u003ca href=\"../FOLLOWUP_PLAN_SPEC.md\">随访规格\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MX-12\u003c/td>\n\u003ctd>只把确认后的诊后候选转成任务\u003c/td>\n\u003ctd>P1\u003c/td>\n\u003ctd>同意、候选、确认服务\u003c/td>\n\u003ctd>\u003ca href=\"../POST_VISIT_AI_ACTIONS_SPEC.md\">诊后 AI\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MX-13\u003c/td>\n\u003ctd>知道提醒的送达与确认状态\u003c/td>\n\u003ctd>P1\u003c/td>\n\u003ctd>站内事件；邮件可靠性有限\u003c/td>\n\u003ctd>\u003ca href=\"../FOLLOWUP_PLAN_SPEC.md\">随访规格\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MX-14\u003c/td>\n\u003ctd>选择认证医生，授权一份咨询快照并连续留言\u003c/td>\n\u003ctd>P1\u003c/td>\n\u003ctd>新咨询链路已实现\u003c/td>\n\u003ctd>\u003ca href=\"../DOCTOR_PRD.md\">医生 PRD\u003c/a> Q1/Q2\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MX-15\u003c/td>\n\u003ctd>医生仅处理授权资料，患者可取消共享\u003c/td>\n\u003ctd>P0 权限不变量\u003c/td>\n\u003ctd>咨询端有约束；旧医生 API 有差距\u003c/td>\n\u003ctd>\u003ca href=\"../DOCTOR_PRD.md\">医生 PRD\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MX-16\u003c/td>\n\u003ctd>管理账号、医生审核与审计，结果可信\u003c/td>\n\u003ctd>P1\u003c/td>\n\u003ctd>有管理 API；删除/邮件状态有风险\u003c/td>\n\u003ctd>\u003ca href=\"PRODUCT_SPEC.md#mx-16\">SPEC\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MX-17\u003c/td>\n\u003ctd>管理知识、模型与消息服务，追溯变更\u003c/td>\n\u003ctd>P1\u003c/td>\n\u003ctd>有管理页面/接口；未逐操作联调\u003c/td>\n\u003ctd>\u003ca href=\"PRODUCT_SPEC.md#mx-17\">SPEC\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MX-18\u003c/td>\n\u003ctd>仅在独立授权后形成机构病例库/研究材料\u003c/td>\n\u003ctd>P2\u003c/td>\n\u003ctd>检索范围内未定位实现入口\u003c/td>\n\u003ctd>\u003ca href=\"../DOCTOR_PRD.md\">医生 PRD\u003c/a> Q3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>MX-19\u003c/td>\n\u003ctd>看清数据用途、外发、保留、恢复与退出\u003c/td>\n\u003ctd>P0 跨模块\u003c/td>\n\u003ctd>部分实现；保留/备份/供应商边界未知\u003c/td>\n\u003ctd>\u003ca href=\"PRODUCT_SPEC.md#mx-19\">SPEC\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"5-产品体验与信息架构\">5. 产品体验与信息架构\u003c/h2>\n\u003cp>患者导航以“今天、问诊、病例、报告、健康档案、随访、提醒”承载任务。病例是一次问题的组织中心；独立报告可脱离病例保存，也可按版本引用。医生端以“咨询待处理—授权资料—持续回复”为目标主线；旧分配病例页面是另一条入口，尚不能替代该主线。\u003c/p>\n\u003cp>管理端维护支持能力，不应向患者暴露模型内部字段。加载、空列表、局部失败、版本过期、禁用和恢复必须有可读状态，具体见 \u003ca href=\"USER_FLOWS.md\">流程图\u003c/a> 与 \u003ca href=\"EVIDENCE.md\">路由覆盖矩阵\u003c/a>。\u003c/p>\n\u003cp>\u003cimg src=\"visuals/patient-flow.png\" alt=\"患者资料闭环\">\u003c/p>\n\u003ch2 id=\"6-ai-产品契约\">6. AI 产品契约\u003c/h2>\n\u003ch3 id=\"61-用户价值与指标关系\">6.1 用户价值与指标关系\u003c/h3>\n\u003cp>信息补问与检索服务于“减少遗漏、方便核对与找回”；模型命中率只能解释其中一个环节。题量更少可能减少负担，也可能漏问；检索覆盖更高可能增加延迟或无答案误召回，必须同时记录代价。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>指标\u003c/th>\n\u003cth>分子 / 分母与采集方式\u003c/th>\n\u003cth>当前基线\u003c/th>\n\u003cth>目标来源 / 状态\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>资料任务完成率\u003c/td>\n\u003ctd>完成描述、核对、保存和再次找回的人次 / 开始该合成任务的人次；观察记录\u003c/td>\n\u003ctd>UNKNOWN\u003c/td>\n\u003ctd>先取可用性基线，owner 再裁决\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>来源辨识率\u003c/td>\n\u003ctd>正确区分原话/AI/本人核对/医生建议的回答 / 固定辨识题\u003c/td>\n\u003ctd>UNKNOWN\u003c/td>\n\u003ctd>待研究；不编造达标线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>恢复正确性\u003c/td>\n\u003ctd>指定病例/版本恢复正确次数 / 合成恢复场景次数；独立核对\u003c/td>\n\u003ctd>有历史样例，非当前全量基线\u003c/td>\n\u003ctd>全部关键场景须无串病例/假成功；运行次数随方案确定\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>原文证据覆盖\u003c/td>\n\u003ctd>完整覆盖 gold 的正例 / 有答案正例；固定语料和版本\u003c/td>\n\u003ctd>历史 45 题实验有结果\u003c/td>\n\u003ctd>\u003ca href=\"../SEMANTIC_RECALL_ACCEPTANCE.md\">语义召回记录\u003c/a>，不直接作为端到端目标\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>报告陈述获原文支持\u003c/td>\n\u003ctd>专业标注支持的陈述 / 可判定陈述；错误/缺失分开\u003c/td>\n\u003ctd>UNKNOWN；历史 v4 能力缺口见证据\u003c/td>\n\u003ctd>需专业审核与 judge 校准\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>无答案与失败处理\u003c/td>\n\u003ctd>正确拒绝/说明不足次数 / 无答案、超时等分层样本\u003c/td>\n\u003ctd>历史无答案仍有误召回\u003c/td>\n\u003ctd>单独门禁，不能用总均分抵消\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>成本与延迟\u003c/td>\n\u003ctd>真实入口每任务模型尝试/实际 token/费用、首响应和结束耗时 P50/P95\u003c/td>\n\u003ctd>UNKNOWN\u003c/td>\n\u003ctd>待真实入口受控采样；null 不填 0\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"62-数据用途与版本\">6.2 数据、用途与版本\u003c/h3>\n\u003cp>知识库内容、患者私有材料、合成评测集、预置展示数据用途各自独立。患者内容没有自动训练授权；研究授权不继承咨询授权。旧问诊附件可调用外部视觉/文件服务，新独立报告先本地取字、仅逐次同意发送脱敏文字，两者必须分别说明。\u003c/p>\n\u003cp>每份评测记录至少绑定：题集与 gold 版本、Prompt/参数、模型及接收方、embedding/reranker、知识原文/分段/索引、工具行为版本、源码/环境及 judge 校准。找不到精确版本写 UNKNOWN，不能只留模型商品名。\u003c/p>\n\u003ch3 id=\"63-验收与发布不变量\">6.3 验收与发布不变量\u003c/h3>\n\u003cp>不可被平均分抵消：无可核验来源却发布、虚构引用、患者身份串线、把未知变无、未经同意外发、失效来源继续产生任务、未保存显示成功、越权读取、候选自动成为医嘱。医学陈述是否被原文支持、患者适用性和真实专业效果需分别取证；检索命中不能替代专业审核。\u003c/p>\n\u003cp>评测方法唯一真源是 \u003ca href=\"../EVALUATION_PROTOCOL.md\">EVALUATION_PROTOCOL\u003c/a>。本包不修改评测集、不调用模型、不复跑历史成绩。\u003c/p>\n\u003cp>同期问题覆盖优化已有给定候选的真实模型对照记录，代价与误判一起收录于 \u003ca href=\"EVIDENCE.md\">EVIDENCE §4\u003c/a>。这是问题覆盖分类/排序证据，不能替代原文陈述支持、患者适用性、完整问诊或专业审核；端到端成本与延迟基线仍为 UNKNOWN。\u003c/p>\n\u003ch3 id=\"64-当前范围与下一动作\">6.4 当前范围与下一动作\u003c/h3>\n\u003cp>本次交付 AI 能力、证据缺口和产品验收定义。下一步建议先确认产品范围，再用合成案例完成报告部署/授权验证、专业 gold 核对和受控真实入口采样；未完成前仅展示带条件的原型能力。AI 失败时优先保留原件、已保存记录和手动路径，不能静默换接收方或自动重发材料。\u003c/p>\n\u003ch2 id=\"7-非功能与运营约束\">7. 非功能与运营约束\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>维度\u003c/th>\n\u003cth>产品要求\u003c/th>\n\u003cth>当前证据边界\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>权限\u003c/td>\n\u003ctd>登录角色、账号状态、对象所有权、分享版本分层校验\u003c/td>\n\u003ctd>咨询链路与旧医生入口需统一取证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>一致性\u003c/td>\n\u003ctd>重试按请求编号与内容去重，修订冲突保留输入\u003c/td>\n\u003ctd>有相关代码；无本轮运行保证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可靠性\u003c/td>\n\u003ctd>生成/保存/送达分别显示；断网、超时、后台失败有退出路径\u003c/td>\n\u003ctd>提醒 SMTP 崩溃窗口不可承诺 exactly-once\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>隐私\u003c/td>\n\u003ctd>患者看清内容、接收方、同意范围；不把遮蔽称绝对匿名\u003c/td>\n\u003ctd>报告新旧入口不同；全出口检查未完成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>可访问性\u003c/td>\n\u003ctd>中文可读、移动端核心操作可达、状态不用颜色单独表达\u003c/td>\n\u003ctd>现有截图有移动端展示；任务可用性未验证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>审计\u003c/td>\n\u003ctd>记录必要动作与版本，避免敏感全文进入日志\u003c/td>\n\u003ctd>已有管理审计不代表全动作覆盖\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>删除与恢复\u003c/td>\n\u003ctd>区分回收、恢复、永久清理和不可追回的外发\u003c/td>\n\u003ctd>保留时长、备份清理、供应商保留 UNKNOWN\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"8-迭代建议与成功条件\">8. 迭代建议与成功条件\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>关口\u003c/th>\n\u003cth>观察到什么才推进\u003c/th>\n\u003cth>当前下一动作\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>产品评审\u003c/td>\n\u003ctd>MVP、首测人群、咨询边界和权限冲突有明确裁决\u003c/td>\n\u003ctd>评审 \u003ca href=\"DECISIONS.md\">DECISIONS\u003c/a> 与 \u003ca href=\"DEVELOPMENT_READINESS.md\">Readiness\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>患者主线验证\u003c/td>\n\u003ctd>合成案例从输入到保存/重登恢复，失败与版本状态正确\u003c/td>\n\u003ctd>先验证目标环境，不采集真实患者数据\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>独立报告验证\u003c/td>\n\u003ctd>本地解析、同意、核对、引用、回收组合场景可复现\u003c/td>\n\u003ctd>复用报告切片验收，不跳过完整组合场景\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>医生咨询验证\u003c/td>\n\u003ctd>指定授权、认证撤销、取消与连续回复端到端成立\u003c/td>\n\u003ctd>优先收敛旧页面演示污染与权限范围\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AI 质量验证\u003c/td>\n\u003ctd>冻结/独立样本、专业 gold、失败与成本结果可解释\u003c/td>\n\u003ctd>按现有协议采集，保留负例与退步\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>扩展/发布\u003c/td>\n\u003ctd>机构/研究授权、运营责任、回滚与专业/合规审查明确\u003c/td>\n\u003ctd>延后；没有固定上线日期或上线授权\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>当前开发规划状态：\u003cstrong>NOT_READY\u003c/strong>。这是下一阶段授权和关键缺口的结论，不影响本次文档的交付；详见 \u003ca href=\"DEVELOPMENT_READINESS.md\">门禁判定\u003c/a>。\u003c/p>\n","search":"# medaxis 全项目产品需求文档\n\n> status: review · v1.0 · 2026-10-09 · amends：历史项目级 prd 的整合层\n>\n> 文档交付不等于产品获批、业务功能验收或上线授权。当前源码与证据定位统一见 [evidence](evidence.md)。\n\n## 1. 产品结论\n\n**medaxis 是 ai 辅助问诊与就医资料整理原型。** 患者描述问题、核对资料、保存病例、准备就医和记录诊后反馈；认证医生按定向授权提供健康建议；管理员维护服务所需的账号、知识与配置。\n\n现阶段更有依据的价值是“整理与恢复资料”，不是“证明诊断正确”。报告、来源和本人核对必须能分辨；ai 输出与患者自报均不能冒充医生签署。\n\n![产品角色与能力全景](visuals/product-map.png)\n\n### 1.1 brownfield 四层边界\n\n| 层级 | 本次定义 | 性质 |\n|---|---|---|\n| owner mission | 使用产品相关 skill 梳理整个 medaxis，形成易读 prd 与配套图文文档 | owner_decision：本次请求 |\n| current product | 患者整理链路、独立报告代码、定向咨询、管理功能已存在；旧医生页仍有占位与权限范围疑点 | fact：静态工作区核对；各链路成熟度不同 |\n| future target | 经证据验证的患者—医生资料协作，后续可讨论同机构授权病例库与研究导出 | 既有方向；成熟度及商业成立均未证明 |\n| current scope | 全项目定义、领域/流程/验收、实现差距、图文阅读材料 | owner_decision：仅文档；不包含本次开发、迁移或部署 |\n\n### 1.2 工作假设\n\n产品仍处于 `hypothesis_mode`。有需求表达、源码和合成验证记录，缺少系统访谈、真实用户行为和临床专业核对。首轮建议使用合成案例和成年测试者；真实儿科场景的监护人、被照护人身份与授权模型未定义，不能从儿科指南语料推导为已支持。\n\n## 2. 问题、替代方式与反证\n\n| 问题假设 | 当前替代方式（待研究） | 希望改变的行为 | 反证与证据缺口 |\n|---|---|---|---|\n| 描述主诉时容易漏掉时间、变化和资料 | 临时回忆、相册、聊天记录 | 核对一份保留未知项的摘要 | 问答负担可能大于收益；无遗漏率基线 |\n| 生成资料难以再次找到 | 截图、复制笔记 | 重登后在同病例找回已保存资料 | 浏览器聊天与服务端病例是两种恢复；真实可用性未验证 |\n| 诊前准备、检查报告和诊后记录分散 | 文件夹、纸张、独立备忘录 | 保持资料来源与本次就医问题关联 | 人工整理可能已足够；独立报告完整部署验收未完成 |\n| 医生不知道谁在等自己回复 | 分散消息、人工转发 | 在单一活动咨询内连续处理 | 医生工作量、响应预期和责任认知未知 |\n| ai 表述容易显得过于确定 | 用户自行辨别 | 看清原话、候选、核对与专业建议 | 有来源不等于原文支持；用户是否理解标签未知 |\n\n选择这一方向的依据是现有实现可以支撑有限实验；不存在已证明的市场规模、付费意愿或“最佳上市时机”结论。先用任务完成、信息辨识和恢复行为验证价值，再扩展协作范围。\n\n## 3. 用户与任务\n\n| 角色 | 触发情境 / job | 成功结果 | 权限边界 |\n|---|---|---|---|\n| 注册患者 | 需要整理本次症状和资料，准备就医 | 找到同一病例，辨认未知项和来源，带走已保存摘要 | 仅本人数据；分享需选择对象与版本 |\n| 普通访客 | 试用一次问答 | 知道试用额度、过期与保存限制 | 不承诺登录患者所有持久功能；演示模式关闭访客 |\n| 已认证且 active 医生 | 接到指定患者的健康咨询 | 查看授权快照、回复/追问/结束 | 定向咨询授权；不等于拥有患者全部历史 |\n| 管理员 | 维护账号、资质、资料与服务配置 | 看清处理结果与失败，防止误操作 | 管理角色不等于医生资格；审计覆盖仍需补证 |\n| 机构/研究使用者 | 复用另行授权且审核后的病例 | 待定义的机构范围和导出 | 规划方向；不继承咨询同意 |\n\n购买者、付费方式、机构合作方、运营负责人均为 `unknown`。当前产品验证不依赖虚构商业客户。\n\n## 4. 范围与优先级\n\n以下优先级是 `assumption`，供评审取舍，不是已批准排期。mvp 指建议的首轮验证闭环，不能把所有已有模块都变成 must。\n\n| 范围层 | 内容 | 首轮产品判断 |\n|---|---|---|\n| 建议 mvp / p0 | 身份与对象归属；多轮信息采集；证据不足不发布；报告与病例保存；同病例恢复；就医准备；诊后自报；独立报告的外发同意与核对边界 | 保持“描述—整理—核对—保存—找回”完整闭环；新报告纳入时须先完成目标环境验证 |\n| p1 / 条件扩展 | 手动档案、日常测量、随访与提醒；诊后 ai 候选；定向医生咨询；运营管理体验 | 可分别作为纵向切片验证；不可用旧医生页代替咨询验收 |\n| p2 / 延后 | 同机构病例库、研究导出、外部医疗系统对接 | 已有方向，不作为首轮完成条件 |\n| won't / 本期不做 | 自动确诊、在线处方、自动调药、无人监护、预约/his、自动扩大分享授权、从日志默认训练 | 不通过命名或界面暗示支持 |\n\n### 4.1 全项目需求目录\n\n编号 `mx-*` 是本次整合索引，保留专项原编号；详细规则不重复维护。每项均有 [spec 验收行](product_spec.md) 与 [evidence 证据](evidence.md)。\n\n| id | 用户需求 | 建议优先级 | 当前静态结论 | 详细真源 |\n|---|---|---|---|---|\n| mx-01 | 明确登录身份、试用与演示限制 | p0 | 有路由/服务；运行配置未查 | [spec](product_spec.md#mx-01) |\n| mx-02 | 分轮补充信息，允许未知与纠正 | p0 | 有编排/sse | [spec](product_spec.md#mx-02) |\n| mx-03 | 获得带可核验来源的辅助报告，失败可辨认 | p0 | 来源/引用门禁；原文支持仍有缺口 | [评测协议](../evaluation_protocol.md) |\n| mx-04 | 将结果保存到正确病例，重复提交不产生歧义 | p0 | 幂等服务和病例归属 | [spec](product_spec.md#mx-04) |\n| mx-05 | 恢复病例资料、核对并复制就医准备 | p0 | 保存/修订/过期控制 | [就医准备](../visit_preparation_spec.md) |\n| mx-06 | 在原病例保存患者自报就诊反馈 | p0 | 版本与历史代码 | [spec](product_spec.md#mx-06) |\n| mx-07 | 归档独立报告，保持顺序、去重与所有权 | p0（纳入时） | api/模型存在；部署验收缺口 | [报告需求](../patient_reports_requirements.md) |\n| mx-08 | 预览脱敏文字并逐次同意 ai 整理 | p0（纳入时） | 本地取字与外发绑定代码 | [报告需求](../patient_reports_requirements.md) |\n| mx-09 | 区分 ai 候选、手动草稿、本人核对和病例引用 | p0（纳入时） | 分层版本与关联代码 | [报告需求](../patient_reports_requirements.md) |\n| mx-10 | 维护健康档案与测量，保留未知和来源 | p1 | 修订/幂等代码 | [档案规格](../health_profile_spec.md) |\n| mx-11 | 手动创建并执行记录计划，控制启停 | p1 | 生命周期与任务服务 | [随访规格](../followup_plan_spec.md) |\n| mx-12 | 只把确认后的诊后候选转成任务 | p1 | 同意、候选、确认服务 | [诊后 ai](../post_visit_ai_actions_spec.md) |\n| mx-13 | 知道提醒的送达与确认状态 | p1 | 站内事件；邮件可靠性有限 | [随访规格](../followup_plan_spec.md) |\n| mx-14 | 选择认证医生，授权一份咨询快照并连续留言 | p1 | 新咨询链路已实现 | [医生 prd](../doctor_prd.md) q1/q2 |\n| mx-15 | 医生仅处理授权资料，患者可取消共享 | p0 权限不变量 | 咨询端有约束；旧医生 api 有差距 | [医生 prd](../doctor_prd.md) |\n| mx-16 | 管理账号、医生审核与审计，结果可信 | p1 | 有管理 api；删除/邮件状态有风险 | [spec](product_spec.md#mx-16) |\n| mx-17 | 管理知识、模型与消息服务，追溯变更 | p1 | 有管理页面/接口；未逐操作联调 | [spec](product_spec.md#mx-17) |\n| mx-18 | 仅在独立授权后形成机构病例库/研究材料 | p2 | 检索范围内未定位实现入口 | [医生 prd](../doctor_prd.md) q3 |\n| mx-19 | 看清数据用途、外发、保留、恢复与退出 | p0 跨模块 | 部分实现；保留/备份/供应商边界未知 | [spec](product_spec.md#mx-19) |\n\n## 5. 产品体验与信息架构\n\n患者导航以“今天、问诊、病例、报告、健康档案、随访、提醒”承载任务。病例是一次问题的组织中心；独立报告可脱离病例保存，也可按版本引用。医生端以“咨询待处理—授权资料—持续回复”为目标主线；旧分配病例页面是另一条入口，尚不能替代该主线。\n\n管理端维护支持能力，不应向患者暴露模型内部字段。加载、空列表、局部失败、版本过期、禁用和恢复必须有可读状态，具体见 [流程图](user_flows.md) 与 [路由覆盖矩阵](evidence.md)。\n\n![患者资料闭环](visuals/patient-flow.png)\n\n## 6. ai 产品契约\n\n### 6.1 用户价值与指标关系\n\n信息补问与检索服务于“减少遗漏、方便核对与找回”；模型命中率只能解释其中一个环节。题量更少可能减少负担，也可能漏问；检索覆盖更高可能增加延迟或无答案误召回，必须同时记录代价。\n\n| 指标 | 分子 / 分母与采集方式 | 当前基线 | 目标来源 / 状态 |\n|---|---|---|---|\n| 资料任务完成率 | 完成描述、核对、保存和再次找回的人次 / 开始该合成任务的人次；观察记录 | unknown | 先取可用性基线，owner 再裁决 |\n| 来源辨识率 | 正确区分原话/ai/本人核对/医生建议的回答 / 固定辨识题 | unknown | 待研究；不编造达标线 |\n| 恢复正确性 | 指定病例/版本恢复正确次数 / 合成恢复场景次数；独立核对 | 有历史样例，非当前全量基线 | 全部关键场景须无串病例/假成功；运行次数随方案确定 |\n| 原文证据覆盖 | 完整覆盖 gold 的正例 / 有答案正例；固定语料和版本 | 历史 45 题实验有结果 | [语义召回记录](../semantic_recall_acceptance.md)，不直接作为端到端目标 |\n| 报告陈述获原文支持 | 专业标注支持的陈述 / 可判定陈述；错误/缺失分开 | unknown；历史 v4 能力缺口见证据 | 需专业审核与 judge 校准 |\n| 无答案与失败处理 | 正确拒绝/说明不足次数 / 无答案、超时等分层样本 | 历史无答案仍有误召回 | 单独门禁，不能用总均分抵消 |\n| 成本与延迟 | 真实入口每任务模型尝试/实际 token/费用、首响应和结束耗时 p50/p95 | unknown | 待真实入口受控采样；null 不填 0 |\n\n### 6.2 数据、用途与版本\n\n知识库内容、患者私有材料、合成评测集、预置展示数据用途各自独立。患者内容没有自动训练授权；研究授权不继承咨询授权。旧问诊附件可调用外部视觉/文件服务，新独立报告先本地取字、仅逐次同意发送脱敏文字，两者必须分别说明。\n\n每份评测记录至少绑定：题集与 gold 版本、prompt/参数、模型及接收方、embedding/reranker、知识原文/分段/索引、工具行为版本、源码/环境及 judge 校准。找不到精确版本写 unknown，不能只留模型商品名。\n\n### 6.3 验收与发布不变量\n\n不可被平均分抵消：无可核验来源却发布、虚构引用、患者身份串线、把未知变无、未经同意外发、失效来源继续产生任务、未保存显示成功、越权读取、候选自动成为医嘱。医学陈述是否被原文支持、患者适用性和真实专业效果需分别取证；检索命中不能替代专业审核。\n\n评测方法唯一真源是 [evaluation_protocol](../evaluation_protocol.md)。本包不修改评测集、不调用模型、不复跑历史成绩。\n\n同期问题覆盖优化已有给定候选的真实模型对照记录，代价与误判一起收录于 [evidence §4](evidence.md)。这是问题覆盖分类/排序证据，不能替代原文陈述支持、患者适用性、完整问诊或专业审核；端到端成本与延迟基线仍为 unknown。\n\n### 6.4 当前范围与下一动作\n\n本次交付 ai 能力、证据缺口和产品验收定义。下一步建议先确认产品范围，再用合成案例完成报告部署/授权验证、专业 gold 核对和受控真实入口采样；未完成前仅展示带条件的原型能力。ai 失败时优先保留原件、已保存记录和手动路径，不能静默换接收方或自动重发材料。\n\n## 7. 非功能与运营约束\n\n| 维度 | 产品要求 | 当前证据边界 |\n|---|---|---|\n| 权限 | 登录角色、账号状态、对象所有权、分享版本分层校验 | 咨询链路与旧医生入口需统一取证 |\n| 一致性 | 重试按请求编号与内容去重，修订冲突保留输入 | 有相关代码；无本轮运行保证 |\n| 可靠性 | 生成/保存/送达分别显示；断网、超时、后台失败有退出路径 | 提醒 smtp 崩溃窗口不可承诺 exactly-once |\n| 隐私 | 患者看清内容、接收方、同意范围；不把遮蔽称绝对匿名 | 报告新旧入口不同；全出口检查未完成 |\n| 可访问性 | 中文可读、移动端核心操作可达、状态不用颜色单独表达 | 现有截图有移动端展示；任务可用性未验证 |\n| 审计 | 记录必要动作与版本，避免敏感全文进入日志 | 已有管理审计不代表全动作覆盖 |\n| 删除与恢复 | 区分回收、恢复、永久清理和不可追回的外发 | 保留时长、备份清理、供应商保留 unknown |\n\n## 8. 迭代建议与成功条件\n\n| 关口 | 观察到什么才推进 | 当前下一动作 |\n|---|---|---|\n| 产品评审 | mvp、首测人群、咨询边界和权限冲突有明确裁决 | 评审 [decisions](decisions.md) 与 [readiness](development_readiness.md) |\n| 患者主线验证 | 合成案例从输入到保存/重登恢复，失败与版本状态正确 | 先验证目标环境，不采集真实患者数据 |\n| 独立报告验证 | 本地解析、同意、核对、引用、回收组合场景可复现 | 复用报告切片验收，不跳过完整组合场景 |\n| 医生咨询验证 | 指定授权、认证撤销、取消与连续回复端到端成立 | 优先收敛旧页面演示污染与权限范围 |\n| ai 质量验证 | 冻结/独立样本、专业 gold、失败与成本结果可解释 | 按现有协议采集，保留负例与退步 |\n| 扩展/发布 | 机构/研究授权、运营责任、回滚与专业/合规审查明确 | 延后；没有固定上线日期或上线授权 |\n\n当前开发规划状态：**not_ready**。这是下一阶段授权和关键缺口的结论，不影响本次文档的交付；详见 [门禁判定](development_readiness.md)。\n"},{"id":"PRODUCT_SPEC","label":"行为与验收","html":"\u003ch1 id=\"medaxis-行为与验收规格\">MedAxis 行为与验收规格\u003c/h1>\n\u003cblockquote>\n\u003cp>Status: REVIEW · 2026-10-09 · 只维护跨模块验收；专项字段及详细状态见原规格\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"如何使用\">如何使用\u003c/h2>\n\u003cp>本文件定义“要怎样才算正确”，不声称场景已经执行。下面的 \u003ccode>A-*\u003c/code> 是验收索引；证据要求对应 \u003ca href=\"DEVELOPMENT_READINESS.md\">能力事实表\u003c/a>，执行方法沿用现有测试/评测入口。默认使用合成数据，真实写入及专业签署需另行授权。\u003c/p>\n\u003ch2 id=\"核心验收\">核心验收\u003c/h2>\n\u003ch3 id=\"mx-01\">MX-01\u003c/h3>\n\u003cp>\u003cstrong>A-01 身份与模式：\u003c/strong> 普通患者登录后看到本人数据；访客知道过期及额度限制；开启面试模式时，仅专用 active 患者可调用模型。额度耗尽停止新模型请求但保留浏览。普通访客按提交计数、失败可按服务规则返还；面试模式按实际 provider HTTP 尝试持久扣减，重试计入、失败不退还、上限配置 1–20。验证重新启动/并发请求不自动补充；这不是 token 上限。当前开启状态 UNKNOWN。\u003c/p>\n\u003ch3 id=\"mx-02\">MX-02\u003c/h3>\n\u003cp>\u003cstrong>A-02 补问：\u003c/strong> 已知信息可复用，未知允许保留未知；修正前文后后续采集依据新陈述；SSE 中断不伪装完成，已显示内容及下一步可辨认。题量节省与关键缺口分别评估，不能以少问为唯一成功。\u003c/p>\n\u003ch3 id=\"mx-03\">MX-03\u003c/h3>\n\u003cp>\u003cstrong>A-03 证据门禁：\u003c/strong> 有可核验来源且形成有效引用才发布辅助报告；检索超时、零来源、引用失效显示可理解失败。来源相关性、要点覆盖、原文支持和患者适用性是四种不同判断；任一未验证状态不能显示已专业审核。知识库为空/embedding 不可用/重排失败均单列场景。\u003c/p>\n\u003ch3 id=\"mx-04\">MX-04\u003c/h3>\n\u003cp>\u003cstrong>A-04 保存：\u003c/strong> 同一来源会话重复保存返回同一病例语义；未保存成功不能显示已归档。用户 A 不能读写 B 的病例；迟到响应不能串入当前病例。生成失败与保存失败分别报告；清浏览器后只承诺恢复服务端已保存资料。\u003c/p>\n\u003ch3 id=\"mx-05\">MX-05\u003c/h3>\n\u003cp>\u003cstrong>A-05 就医准备：\u003c/strong> 修改草稿、成功保存、复制使用的版本分开；冲突保留输入并要求重新核对。来源修订后显示过期状态并禁用旧摘要复制；更新成功后再复制。切换阶段可保留当前会话草稿，刷新/离开会丢未保存输入，需提前说明。详见 \u003ca href=\"../VISIT_PREPARATION_SPEC.md\">就医准备\u003c/a>。\u003c/p>\n\u003ch3 id=\"mx-06\">MX-06\u003c/h3>\n\u003cp>\u003cstrong>A-06 诊后自报：\u003c/strong> 在正确病例保存反馈，带 revision，冲突不覆盖较新版本，历史可追溯。本人自报“医生说了什么”不成为平台医生签署；保存不自动创建用药任务。\u003c/p>\n\u003ch3 id=\"mx-07\">MX-07\u003c/h3>\n\u003cp>\u003cstrong>A-07 归档：\u003c/strong> 本人上传有序页组，独立报告可不关联病例；相同字节及顺序按本人去重，用户明确选择复用或新副本。复用不覆盖历史。未保存上传刷新丢失，保存失败可重试且不重复创建。报告删除与恢复、病例关联对删除状态的响应单列验证。已有 10MiB/5文件/20页/批次5份为专项中的实现常量与假设，不把它们提升为新获批需求。\u003c/p>\n\u003ch3 id=\"mx-08\">MX-08\u003c/h3>\n\u003cp>\u003cstrong>A-08 外发同意：\u003c/strong> 新报告先本地取字；患者看到脱敏文字、接收模型和来源版本，明确同意本次发送后才外发。预览后文字/原件/接收方变化拒绝旧同意；失败不自动重发、不静默切换供应商。人工编辑文字仍需重新核对同意。旧 \u003ccode>/documents/upload\u003c/code> 的视觉/文件外发是不同入口，不能套用“所有原件不外发”表述。\u003c/p>\n\u003ch3 id=\"mx-09\">MX-09\u003c/h3>\n\u003cp>\u003cstrong>A-09 核对与引用：\u003c/strong> AI 候选不覆盖手动草稿；确认生成不可变核对版本。病例固定引用来源与核对版本；源或核对改变显示待重新核对，不能悄悄改成新结论。本人核对不得显示医生审核。详情、关联、原件和回收操作都应拒绝跨用户访问。\u003c/p>\n\u003ch3 id=\"mx-10\">MX-10\u003c/h3>\n\u003cp>\u003cstrong>A-10 档案/测量：\u003c/strong> 未填、未知、明确无、已有记录分别显示；删掉最后一条不能自动变“明确无”。修改带修订号；409/428保留草稿。测量重复 request_id 同内容返回既有结果、不同内容拒绝。详见 \u003ca href=\"../HEALTH_PROFILE_SPEC.md\">档案规格\u003c/a>。\u003c/p>\n\u003ch3 id=\"mx-11\">MX-11\u003c/h3>\n\u003cp>\u003cstrong>A-11 手动计划：\u003c/strong> 待确认计划只有确认后生效；暂停/终止停止未来事件，已发送记录仍存在。任务重复完成不改变首次记录；并发按版本冲突处理。日程按既有 UTC+8 约定核对；任务数、日期和生命周期沿用 \u003ca href=\"../FOLLOWUP_PLAN_SPEC.md\">随访规格\u003c/a>。\u003c/p>\n\u003ch3 id=\"mx-12\">MX-12\u003c/h3>\n\u003cp>\u003cstrong>A-12 候选转任务：\u003c/strong> 从已保存诊后原话取候选，逐次同意，默认不选；患者逐项确认并补足时间才生效。缺失剂量/药名不能由 AI 补成处方；来源变化取消尚未发送的关联计划与事件，已发送无法追回。详见 \u003ca href=\"../POST_VISIT_AI_ACTIONS_SPEC.md\">诊后 AI\u003c/a>。\u003c/p>\n\u003ch3 id=\"mx-13\">MX-13\u003c/h3>\n\u003cp>\u003cstrong>A-13 提醒：\u003c/strong> pending/sent/acknowledged 等送达状态不等于任务完成或医学效果；只有 sent 可确认，重复确认幂等。邮件只发通用提示，SMTP 失败不能写送达成功；发生发送后落库失败时记录可能重复的边界。不承诺即时监护或 exactly-once。\u003c/p>\n\u003ch3 id=\"mx-14\">MX-14\u003c/h3>\n\u003cp>\u003cstrong>A-14 定向咨询：\u003c/strong> 患者选择可用认证医生、资料快照并同意；同病例只能一个活动咨询。快照变化重新核对；重复提交幂等。医生接受/婉拒、患者补充、医生回复与结束有历史记录。回复写入原咨询，通知已读不改变咨询状态。\u003c/p>\n\u003ch3 id=\"mx-15\">MX-15\u003c/h3>\n\u003cp>\u003cstrong>A-15 授权撤销：\u003c/strong> 患者取消、咨询结束、医生认证撤销或账号失效后停止继续共享；读取和发布都重新验证。旧 \u003ccode>/doctor/*\u003c/code> 和 \u003ccode>/medical-cases/*\u003c/code> 也必须满足已裁决的对象范围，不能仅凭前端角色守卫。已下载/外发的材料不能远程追回。现有医生 API 的患者全量会话查询与认证差距，见 \u003ca href=\"DEVELOPMENT_READINESS.md\">实现差距\u003c/a>。\u003c/p>\n\u003ch3 id=\"mx-16\">MX-16\u003c/h3>\n\u003cp>\u003cstrong>A-16 运营结果：\u003c/strong> 非管理员不能调用管理 API；最后 active admin 和本人误踢受保护。医生审核批准和邮件送达分别显示，邮件失败不能显示“已发送”。明确数据库删除与停用区别；现有 kick 为实际删除，不能宣称软删除可恢复。关键动作审计覆盖须逐项证明。\u003c/p>\n\u003ch3 id=\"mx-17\">MX-17\u003c/h3>\n\u003cp>\u003cstrong>A-17 服务配置：\u003c/strong> 知识审核、模型配置、通知及邮件操作在加载/失败/取消时保留明确结果；模型健康检查不成为患者数据外发默认授权。记录变更前后版本及操作者；未验证的管理表单不写“已完成联调”。\u003c/p>\n\u003ch3 id=\"mx-18\">MX-18\u003c/h3>\n\u003cp>\u003cstrong>A-18 机构/研究：\u003c/strong> 咨询同意不得转为病例库或研究同意；只有同机构认证医生、另行患者同意且审核后的材料进入目标病例库。导出清单、字段、用途、版本、有效期和撤销后的下载副本处理需裁决；实现前不显示已支持。\u003c/p>\n\u003ch3 id=\"mx-19\">MX-19\u003c/h3>\n\u003cp>\u003cstrong>A-19 数据退出：\u003c/strong> 用户能分辨取消当前操作、回收报告、恢复、永久清理与停止外发；不把退出登录解释为服务器删除。保留时长、备份覆盖、第三方保留、研究副本生命周期缺失时列 UNKNOWN。没有完备证据，不承诺绝对匿名或全部可撤回。\u003c/p>\n\u003ch2 id=\"动作状态耦合\">动作—状态耦合\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>动作\u003c/th>\n\u003cth>草稿\u003c/th>\n\u003cth>服务端保存/历史\u003c/th>\n\u003cth>已生效自动化\u003c/th>\n\u003cth>分享/外发影响\u003c/th>\n\u003cth>恢复\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>保存就医准备\u003c/td>\n\u003ctd>成功后以新版本为准；失败保留\u003c/td>\n\u003ctd>revision 前进\u003c/td>\n\u003ctd>无自动任务\u003c/td>\n\u003ctd>只复制已保存新版本\u003c/td>\n\u003ctd>冲突先对照；不覆盖较新记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>更改报告原件/文字\u003c/td>\n\u003ctd>核对输入需重新对照\u003c/td>\n\u003ctd>新来源版本，旧核对留历史\u003c/td>\n\u003ctd>不由报告候选自动生效\u003c/td>\n\u003ctd>旧预览/同意失效，引用显示变化\u003c/td>\n\u003ctd>原件仍可人工整理\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>更改诊后原话\u003c/td>\n\u003ctd>保留未提交输入\u003c/td>\n\u003ctd>自报历史追加\u003c/td>\n\u003ctd>关联待发送计划/事件失效\u003c/td>\n\u003ctd>旧候选不再可确认\u003c/td>\n\u003ctd>新一轮预览与同意；已发不追回\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>暂停/终止计划\u003c/td>\n\u003ctd>不伪装完成任务\u003c/td>\n\u003ctd>状态/版本改变\u003c/td>\n\u003ctd>取消未来排程\u003c/td>\n\u003ctd>已发提示保留\u003c/td>\n\u003ctd>恢复 active 按专项规则；不自动补发所有历史\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>取消咨询/医生失效\u003c/td>\n\u003ctd>未发送留言有退出提示\u003c/td>\n\u003ctd>咨询进入终态，历史保留\u003c/td>\n\u003ctd>不自动转接新医生\u003c/td>\n\u003ctd>停止共享；已下载不能撤回\u003c/td>\n\u003ctd>患者重新选医生并授权\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"产品承诺的证明要求\">产品承诺的证明要求\u003c/h2>\n\u003cp>以下覆盖所有建议 P0 承诺；相同证据维度合并展示，不能跳过其中编号。所有运行要求均是后续待执行，不是本轮通过声明。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>承诺 / ID\u003c/th>\n\u003cth>不变量与失败模式\u003c/th>\n\u003cth>验收\u003c/th>\n\u003cth>所需证据 / 真人边界\u003c/th>\n\u003cth>当前允许表述\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>正确身份与限制 MX-01\u003c/td>\n\u003ctd>越权/过期/并发不得绕过额度\u003c/td>\n\u003ctd>A-01、A-15\u003c/td>\n\u003ctd>独立身份与并发测试、目标配置；真人决定演示账号及预算\u003c/td>\n\u003ctd>有身份/额度控制代码，当前配置未验证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>不凭空完成报告 MX-02/03\u003c/td>\n\u003ctd>未知变无、无来源发布、引用虚构\u003c/td>\n\u003ctd>A-02/03\u003c/td>\n\u003ctd>固定失败集、真实入口、专业原文审核；AI 不代签专业结论\u003c/td>\n\u003ctd>有补问与来源门禁，语义支持能力未完整验证\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>保存与恢复可信 MX-04/05/06\u003c/td>\n\u003ctd>串病例、假保存、旧摘要复制、冲突覆盖\u003c/td>\n\u003ctd>A-04/05/06\u003c/td>\n\u003ctd>双账号、双页并发、清缓存重登；仅合成写入\u003c/td>\n\u003ctd>有持久与版本控制代码及部分历史样例\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>新报告用途可控 MX-07/08/09\u003c/td>\n\u003ctd>原件误外发、旧同意复用、候选冒充本人核对\u003c/td>\n\u003ctd>A-07/08/09\u003c/td>\n\u003ctd>本地 OCR、外发拦截、组合恢复、当前部署；真人批准材料/接收方\u003c/td>\n\u003ctd>有分层处理代码，完整部署组合验收未完成\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>分享与退出 MX-15/19\u003c/td>\n\u003ctd>未认证访问、授权撤销无效、删除不可恢复却称可恢复\u003c/td>\n\u003ctd>A-15/19\u003c/td>\n\u003ctd>跨入口权限/撤销/清理证据；真人裁决保留和下载边界\u003c/td>\n\u003ctd>新咨询有约束，旧医生入口与保留政策存在关键差距\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"最小验证顺序\">最小验证顺序\u003c/h2>\n\u003cp>先无副作用静态/单元检查，再合成数据隔离集成，之后目标环境恢复与权限验证，再做真人可用性及专业核对。成本、外发、真实患者或生产操作不能从本文件推导为执行授权。已确认 bad case 回流到现有评测记录，不在这里复制题库。\u003c/p>\n","search":"# medaxis 行为与验收规格\n\n> status: review · 2026-10-09 · 只维护跨模块验收；专项字段及详细状态见原规格\n\n## 如何使用\n\n本文件定义“要怎样才算正确”，不声称场景已经执行。下面的 `a-*` 是验收索引；证据要求对应 [能力事实表](development_readiness.md)，执行方法沿用现有测试/评测入口。默认使用合成数据，真实写入及专业签署需另行授权。\n\n## 核心验收\n\n### mx-01\n\n**a-01 身份与模式：** 普通患者登录后看到本人数据；访客知道过期及额度限制；开启面试模式时，仅专用 active 患者可调用模型。额度耗尽停止新模型请求但保留浏览。普通访客按提交计数、失败可按服务规则返还；面试模式按实际 provider http 尝试持久扣减，重试计入、失败不退还、上限配置 1–20。验证重新启动/并发请求不自动补充；这不是 token 上限。当前开启状态 unknown。\n\n### mx-02\n\n**a-02 补问：** 已知信息可复用，未知允许保留未知；修正前文后后续采集依据新陈述；sse 中断不伪装完成，已显示内容及下一步可辨认。题量节省与关键缺口分别评估，不能以少问为唯一成功。\n\n### mx-03\n\n**a-03 证据门禁：** 有可核验来源且形成有效引用才发布辅助报告；检索超时、零来源、引用失效显示可理解失败。来源相关性、要点覆盖、原文支持和患者适用性是四种不同判断；任一未验证状态不能显示已专业审核。知识库为空/embedding 不可用/重排失败均单列场景。\n\n### mx-04\n\n**a-04 保存：** 同一来源会话重复保存返回同一病例语义；未保存成功不能显示已归档。用户 a 不能读写 b 的病例；迟到响应不能串入当前病例。生成失败与保存失败分别报告；清浏览器后只承诺恢复服务端已保存资料。\n\n### mx-05\n\n**a-05 就医准备：** 修改草稿、成功保存、复制使用的版本分开；冲突保留输入并要求重新核对。来源修订后显示过期状态并禁用旧摘要复制；更新成功后再复制。切换阶段可保留当前会话草稿，刷新/离开会丢未保存输入，需提前说明。详见 [就医准备](../visit_preparation_spec.md)。\n\n### mx-06\n\n**a-06 诊后自报：** 在正确病例保存反馈，带 revision，冲突不覆盖较新版本，历史可追溯。本人自报“医生说了什么”不成为平台医生签署；保存不自动创建用药任务。\n\n### mx-07\n\n**a-07 归档：** 本人上传有序页组，独立报告可不关联病例；相同字节及顺序按本人去重，用户明确选择复用或新副本。复用不覆盖历史。未保存上传刷新丢失，保存失败可重试且不重复创建。报告删除与恢复、病例关联对删除状态的响应单列验证。已有 10mib/5文件/20页/批次5份为专项中的实现常量与假设，不把它们提升为新获批需求。\n\n### mx-08\n\n**a-08 外发同意：** 新报告先本地取字；患者看到脱敏文字、接收模型和来源版本，明确同意本次发送后才外发。预览后文字/原件/接收方变化拒绝旧同意；失败不自动重发、不静默切换供应商。人工编辑文字仍需重新核对同意。旧 `/documents/upload` 的视觉/文件外发是不同入口，不能套用“所有原件不外发”表述。\n\n### mx-09\n\n**a-09 核对与引用：** ai 候选不覆盖手动草稿；确认生成不可变核对版本。病例固定引用来源与核对版本；源或核对改变显示待重新核对，不能悄悄改成新结论。本人核对不得显示医生审核。详情、关联、原件和回收操作都应拒绝跨用户访问。\n\n### mx-10\n\n**a-10 档案/测量：** 未填、未知、明确无、已有记录分别显示；删掉最后一条不能自动变“明确无”。修改带修订号；409/428保留草稿。测量重复 request_id 同内容返回既有结果、不同内容拒绝。详见 [档案规格](../health_profile_spec.md)。\n\n### mx-11\n\n**a-11 手动计划：** 待确认计划只有确认后生效；暂停/终止停止未来事件，已发送记录仍存在。任务重复完成不改变首次记录；并发按版本冲突处理。日程按既有 utc+8 约定核对；任务数、日期和生命周期沿用 [随访规格](../followup_plan_spec.md)。\n\n### mx-12\n\n**a-12 候选转任务：** 从已保存诊后原话取候选，逐次同意，默认不选；患者逐项确认并补足时间才生效。缺失剂量/药名不能由 ai 补成处方；来源变化取消尚未发送的关联计划与事件，已发送无法追回。详见 [诊后 ai](../post_visit_ai_actions_spec.md)。\n\n### mx-13\n\n**a-13 提醒：** pending/sent/acknowledged 等送达状态不等于任务完成或医学效果；只有 sent 可确认，重复确认幂等。邮件只发通用提示，smtp 失败不能写送达成功；发生发送后落库失败时记录可能重复的边界。不承诺即时监护或 exactly-once。\n\n### mx-14\n\n**a-14 定向咨询：** 患者选择可用认证医生、资料快照并同意；同病例只能一个活动咨询。快照变化重新核对；重复提交幂等。医生接受/婉拒、患者补充、医生回复与结束有历史记录。回复写入原咨询，通知已读不改变咨询状态。\n\n### mx-15\n\n**a-15 授权撤销：** 患者取消、咨询结束、医生认证撤销或账号失效后停止继续共享；读取和发布都重新验证。旧 `/doctor/*` 和 `/medical-cases/*` 也必须满足已裁决的对象范围，不能仅凭前端角色守卫。已下载/外发的材料不能远程追回。现有医生 api 的患者全量会话查询与认证差距，见 [实现差距](development_readiness.md)。\n\n### mx-16\n\n**a-16 运营结果：** 非管理员不能调用管理 api；最后 active admin 和本人误踢受保护。医生审核批准和邮件送达分别显示，邮件失败不能显示“已发送”。明确数据库删除与停用区别；现有 kick 为实际删除，不能宣称软删除可恢复。关键动作审计覆盖须逐项证明。\n\n### mx-17\n\n**a-17 服务配置：** 知识审核、模型配置、通知及邮件操作在加载/失败/取消时保留明确结果；模型健康检查不成为患者数据外发默认授权。记录变更前后版本及操作者；未验证的管理表单不写“已完成联调”。\n\n### mx-18\n\n**a-18 机构/研究：** 咨询同意不得转为病例库或研究同意；只有同机构认证医生、另行患者同意且审核后的材料进入目标病例库。导出清单、字段、用途、版本、有效期和撤销后的下载副本处理需裁决；实现前不显示已支持。\n\n### mx-19\n\n**a-19 数据退出：** 用户能分辨取消当前操作、回收报告、恢复、永久清理与停止外发；不把退出登录解释为服务器删除。保留时长、备份覆盖、第三方保留、研究副本生命周期缺失时列 unknown。没有完备证据，不承诺绝对匿名或全部可撤回。\n\n## 动作—状态耦合\n\n| 动作 | 草稿 | 服务端保存/历史 | 已生效自动化 | 分享/外发影响 | 恢复 |\n|---|---|---|---|---|---|\n| 保存就医准备 | 成功后以新版本为准；失败保留 | revision 前进 | 无自动任务 | 只复制已保存新版本 | 冲突先对照；不覆盖较新记录 |\n| 更改报告原件/文字 | 核对输入需重新对照 | 新来源版本，旧核对留历史 | 不由报告候选自动生效 | 旧预览/同意失效，引用显示变化 | 原件仍可人工整理 |\n| 更改诊后原话 | 保留未提交输入 | 自报历史追加 | 关联待发送计划/事件失效 | 旧候选不再可确认 | 新一轮预览与同意；已发不追回 |\n| 暂停/终止计划 | 不伪装完成任务 | 状态/版本改变 | 取消未来排程 | 已发提示保留 | 恢复 active 按专项规则；不自动补发所有历史 |\n| 取消咨询/医生失效 | 未发送留言有退出提示 | 咨询进入终态，历史保留 | 不自动转接新医生 | 停止共享；已下载不能撤回 | 患者重新选医生并授权 |\n\n## 产品承诺的证明要求\n\n以下覆盖所有建议 p0 承诺；相同证据维度合并展示，不能跳过其中编号。所有运行要求均是后续待执行，不是本轮通过声明。\n\n| 承诺 / id | 不变量与失败模式 | 验收 | 所需证据 / 真人边界 | 当前允许表述 |\n|---|---|---|---|---|\n| 正确身份与限制 mx-01 | 越权/过期/并发不得绕过额度 | a-01、a-15 | 独立身份与并发测试、目标配置；真人决定演示账号及预算 | 有身份/额度控制代码，当前配置未验证 |\n| 不凭空完成报告 mx-02/03 | 未知变无、无来源发布、引用虚构 | a-02/03 | 固定失败集、真实入口、专业原文审核；ai 不代签专业结论 | 有补问与来源门禁，语义支持能力未完整验证 |\n| 保存与恢复可信 mx-04/05/06 | 串病例、假保存、旧摘要复制、冲突覆盖 | a-04/05/06 | 双账号、双页并发、清缓存重登；仅合成写入 | 有持久与版本控制代码及部分历史样例 |\n| 新报告用途可控 mx-07/08/09 | 原件误外发、旧同意复用、候选冒充本人核对 | a-07/08/09 | 本地 ocr、外发拦截、组合恢复、当前部署；真人批准材料/接收方 | 有分层处理代码，完整部署组合验收未完成 |\n| 分享与退出 mx-15/19 | 未认证访问、授权撤销无效、删除不可恢复却称可恢复 | a-15/19 | 跨入口权限/撤销/清理证据；真人裁决保留和下载边界 | 新咨询有约束，旧医生入口与保留政策存在关键差距 |\n\n## 最小验证顺序\n\n先无副作用静态/单元检查，再合成数据隔离集成，之后目标环境恢复与权限验证，再做真人可用性及专业核对。成本、外发、真实患者或生产操作不能从本文件推导为执行授权。已确认 bad case 回流到现有评测记录，不在这里复制题库。\n"},{"id":"DOMAIN_MODEL","label":"领域模型","html":"\u003ch1 id=\"medaxis-领域模型\">MedAxis 领域模型\u003c/h1>\n\u003cblockquote>\n\u003cp>Status: REVIEW · 2026-10-09 · 描述产品概念，不替代数据库 schema\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"一句话理解\">一句话理解\u003c/h2>\n\u003cp>\u003cstrong>会话负责收集信息，病例组织一次问题，报告保留材料，准备包服务就医；咨询只分享选定快照，计划只执行明确确认后的任务。\u003c/strong> 这些对象不能因为都出现在同一页面而混为一种“病历”。\u003c/p>\n\u003cp>\u003cimg src=\"visuals/domain-model.png\" alt=\"领域关系\">\u003c/p>\n\u003ch2 id=\"统一词汇\">统一词汇\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>术语\u003c/th>\n\u003cth>产品含义\u003c/th>\n\u003cth>不能混淆为\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>患者 / Patient\u003c/td>\n\u003ctd>数据主体和本人资料操作者\u003c/td>\n\u003ctd>前端可见角色缓存；儿童监护关系仍未知\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>问诊会话 / AgentSession\u003c/td>\n\u003ctd>主诉、补问和辅助输出的采集过程\u003c/td>\n\u003ctd>已保存病例或正式诊断\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>病例 / MedicalCase\u003c/td>\n\u003ctd>一次问题的持久组织单元，含来源会话、准备与自报记录\u003c/td>\n\u003ctd>患者全部健康史；机构病例库\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>就医准备 / Preparation\u003c/td>\n\u003ctd>带来源版本、本人修订与待补充项的资料包\u003c/td>\n\u003ctd>AI 自动完成的专业审核\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>独立报告 / PatientReport\u003c/td>\n\u003ctd>患者拥有的一组有序原件及其处理/核对版本\u003c/td>\n\u003ctd>问诊生成的辅助报告；旧附件解析任务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>来源版本 / Source version\u003c/td>\n\u003ctd>本次原件和文字的明确版本依据\u003c/td>\n\u003ctd>永远同步更新的“最新结论”\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>AI 候选 / Candidate\u003c/td>\n\u003ctd>基于某来源整理的建议结构\u003c/td>\n\u003ctd>生效医嘱、本人核对版本\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>手动草稿 / Draft\u003c/td>\n\u003ctd>尚未确认的编辑内容；有些可另存后端\u003c/td>\n\u003ctd>所有输入刷新都可恢复\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>本人核对 / Confirmed review\u003c/td>\n\u003ctd>患者确认资料整理符合原件/自述\u003c/td>\n\u003ctd>医生认证、诊断签署或临床正确性\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>病例引用 / Report link\u003c/td>\n\u003ctd>病例指向指定报告来源/核对版本\u003c/td>\n\u003ctd>自动跟随未来版本的分享授权\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>诊后反馈 / Post-visit feedback\u003c/td>\n\u003ctd>患者自报的就诊记录及历史\u003c/td>\n\u003ctd>平台医生实际签发内容\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>定向咨询 / Consultation\u003c/td>\n\u003ctd>单病例、单一活动医生、授权快照的对话\u003c/td>\n\u003ctd>全患者历史共享、长期绑定医生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>医生建议 / Advice\u003c/td>\n\u003ctd>带作者、时间、分类的健康咨询留言\u003c/td>\n\u003ctd>在线处方、自动调药或医生已接诊诊疗\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>随访计划 / CarePlan\u003c/td>\n\u003ctd>本人手动安排或确认候选后生效的任务组\u003c/td>\n\u003ctd>无人医学监护\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>提醒事件 / MonitoringEvent\u003c/td>\n\u003ctd>某个任务的排程、发送及确认记录\u003c/td>\n\u003ctd>任务完成，或医学治疗效果\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>通知 / Notification\u003c/td>\n\u003ctd>提醒查看某对象状态的通用消息\u003c/td>\n\u003ctd>咨询接受/完成等业务状态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>机构病例库 / Research grant\u003c/td>\n\u003ctd>另行同意和审核后的未来复用范围\u003c/td>\n\u003ctd>当前咨询同意的附赠权限\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"关系与归属\">关系与归属\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>关系\u003c/th>\n\u003cth>含义 / 约束\u003c/th>\n\u003cth>实现证据\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>患者 → 多会话、多病例、多独立报告\u003c/td>\n\u003ctd>服务端对象所有权分别检查\u003c/td>\n\u003ctd>\u003ca href=\"EVIDENCE.md\">EVIDENCE E-02/E-04/E-08\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>来源会话 → 病例保存\u003c/td>\n\u003ctd>使用来源身份支持重复保存语义；追问可有父会话\u003c/td>\n\u003ctd>\u003ca href=\"EVIDENCE.md\">E-03/E-04\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>病例 → 准备与诊后反馈历史\u003c/td>\n\u003ctd>同病例恢复，来源与 revision 分开\u003c/td>\n\u003ctd>\u003ca href=\"EVIDENCE.md\">E-05/E-06\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>独立报告 ↔ 零至多个本人病例\u003c/td>\n\u003ctd>通过固定版本引用；不是转移所有权\u003c/td>\n\u003ctd>\u003ca href=\"EVIDENCE.md\">E-09\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>病例 → 至多一个活动咨询\u003c/td>\n\u003ctd>pending/accepted/awaiting_patient 为活动态\u003c/td>\n\u003ctd>\u003ca href=\"EVIDENCE.md\">E-11\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>咨询 → 多条不可覆盖消息\u003c/td>\n\u003ctd>患者与指定认证医生，各自受对象权限约束\u003c/td>\n\u003ctd>\u003ca href=\"EVIDENCE.md\">E-11\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>计划 → 多任务 → 提醒事件\u003c/td>\n\u003ctd>启停和来源失效影响待发送事件，不删除已发送事实\u003c/td>\n\u003ctd>\u003ca href=\"EVIDENCE.md\">E-07/E-10\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>知识文档 → 多片段 → 检索引用\u003c/td>\n\u003ctd>保存来源和模型/原文定位；相关不等于支持\u003c/td>\n\u003ctd>\u003ca href=\"EVIDENCE.md\">E-14/E-15\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>概念图中的“患者拥有”不等于每个后端模型已有统一 owner 字段；具体实现以工程数据模型为准。图中咨询快照和病例报告引用也不是同一授权机制，新报告加入咨询的覆盖仍需确认。\u003c/p>\n\u003ch2 id=\"状态与不变量\">状态与不变量\u003c/h2>\n\u003ch3 id=\"定向咨询当前代码状态\">定向咨询（当前代码状态）\u003c/h3>\n\u003cdetails class=\"graph-source\">\u003csummary>查看可编辑 Mermaid 图源\u003c/summary>\u003cpre>\u003ccode>stateDiagram-v2\n  [*] --&gt; pending: 患者选医生并授权\n  pending --&gt; accepted: 医生接受\n  pending --&gt; declined: 医生婉拒\n  pending --&gt; cancelled: 患者取消\n  accepted --&gt; awaiting_patient: 医生要求补充\n  awaiting_patient --&gt; accepted: 患者补充\n  accepted --&gt; completed: 医生结束\n  awaiting_patient --&gt; completed: 医生结束\n  accepted --&gt; cancelled: 患者取消\n  awaiting_patient --&gt; cancelled: 患者取消\n  pending --&gt; unavailable: 医生失效\n  accepted --&gt; unavailable: 医生失效\n  awaiting_patient --&gt; unavailable: 医生失效\u003c/code>\u003c/pre>\u003c/details>\u003cp>终态停止医生继续访问授权快照；患者需要重新选择与授权，不自动转接。图中角色文字按目标用户体验标注；当前 \u003ccode>end\u003c/code> 分支未显式限定医生角色，属于 \u003ca href=\"EVIDENCE.md\">EVIDENCE §5\u003c/a> 的待核对差距，不能以图证明权限成立。具体操作见 \u003ca href=\"../../../backend/app/api/v1/consultations.py#L247\">\u003ccode>consultation_action\u003c/code>\u003c/a>；图省略不改变状态的普通留言。\u003c/p>\n\u003ch3 id=\"随访计划专项规格语义\">随访计划（专项规格语义）\u003c/h3>\n\u003cp>待确认 → active；active 与 paused 可按规则切换；completed/cancelled 为终止路径，结束日期也影响排程。终止计划和确认提醒不能互相替代。字段值与允许迁移以 \u003ca href=\"../FOLLOWUP_PLAN_SPEC.md\">FOLLOWUP_PLAN_SPEC\u003c/a> 为准。\u003c/p>\n\u003ch3 id=\"报告处理多条状态轴\">报告处理（多条状态轴）\u003c/h3>\n\u003cp>原件存在/回收、取字任务状态、AI 处理状态、核对 revision、病例引用是否过期是独立状态轴。不能用一个“已完成”标签遮盖其中失败。候选生成成功不等于本人确认，核对确认不等于医生审核；具体状态值沿用 \u003ca href=\"../PATIENT_REPORTS_REQUIREMENTS.md\">报告需求\u003c/a>。\u003c/p>\n\u003ch2 id=\"必须保持的产品不变量\">必须保持的产品不变量\u003c/h2>\n\u003col>\n\u003cli>未知 ≠ 明确无；原话 ≠ AI；本人核对 ≠ 专业签署。\u003c/li>\n\u003cli>草稿 ≠ 保存成功；浏览器聊天恢复 ≠ 服务端病例恢复。\u003c/li>\n\u003cli>同一来源、同意、核对和引用必须能追到明确版本。\u003c/li>\n\u003cli>对象归属、角色资格和分享范围均由服务器判断，界面可见性不能授权。\u003c/li>\n\u003cli>咨询同意、模型文字外发、机构病例库和研究授权互不继承。\u003c/li>\n\u003cli>消息已读、提醒已发、任务完成、咨询结束分别记录。\u003c/li>\n\u003cli>撤销停止未来动作；已下载、已发邮件和已外发内容不能被假定追回。\u003c/li>\n\u003c/ol>\n\u003cp>医生资质、机构成员资格、账号状态应独立建模；当前机构成员授权、监护关系和研究模型尚未完成，详见 \u003ca href=\"DECISIONS.md\">开放项\u003c/a>。\u003c/p>\n","search":"# medaxis 领域模型\n\n> status: review · 2026-10-09 · 描述产品概念，不替代数据库 schema\n\n## 一句话理解\n\n**会话负责收集信息，病例组织一次问题，报告保留材料，准备包服务就医；咨询只分享选定快照，计划只执行明确确认后的任务。** 这些对象不能因为都出现在同一页面而混为一种“病历”。\n\n![领域关系](visuals/domain-model.png)\n\n## 统一词汇\n\n| 术语 | 产品含义 | 不能混淆为 |\n|---|---|---|\n| 患者 / patient | 数据主体和本人资料操作者 | 前端可见角色缓存；儿童监护关系仍未知 |\n| 问诊会话 / agentsession | 主诉、补问和辅助输出的采集过程 | 已保存病例或正式诊断 |\n| 病例 / medicalcase | 一次问题的持久组织单元，含来源会话、准备与自报记录 | 患者全部健康史；机构病例库 |\n| 就医准备 / preparation | 带来源版本、本人修订与待补充项的资料包 | ai 自动完成的专业审核 |\n| 独立报告 / patientreport | 患者拥有的一组有序原件及其处理/核对版本 | 问诊生成的辅助报告；旧附件解析任务 |\n| 来源版本 / source version | 本次原件和文字的明确版本依据 | 永远同步更新的“最新结论” |\n| ai 候选 / candidate | 基于某来源整理的建议结构 | 生效医嘱、本人核对版本 |\n| 手动草稿 / draft | 尚未确认的编辑内容；有些可另存后端 | 所有输入刷新都可恢复 |\n| 本人核对 / confirmed review | 患者确认资料整理符合原件/自述 | 医生认证、诊断签署或临床正确性 |\n| 病例引用 / report link | 病例指向指定报告来源/核对版本 | 自动跟随未来版本的分享授权 |\n| 诊后反馈 / post-visit feedback | 患者自报的就诊记录及历史 | 平台医生实际签发内容 |\n| 定向咨询 / consultation | 单病例、单一活动医生、授权快照的对话 | 全患者历史共享、长期绑定医生 |\n| 医生建议 / advice | 带作者、时间、分类的健康咨询留言 | 在线处方、自动调药或医生已接诊诊疗 |\n| 随访计划 / careplan | 本人手动安排或确认候选后生效的任务组 | 无人医学监护 |\n| 提醒事件 / monitoringevent | 某个任务的排程、发送及确认记录 | 任务完成，或医学治疗效果 |\n| 通知 / notification | 提醒查看某对象状态的通用消息 | 咨询接受/完成等业务状态 |\n| 机构病例库 / research grant | 另行同意和审核后的未来复用范围 | 当前咨询同意的附赠权限 |\n\n## 关系与归属\n\n| 关系 | 含义 / 约束 | 实现证据 |\n|---|---|---|\n| 患者 → 多会话、多病例、多独立报告 | 服务端对象所有权分别检查 | [evidence e-02/e-04/e-08](evidence.md) |\n| 来源会话 → 病例保存 | 使用来源身份支持重复保存语义；追问可有父会话 | [e-03/e-04](evidence.md) |\n| 病例 → 准备与诊后反馈历史 | 同病例恢复，来源与 revision 分开 | [e-05/e-06](evidence.md) |\n| 独立报告 ↔ 零至多个本人病例 | 通过固定版本引用；不是转移所有权 | [e-09](evidence.md) |\n| 病例 → 至多一个活动咨询 | pending/accepted/awaiting_patient 为活动态 | [e-11](evidence.md) |\n| 咨询 → 多条不可覆盖消息 | 患者与指定认证医生，各自受对象权限约束 | [e-11](evidence.md) |\n| 计划 → 多任务 → 提醒事件 | 启停和来源失效影响待发送事件，不删除已发送事实 | [e-07/e-10](evidence.md) |\n| 知识文档 → 多片段 → 检索引用 | 保存来源和模型/原文定位；相关不等于支持 | [e-14/e-15](evidence.md) |\n\n概念图中的“患者拥有”不等于每个后端模型已有统一 owner 字段；具体实现以工程数据模型为准。图中咨询快照和病例报告引用也不是同一授权机制，新报告加入咨询的覆盖仍需确认。\n\n## 状态与不变量\n\n### 定向咨询（当前代码状态）\n\n```mermaid\nstatediagram-v2\n  [*] --> pending: 患者选医生并授权\n  pending --> accepted: 医生接受\n  pending --> declined: 医生婉拒\n  pending --> cancelled: 患者取消\n  accepted --> awaiting_patient: 医生要求补充\n  awaiting_patient --> accepted: 患者补充\n  accepted --> completed: 医生结束\n  awaiting_patient --> completed: 医生结束\n  accepted --> cancelled: 患者取消\n  awaiting_patient --> cancelled: 患者取消\n  pending --> unavailable: 医生失效\n  accepted --> unavailable: 医生失效\n  awaiting_patient --> unavailable: 医生失效\n```\n\n终态停止医生继续访问授权快照；患者需要重新选择与授权，不自动转接。图中角色文字按目标用户体验标注；当前 `end` 分支未显式限定医生角色，属于 [evidence §5](evidence.md) 的待核对差距，不能以图证明权限成立。具体操作见 [`consultation_action`](../../../backend/app/api/v1/consultations.py#l247)；图省略不改变状态的普通留言。\n\n### 随访计划（专项规格语义）\n\n待确认 → active；active 与 paused 可按规则切换；completed/cancelled 为终止路径，结束日期也影响排程。终止计划和确认提醒不能互相替代。字段值与允许迁移以 [followup_plan_spec](../followup_plan_spec.md) 为准。\n\n### 报告处理（多条状态轴）\n\n原件存在/回收、取字任务状态、ai 处理状态、核对 revision、病例引用是否过期是独立状态轴。不能用一个“已完成”标签遮盖其中失败。候选生成成功不等于本人确认，核对确认不等于医生审核；具体状态值沿用 [报告需求](../patient_reports_requirements.md)。\n\n## 必须保持的产品不变量\n\n1. 未知 ≠ 明确无；原话 ≠ ai；本人核对 ≠ 专业签署。\n2. 草稿 ≠ 保存成功；浏览器聊天恢复 ≠ 服务端病例恢复。\n3. 同一来源、同意、核对和引用必须能追到明确版本。\n4. 对象归属、角色资格和分享范围均由服务器判断，界面可见性不能授权。\n5. 咨询同意、模型文字外发、机构病例库和研究授权互不继承。\n6. 消息已读、提醒已发、任务完成、咨询结束分别记录。\n7. 撤销停止未来动作；已下载、已发邮件和已外发内容不能被假定追回。\n\n医生资质、机构成员资格、账号状态应独立建模；当前机构成员授权、监护关系和研究模型尚未完成，详见 [开放项](decisions.md)。\n"},{"id":"USER_FLOWS","label":"用户流程","html":"\u003ch1 id=\"medaxis-用户流程\">MedAxis 用户流程\u003c/h1>\n\u003cblockquote>\n\u003cp>Status: REVIEW · 2026-10-09 · 主线与异常放在同一条流程中；图片为下方图源的派生物\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"1-患者从描述到再次找回\">1. 患者从描述到再次找回\u003c/h2>\n\u003cp>\u003cimg src=\"visuals/patient-flow.png\" alt=\"患者资料闭环\">\u003c/p>\n\u003cdetails class=\"graph-source\">\u003csummary>查看可编辑 Mermaid 图源\u003c/summary>\u003cpre>\u003ccode>flowchart TB\n  enter[\"登录患者：描述问题\"] --&gt; collect[\"补充信息／允许未知\"]\n  collect --&gt; retrieve[\"检索与辅助整理\"]\n  retrieve --&gt; gate{\"可核验来源与有效引用？\"}\n  gate --&gt;|否| fail[\"说明证据不足／保留已输入资料\"]\n  gate --&gt;|是| report[\"显示辅助报告与来源\"]\n  report --&gt; save{\"病例保存成功？\"}\n  save --&gt;|否| retry[\"报告保持可见／明确未保存\"]\n  retry --&gt; save\n  save --&gt;|是| prep[\"同病例：核对就医准备\"]\n  prep --&gt; revision{\"来源与修订一致？\"}\n  revision --&gt;|否| conflict[\"保留草稿／对照新版本\"]\n  conflict --&gt; prep\n  revision --&gt;|是| ready[\"保存后复制摘要\"]\n  ready --&gt; feedback[\"就诊后：保存本人自报反馈\"]\n  feedback --&gt; restore[\"重登：恢复已保存病例资料\"]\u003c/code>\u003c/pre>\u003c/details>\u003cp>入口 \u003ccode>/chat\u003c/code>，持久资料在 \u003ccode>/cases?case_id=…&amp;stage=…\u003c/code>。访客试用与面试模式见 A-01，不承诺同样的保存范围。用户可在补问、核对或反馈阶段退出；当前会话草稿与已保存记录恢复能力不同。保存失败不得进入“已归档”状态，刷新恢复不是恢复所有未保存输入。\u003c/p>\n\u003ch2 id=\"2-独立报告同意与核对\">2. 独立报告：同意与核对\u003c/h2>\n\u003cp>\u003cimg src=\"visuals/report-consent.png\" alt=\"新报告中心的资料边界\">\u003c/p>\n\u003cdetails class=\"graph-source\">\u003csummary>查看可编辑 Mermaid 图源\u003c/summary>\u003cpre>\u003ccode>flowchart TB\n  upload[\"本人上传有序原件／选择复用或新副本\"] --&gt; archive[\"归档：仅本人可见\"]\n  archive --&gt; parse[\"本地取字／OCR\"]\n  parse --&gt; preview[\"预览脱敏文字、来源版本与接收模型\"]\n  preview --&gt; consent{\"本次明确同意？\"}\n  consent --&gt;|否| manual[\"保留原件／可手动整理\"]\n  consent --&gt;|是| version{\"文字、来源、接收方一致？\"}\n  version --&gt;|否| preview\n  version --&gt;|是| ai[\"仅发送同意文字／失败不自动重发\"]\n  ai --&gt; candidate[\"AI 候选：待本人核对\"]\n  candidate --&gt; draft[\"编辑／另存手动草稿\"]\n  manual --&gt; draft\n  draft --&gt; confirm[\"明确确认：生成核对历史版本\"]\n  confirm --&gt; link[\"按版本引用到本人病例\"]\n  link --&gt; changed[\"来源变化：标记待重新核对\"]\n  changed --&gt; preview\u003c/code>\u003c/pre>\u003c/details>\u003cp>这里只描述新 \u003ccode>/reports\u003c/code> 中心。旧问诊附件可将原图/文件发送外部模型，见 \u003ca href=\"EVIDENCE.md\">E-16\u003c/a>，不能混用隐私承诺。OCR 失败保留原件并显示失败，不自动接外部 OCR；本人确认仍不是医生复核。\u003c/p>\n\u003cp>回收报告暂停普通可见引用；恢复、永久清理及备份覆盖需按专项执行验证。已外发副本不因为本地回收而被撤回。\u003c/p>\n\u003ch2 id=\"3-定向医生咨询\">3. 定向医生咨询\u003c/h2>\n\u003cp>\u003cimg src=\"visuals/doctor-consultation.png\" alt=\"定向咨询与撤销\">\u003c/p>\n\u003cdetails class=\"graph-source\">\u003csummary>查看可编辑 Mermaid 图源\u003c/summary>\u003cpre>\u003ccode>flowchart TB\n  case[\"患者选择已保存病例\"] --&gt; choose[\"选择可用认证医生、快照与材料\"]\n  choose --&gt; grant[\"明确同意本次分享\"]\n  grant --&gt; active{\"已有活动咨询？\"}\n  active --&gt;|是| existing[\"查看或取消旧咨询后重选\"]\n  existing --&gt; choose\n  active --&gt;|否| pending[\"pending：医生查看授权快照\"]\n  pending --&gt; decision{\"医生处理\"}\n  decision --&gt;|婉拒| declined[\"declined：停止共享\"]\n  decision --&gt;|接受| accepted[\"accepted：健康建议／持续留言\"]\n  accepted --&gt; waiting[\"awaiting_patient：请求补充\"]\n  waiting --&gt; accepted\n  accepted --&gt; completed[\"completed：停止共享\"]\n  pending --&gt; stop[\"患者取消或医生失效：停止共享\"]\n  accepted --&gt; stop\n  waiting --&gt; stop\u003c/code>\u003c/pre>\u003c/details>\u003cp>已实现咨询入口可由患者/医生页面中的咨询面板进入，不能凭 \u003ccode>/doctor/cases\u003c/code> 的存在断言该页已符合新咨询授权。读取和发布须重查认证；患者不能替医生接受；通知已读不代表已接收业务。旧医生页风险见 \u003ca href=\"DEVELOPMENT_READINESS.md\">差距矩阵\u003c/a>。\u003c/p>\n\u003ch2 id=\"4-诊后记录到日常任务\">4. 诊后记录到日常任务\u003c/h2>\n\u003cp>患者保存自报反馈 → 自主选择 AI 整理 → 预览脱敏文字与接收方 → 明确同意 → 获得默认未选候选 → 逐项核对、补日期/时间 → 确认生效 → 站内提醒/可选通用邮件 → 本人记录任务完成。\u003c/p>\n\u003cp>异常：未同意走手动计划；缺药名、剂量或明确指示不能补成医嘱；来源变化取消待发送关联事件；暂停/终止停止未来排程；已发送事件仍保留。邮件发送不能证明患者看见，更不能证明任务执行。\u003c/p>\n\u003ch2 id=\"5-管理员处理\">5. 管理员处理\u003c/h2>\n\u003cp>管理员登录 → 根据任务进入账号/审核/知识/配置/通知/邮件页面 → 核对对象和操作影响 → 提交 → 分别显示业务处理与外部发送结果 → 检查必要审计记录。\u003c/p>\n\u003cp>现有账号 kick 为数据库删除；医生拒绝审核含删除路径。产品评审必须明确停用与删除的区别。审核批准时邮件失败仍可能返回“已发送”，属于已定位差距；本次只记录，不执行管理操作。\u003c/p>\n\u003ch2 id=\"失败取消与恢复总表\">失败、取消与恢复总表\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>遇到什么\u003c/th>\n\u003cth>用户应看到什么\u003c/th>\n\u003cth>可继续做什么\u003c/th>\n\u003cth>禁止的假成功\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>请求超时/来源不足\u003c/td>\n\u003ctd>明确失败或证据不足\u003c/td>\n\u003ctd>保留资料、人工核对、受控重试\u003c/td>\n\u003ctd>展示完整辅助结论\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>版本冲突\u003c/td>\n\u003ctd>旧版本与新版本需要对照\u003c/td>\n\u003ctd>保留草稿、重载后重新确认\u003c/td>\n\u003ctd>自动覆盖最新记录\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>后台解析/模型失败\u003c/td>\n\u003ctd>独立任务失败状态\u003c/td>\n\u003ctd>原件可读、手动整理\u003c/td>\n\u003ctd>自动切外部 OCR/重发材料\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>切病例迟到响应\u003c/td>\n\u003ctd>当前病例边界明确\u003c/td>\n\u003ctd>只操作当前选中病例\u003c/td>\n\u003ctd>用 A 资料填 B 表单\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>取消分享/医生失效\u003c/td>\n\u003ctd>咨询停止共享，历史仍可解释\u003c/td>\n\u003ctd>患者另选并再次授权\u003c/td>\n\u003ctd>自动把授权转交新医生\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>提醒邮件失败\u003c/td>\n\u003ctd>未送达或状态不确定\u003c/td>\n\u003ctd>查站内事件/手动记录\u003c/td>\n\u003ctd>宣称可靠实时监护\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>刷新/退出\u003c/td>\n\u003ctd>已保存与未保存范围清楚\u003c/td>\n\u003ctd>服务端恢复；未存草稿重新填写\u003c/td>\n\u003ctd>承诺所有聊天/草稿跨设备恢复\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>逐项验收见 \u003ca href=\"PRODUCT_SPEC.md\">PRODUCT_SPEC\u003c/a>。思维导图只概括模块，条件/回环关系以上述流程为准。\u003c/p>\n","search":"# medaxis 用户流程\n\n> status: review · 2026-10-09 · 主线与异常放在同一条流程中；图片为下方图源的派生物\n\n## 1. 患者从描述到再次找回\n\n![患者资料闭环](visuals/patient-flow.png)\n\n```mermaid\nflowchart tb\n  enter[\"登录患者：描述问题\"] --> collect[\"补充信息／允许未知\"]\n  collect --> retrieve[\"检索与辅助整理\"]\n  retrieve --> gate{\"可核验来源与有效引用？\"}\n  gate -->|否| fail[\"说明证据不足／保留已输入资料\"]\n  gate -->|是| report[\"显示辅助报告与来源\"]\n  report --> save{\"病例保存成功？\"}\n  save -->|否| retry[\"报告保持可见／明确未保存\"]\n  retry --> save\n  save -->|是| prep[\"同病例：核对就医准备\"]\n  prep --> revision{\"来源与修订一致？\"}\n  revision -->|否| conflict[\"保留草稿／对照新版本\"]\n  conflict --> prep\n  revision -->|是| ready[\"保存后复制摘要\"]\n  ready --> feedback[\"就诊后：保存本人自报反馈\"]\n  feedback --> restore[\"重登：恢复已保存病例资料\"]\n```\n\n入口 `/chat`，持久资料在 `/cases?case_id=…&stage=…`。访客试用与面试模式见 a-01，不承诺同样的保存范围。用户可在补问、核对或反馈阶段退出；当前会话草稿与已保存记录恢复能力不同。保存失败不得进入“已归档”状态，刷新恢复不是恢复所有未保存输入。\n\n## 2. 独立报告：同意与核对\n\n![新报告中心的资料边界](visuals/report-consent.png)\n\n```mermaid\nflowchart tb\n  upload[\"本人上传有序原件／选择复用或新副本\"] --> archive[\"归档：仅本人可见\"]\n  archive --> parse[\"本地取字／ocr\"]\n  parse --> preview[\"预览脱敏文字、来源版本与接收模型\"]\n  preview --> consent{\"本次明确同意？\"}\n  consent -->|否| manual[\"保留原件／可手动整理\"]\n  consent -->|是| version{\"文字、来源、接收方一致？\"}\n  version -->|否| preview\n  version -->|是| ai[\"仅发送同意文字／失败不自动重发\"]\n  ai --> candidate[\"ai 候选：待本人核对\"]\n  candidate --> draft[\"编辑／另存手动草稿\"]\n  manual --> draft\n  draft --> confirm[\"明确确认：生成核对历史版本\"]\n  confirm --> link[\"按版本引用到本人病例\"]\n  link --> changed[\"来源变化：标记待重新核对\"]\n  changed --> preview\n```\n\n这里只描述新 `/reports` 中心。旧问诊附件可将原图/文件发送外部模型，见 [e-16](evidence.md)，不能混用隐私承诺。ocr 失败保留原件并显示失败，不自动接外部 ocr；本人确认仍不是医生复核。\n\n回收报告暂停普通可见引用；恢复、永久清理及备份覆盖需按专项执行验证。已外发副本不因为本地回收而被撤回。\n\n## 3. 定向医生咨询\n\n![定向咨询与撤销](visuals/doctor-consultation.png)\n\n```mermaid\nflowchart tb\n  case[\"患者选择已保存病例\"] --> choose[\"选择可用认证医生、快照与材料\"]\n  choose --> grant[\"明确同意本次分享\"]\n  grant --> active{\"已有活动咨询？\"}\n  active -->|是| existing[\"查看或取消旧咨询后重选\"]\n  existing --> choose\n  active -->|否| pending[\"pending：医生查看授权快照\"]\n  pending --> decision{\"医生处理\"}\n  decision -->|婉拒| declined[\"declined：停止共享\"]\n  decision -->|接受| accepted[\"accepted：健康建议／持续留言\"]\n  accepted --> waiting[\"awaiting_patient：请求补充\"]\n  waiting --> accepted\n  accepted --> completed[\"completed：停止共享\"]\n  pending --> stop[\"患者取消或医生失效：停止共享\"]\n  accepted --> stop\n  waiting --> stop\n```\n\n已实现咨询入口可由患者/医生页面中的咨询面板进入，不能凭 `/doctor/cases` 的存在断言该页已符合新咨询授权。读取和发布须重查认证；患者不能替医生接受；通知已读不代表已接收业务。旧医生页风险见 [差距矩阵](development_readiness.md)。\n\n## 4. 诊后记录到日常任务\n\n患者保存自报反馈 → 自主选择 ai 整理 → 预览脱敏文字与接收方 → 明确同意 → 获得默认未选候选 → 逐项核对、补日期/时间 → 确认生效 → 站内提醒/可选通用邮件 → 本人记录任务完成。\n\n异常：未同意走手动计划；缺药名、剂量或明确指示不能补成医嘱；来源变化取消待发送关联事件；暂停/终止停止未来排程；已发送事件仍保留。邮件发送不能证明患者看见，更不能证明任务执行。\n\n## 5. 管理员处理\n\n管理员登录 → 根据任务进入账号/审核/知识/配置/通知/邮件页面 → 核对对象和操作影响 → 提交 → 分别显示业务处理与外部发送结果 → 检查必要审计记录。\n\n现有账号 kick 为数据库删除；医生拒绝审核含删除路径。产品评审必须明确停用与删除的区别。审核批准时邮件失败仍可能返回“已发送”，属于已定位差距；本次只记录，不执行管理操作。\n\n## 失败、取消与恢复总表\n\n| 遇到什么 | 用户应看到什么 | 可继续做什么 | 禁止的假成功 |\n|---|---|---|---|\n| 请求超时/来源不足 | 明确失败或证据不足 | 保留资料、人工核对、受控重试 | 展示完整辅助结论 |\n| 版本冲突 | 旧版本与新版本需要对照 | 保留草稿、重载后重新确认 | 自动覆盖最新记录 |\n| 后台解析/模型失败 | 独立任务失败状态 | 原件可读、手动整理 | 自动切外部 ocr/重发材料 |\n| 切病例迟到响应 | 当前病例边界明确 | 只操作当前选中病例 | 用 a 资料填 b 表单 |\n| 取消分享/医生失效 | 咨询停止共享，历史仍可解释 | 患者另选并再次授权 | 自动把授权转交新医生 |\n| 提醒邮件失败 | 未送达或状态不确定 | 查站内事件/手动记录 | 宣称可靠实时监护 |\n| 刷新/退出 | 已保存与未保存范围清楚 | 服务端恢复；未存草稿重新填写 | 承诺所有聊天/草稿跨设备恢复 |\n\n逐项验收见 [product_spec](product_spec.md)。思维导图只概括模块，条件/回环关系以上述流程为准。\n"},{"id":"EVIDENCE","label":"项目事实与覆盖","html":"\u003ch1 id=\"medaxis-项目事实与覆盖矩阵\">MedAxis 项目事实与覆盖矩阵\u003c/h1>\n\u003cblockquote>\n\u003cp>Status: REVIEW · 核对日期：2026-10-09 · 类型：静态源码与历史证据审阅\u003c/p>\n\u003cp>基线 HEAD：\u003ccode>1b95d41a65f493274a8b7ae47e8cdede7e45d539\u003c/code>，分支 master。工作区已有大量未提交改动；本包描述核对时工作区，不等于该 HEAD 或公开克隆已具备全部能力。\u003c/p>\n\u003c/blockquote>\n\u003ch2 id=\"1-覆盖与证据层级\">1. 覆盖与证据层级\u003c/h2>\n\u003cp>本次检查三条范围：患者路由/状态/API；AI 编排/检索/报告处理与评测记录；医生/管理角色与运营 API。核心源码树共 265 个文件（读取文件清单计数），并未逐一穷尽所有分支。当前应用实例、数据库、配置、模型、索引和供应商账单未读取或运行。\u003c/p>\n\u003cp>\u003cstrong>工作区同期变化：\u003c/strong> 最后范围检查发现6个AI评测/来源筛选相关既有文件与开工哈希不同，非本任务写入路径。主代理于2026-10-09 21:09（UTC+8）复核新增记录及相关服务，补入下方问题覆盖v3证据；其他分端结论未用旧哈希冒充最终全工作区快照。变动来源未核实，不自动回滚；清单留在本机任务scope-results.json。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>层级\u003c/th>\n\u003cth>本次可用证据\u003c/th>\n\u003cth>允许结论\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>源码\u003c/td>\n\u003ctd>路由、服务、模型和测试源码；下表定位\u003c/td>\n\u003ctd>存在实现或可定位差距\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>历史自动化/集成\u003c/td>\n\u003ctd>带日期验收与隔离记录\u003c/td>\n\u003ctd>只在其样本与环境成立，不是本轮重跑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>当前目标环境\u003c/td>\n\u003ctd>本轮 NOT_RUN\u003c/td>\n\u003ctd>不声明当前部署可用\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>真人/专业验证\u003c/td>\n\u003ctd>缺少可引用的完整证据\u003c/td>\n\u003ctd>不声明真实患者价值或临床有效性\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>发布\u003c/td>\n\u003ctd>无本轮发布动作\u003c/td>\n\u003ctd>不声明上线或生产准备完成\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>系统组成参考 \u003ca href=\"../../engineering/architecture.md\">architecture\u003c/a>：React/MUI 前端、FastAPI API、PostgreSQL 持久层、Redis/Celery 异步任务；模型、检索与本地 OCR 是不同依赖。这里的组成关系是静态架构，不是当前运行图。\u003c/p>\n\u003ch2 id=\"2-源码证据索引\">2. 源码证据索引\u003c/h2>\n\u003cp>链接定位核对日期附近的行；后续源码变化应按符号重新定位。E 编号是事实引用索引，不替代需求编号。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>已看到的行为 / 限制\u003c/th>\n\u003cth>精确抓手\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>E-01\u003c/td>\n\u003ctd>公共/患者/医生/管理路由；前端 RequireRole 允许 admin 绕过角色页面限制，不等于后端授权\u003c/td>\n\u003ctd>\u003ca href=\"../../../frontend/src/App.tsx#L52\">\u003ccode>App.tsx RequireRole/Routes\u003c/code>\u003c/a>；API 挂载 \u003ca href=\"../../../backend/app/api/v1/__init__.py#L18\">\u003ccode>v1/__init__.py\u003c/code>\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E-02\u003c/td>\n\u003ctd>浏览器聊天按身份保存；无 server file_id 的处理中上传刷新后失败；会话 user/guest 归属检查\u003c/td>\n\u003ctd>\u003ca href=\"../../../frontend/src/state/chatHistory.ts#L41\">\u003ccode>chatHistory.ts\u003c/code>\u003c/a>、\u003ca href=\"../../../backend/app/api/v1/agents.py#L109\">\u003ccode>agents.py _require_session_access\u003c/code>\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E-03\u003c/td>\n\u003ctd>主入口流式路由、诊断完成保存；题目语义去重失败保留候选，不是 RAG 召回\u003c/td>\n\u003ctd>\u003ca href=\"../../../backend/app/api/v1/agents.py#L1026\">\u003ccode>agents.py\u003c/code>\u003c/a>、\u003ca href=\"../../../backend/app/services/orchestrator.py#L621\">\u003ccode>orchestrator.py _semantic_dedup\u003c/code>\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E-04\u003c/td>\n\u003ctd>病例保存按来源会话支持幂等；本人病例恢复、材料过滤\u003c/td>\n\u003ctd>\u003ca href=\"../../../backend/app/services/patient_case_persistence.py#L23\">\u003ccode>patient_case_persistence.py\u003c/code>\u003c/a>、\u003ca href=\"../../../backend/app/api/v1/patient.py#L343\">\u003ccode>patient.py\u003c/code>\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E-05\u003c/td>\n\u003ctd>就医准备 revision 冲突 409；当前会话内存草稿刷新不恢复\u003c/td>\n\u003ctd>\u003ca href=\"../../../backend/app/api/v1/patient.py#L523\">\u003ccode>patient.py\u003c/code>\u003c/a>、\u003ca href=\"../../../frontend/src/state/casePreparation.ts#L4\">\u003ccode>casePreparation.ts\u003c/code>\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E-06\u003c/td>\n\u003ctd>诊后反馈版本/追加历史；档案 revision；测量 request_id 冲突\u003c/td>\n\u003ctd>\u003ca href=\"../../../backend/app/api/v1/patient.py#L722\">\u003ccode>patient.py\u003c/code>\u003c/a>、\u003ca href=\"../../../backend/app/services/patient_profile.py#L111\">\u003ccode>patient_profile.py\u003c/code>\u003c/a>、\u003ca href=\"../../../backend/app/api/v1/health_measurements.py#L58\">\u003ccode>health_measurements.py\u003c/code>\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E-07\u003c/td>\n\u003ctd>计划本人归属、创建指纹、任务首次记录；sent 提醒才可确认，重复确认幂等\u003c/td>\n\u003ctd>\u003ca href=\"../../../backend/app/api/v1/care_plans.py#L53\">\u003ccode>care_plans.py\u003c/code>\u003c/a>、\u003ca href=\"../../../backend/app/services/care_plan.py#L95\">\u003ccode>care_plan.py\u003c/code>\u003c/a>、\u003ca href=\"../../../backend/app/api/v1/patient.py#L853\">\u003ccode>patient.py\u003c/code>\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E-08\u003c/td>\n\u003ctd>新报告角色/归属、上传请求指纹与 metadata revision；上传待保存文件仅页面内存\u003c/td>\n\u003ctd>\u003ca href=\"../../../backend/app/api/v1/patient_reports.py#L79\">\u003ccode>patient_reports.py\u003c/code>\u003c/a>、\u003ca href=\"../../../frontend/src/patient/components/ReportUploadDialog.tsx#L46\">\u003ccode>ReportUploadDialog.tsx\u003c/code>\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E-09\u003c/td>\n\u003ctd>草稿、确认历史分开；病例链接固定 source/review version 并标记变化\u003c/td>\n\u003ctd>\u003ca href=\"../../../backend/app/services/report_review.py#L123\">\u003ccode>report_review.py\u003c/code>\u003c/a>、\u003ca href=\"../../../backend/app/services/report_links.py#L17\">\u003ccode>report_links.py\u003c/code>\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E-10\u003c/td>\n\u003ctd>诊后候选同意、原文约束、排程、停用和来源变更语义\u003c/td>\n\u003ctd>\u003ca href=\"../POST_VISIT_AI_ACTIONS_SPEC.md\">POST_VISIT_AI_ACTIONS_SPEC\u003c/a>；属于详细行为与历史验收入口，本轮未重跑\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E-11\u003c/td>\n\u003ctd>咨询仅患者/认证 active 医生；对象归属、快照指纹、单活动咨询、消息幂等与撤销\u003c/td>\n\u003ctd>\u003ca href=\"../../../backend/app/api/v1/consultations.py#L32\">\u003ccode>consultations.py doctor_available/owned_consultation\u003c/code>\u003c/a>、\u003ca href=\"../../../backend/app/api/v1/consultations.py#L120\">\u003ccode>create_consultation\u003c/code>\u003c/a>、\u003ca href=\"../../../backend/app/models/consultation.py#L13\">\u003ccode>Consultation ACTIVE_STATES\u003c/code>\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E-12\u003c/td>\n\u003ctd>旧医生 helper 仅检查医生角色；列表/详情按患者查会话；部分统计/risk 固定；plan 501\u003c/td>\n\u003ctd>\u003ca href=\"../../../backend/app/api/v1/doctor.py#L29\">\u003ccode>doctor.py _require_doctor\u003c/code>\u003c/a>、\u003ca href=\"../../../backend/app/api/v1/doctor.py#L98\">\u003ccode>list_doctor_cases\u003c/code>\u003c/a>、\u003ca href=\"../../../backend/app/api/v1/doctor.py#L159\">\u003ccode>get_case_detail\u003c/code>\u003c/a>、\u003ca href=\"../../../backend/app/api/v1/doctor.py#L214\">\u003ccode>send_plan_instruction\u003c/code>\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E-13\u003c/td>\n\u003ctd>旧医生详情混入 MOCK_CASE patient_info/timeline/structured_report；评论客户端有请求而本次 doctor 路由未定位 handler\u003c/td>\n\u003ctd>\u003ca href=\"../../../frontend/src/doctor/pages/CaseDetailPage.tsx#L80\">\u003ccode>CaseDetailPage.tsx MOCK_CASE\u003c/code>\u003c/a>、\u003ca href=\"../../../frontend/src/doctor/pages/CaseDetailPage.tsx#L161\">\u003ccode>load\u003c/code>\u003c/a>、\u003ca href=\"../../../frontend/src/api/doctor.ts#L66\">\u003ccode>doctor.ts\u003c/code>\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E-14\u003c/td>\n\u003ctd>RAG 两路独立候选并集、同模型 cosine 排序，重排失败保留；空 search_terms 提前返回，向量 ValueError 降为关键词\u003c/td>\n\u003ctd>\u003ca href=\"../../../backend/app/services/rag.py#L237\">\u003ccode>rag.py RAGService.search\u003c/code>\u003c/a>、\u003ca href=\"../../../backend/app/services/rag.py#L279\">独立召回\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E-15\u003c/td>\n\u003ctd>缺来源/无有效引用不发布；来源要点判断有降级，相关与覆盖不等于原文支持\u003c/td>\n\u003ctd>\u003ca href=\"../../../backend/app/services/agents.py#L869\">\u003ccode>agents.py\u003c/code>\u003c/a>、\u003ca href=\"../../../backend/app/services/knowledge_citations.py#L313\">\u003ccode>knowledge_citations.py rank_knowledge_citations\u003c/code>\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E-16\u003c/td>\n\u003ctd>旧问诊 documents 上传字节入任务；视觉/文件模型可能接收原件\u003c/td>\n\u003ctd>\u003ca href=\"../../../backend/app/api/v1/documents.py#L74\">\u003ccode>documents.py\u003c/code>\u003c/a>、\u003ca href=\"../../../backend/app/tasks/documents.py#L66\">\u003ccode>tasks/documents.py\u003c/code>\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E-17\u003c/td>\n\u003ctd>新报告本地取字 worker 禁网；发送绑定预览/来源/接收方且只发文字；失败不自动重发\u003c/td>\n\u003ctd>\u003ca href=\"../../../backend/app/services/report_text_worker.py#L22\">\u003ccode>report_text_worker.py\u003c/code>\u003c/a>、\u003ca href=\"../../../backend/app/services/report_processing.py#L157\">\u003ccode>report_processing.py\u003c/code>\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E-18\u003c/td>\n\u003ctd>普通 guest 提交额度与过期；面试模式每个 provider HTTP 尝试持久扣减、失败不退、limit1–20\u003c/td>\n\u003ctd>\u003ca href=\"../../../backend/app/services/guest_model_quota.py#L113\">\u003ccode>guest_model_quota.py\u003c/code>\u003c/a>、\u003ca href=\"../../../backend/app/services/interview_demo.py#L40\">\u003ccode>interview_demo.py load_policy/reserve_provider_request\u003c/code>\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E-19\u003c/td>\n\u003ctd>admin router 后端统一角色依赖；非 active token 拒绝；最后 admin 保护；kick 实际 db.delete\u003c/td>\n\u003ctd>\u003ca href=\"../../../backend/app/api/v1/admin.py#L47\">\u003ccode>admin.py\u003c/code>\u003c/a>、\u003ca href=\"../../../backend/app/api/deps.py#L84\">\u003ccode>deps.py\u003c/code>\u003c/a>、\u003ca href=\"../../../backend/app/api/v1/admin.py#L812\">\u003ccode>admin.py kick_user\u003c/code>\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E-20\u003c/td>\n\u003ctd>医生审核邮件失败记日志，但成功文字仍称已发送；审计不代表每个操作都有记录\u003c/td>\n\u003ctd>\u003ca href=\"../../../backend/app/api/v1/admin.py#L906\">\u003ccode>admin.py\u003c/code>\u003c/a>、\u003ca href=\"../../../backend/app/services/audit.py#L17\">\u003ccode>AuditService\u003c/code>\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>E-21\u003c/td>\n\u003ctd>知识/提供方/邮件/通知管理接口存在；没有本次逐表单联调证据\u003c/td>\n\u003ctd>\u003ca href=\"../../../backend/app/api/v1/admin.py#L279\">\u003ccode>admin.py\u003c/code>\u003c/a>、\u003ca href=\"../../../backend/app/api/v1/email.py#L53\">\u003ccode>email.py\u003c/code>\u003c/a>、\u003ca href=\"../../../backend/app/api/v1/notifications.py#L62\">\u003ccode>notifications.py\u003c/code>\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"3-页面覆盖矩阵\">3. 页面覆盖矩阵\u003c/h2>\n\u003cp>覆盖 \u003ccode>App.tsx\u003c/code> 所声明路由，含默认重定向。API 前缀均为 \u003ccode>/api/v1\u003c/code>；下表前端权限是呈现规则，后端权限见证据索引，不混为一谈。管理页具体字段及所有失败分支属于未穷尽范围。\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>页面路由\u003c/th>\n\u003cth>动作 / 数据\u003c/th>\n\u003cth>状态与失败\u003c/th>\n\u003cth>角色 / 对象范围\u003c/th>\n\u003cth>证据 / 覆盖深度\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>/\u003c/code>\u003c/td>\n\u003ctd>身份入口或主页跳转\u003c/td>\n\u003ctd>已登录跳对应角色；未登录入口\u003c/td>\n\u003ctd>公共\u003c/td>\n\u003ctd>E-01，路由级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/login\u003c/code>\u003c/td>\n\u003ctd>登录\u003c/td>\n\u003ctd>凭据/状态错误；当前运行未验\u003c/td>\n\u003ctd>公共\u003c/td>\n\u003ctd>E-01，路由级\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/register\u003c/code>\u003c/td>\n\u003ctd>普通注册\u003c/td>\n\u003ctd>演示模式关闭公开注册\u003c/td>\n\u003ctd>公共/模式约束\u003c/td>\n\u003ctd>E-01/E-18，路由与服务\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/chat\u003c/code>\u003c/td>\n\u003ctd>AI 采集、材料、咨询面板\u003c/td>\n\u003ctd>SSE/保存失败；本地历史恢复\u003c/td>\n\u003ctd>患者或 guest；后端校验会话归属\u003c/td>\n\u003ctd>E-02/03/11，链路级静态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/today\u003c/code>\u003c/td>\n\u003ctd>档案、任务、提醒、病例聚合\u003c/td>\n\u003ctd>各区独立失败/重试\u003c/td>\n\u003ctd>患者页面；API 本人范围\u003c/td>\n\u003ctd>\u003ca href=\"../../../frontend/src/patient/pages/TodayHealthPage.tsx#L32\">\u003ccode>TodayHealthPage\u003c/code>\u003c/a>，E-01/04/07\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/health\u003c/code>\u003c/td>\n\u003ctd>档案和测量\u003c/td>\n\u003ctd>未知/无、revision 冲突\u003c/td>\n\u003ctd>本人档案；测量要求患者\u003c/td>\n\u003ctd>E-06，链路级静态\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>/followups\u003c/code>\u003c/td>\n\u003ctd>计划/候选、执行任务\u003c/td>\n\u003ctd>待确认/active/paused/终态\u003c/td>\n\u003ctd>患者本人计划\u003c/td>\n\u003ctd> 败\">4. 历史证据，保留代价与失败\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>记录\u003c/th>\n\u003cth>可引用结果\u003c/th>\n\u003cth>必须一起保留的限定\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ca href=\"../SEMANTIC_RECALL_ACCEPTANCE.md\">语义召回 2026-10-08\u003c/a>\u003c/td>\n\u003ctd>同45题/4文档125片段；40正例完整覆盖28/40→32/40，跨语言0/5→4/5\u003c/td>\n\u003ctd>4/5无答案仍返回候选；缓存检索P50/P95 69.97/91.14→170.37/191.71ms；专业gold审核0；不是页面/临床准确率\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../EVIDENCE_SUPPORT_EVALUATION.md\">原文支持评测\u003c/a> v4 / 2026-10-09\u003c/td>\n\u003ctd>53题冻结回归，36执行、17能力缺失、0异常；语义准确率 null\u003c/td>\n\u003ctd>该次没有额外模型/HTTP；专业审核0；v3的52题和baseline-v2属于旧版本，不能替换v4\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../EVIDENCE_SUPPORT_EVALUATION.md\">问题覆盖优化更新\u003c/a> / query-assessment-v3\u003c/td>\n\u003ctd>给定候选：开发分类24/24、v4问题相关性切片15/16；完整/部分回答保留，无关误保留开发8→0、回归6→0\u003c/td>\n\u003ctd>同语料非盲测；NG143仍误判；24次成功模型调用、23,957服务tokens，金额未知；每组中位1.726秒，非完整问诊；新问诊/API/保存刷新待验。不是Recall@K、原文陈述支持或临床正确率\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../PATIENT_REPORTS_REQUIREMENTS.md\">报告切片\u003c/a> 2026-10-06复核\u003c/td>\n\u003ctd>T1–T5有合成隔离API/DB/OCR/队列/页面证据，去重与引用有实现\u003c/td>\n\u003ctd>T6组合、实拍OCR、Linux、真实模型质量待验；当日记录演示库未迁移，本轮未复核部署\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../POST_VISIT_AI_ACTIONS_SPEC.md\">诊后候选\u003c/a>\u003c/td>\n\u003ctd>有隔离验收方法、同意/原文/幂等/来源变更场景\u003c/td>\n\u003ctd>合成替身不证明真实模型、SMTP、长期任务和部署\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../OPENMED_BORROWING_ACCEPTANCE.md\">OpenMed规则借鉴\u003c/a>\u003c/td>\n\u003ctd>原话语境、核对、遮蔽的规则集成记录\u003c/td>\n\u003ctd>不代表真实SDK接入或完整语义理解\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../../../evals/openmed-transfer/SDK_RESULTS.md\">OpenMed SDK独立实验\u003c/a>\u003c/td>\n\u003ctd>HOLD；24题非盲测，SDK断言19/28；隐私字符92/101、误遮23；数值/时长保留6/14\u003c/td>\n\u003ctd>不接生产、无临床审核；CPU中位约37.1ms/加载约4.8秒不能作为产品性能基线\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"../../media/README.md\">展示素材\u003c/a> 2026-10-09\u003c/td>\n\u003ctd>当前前端合成API/SSE预置重放，9状态GIF和9PNG\u003c/td>\n\u003ctd>无模型/实际检索/业务库写入；不能证明恢复成功或真实授权\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>底层本机 v4 原始记录：\u003ccode>../../..\u003c/code> 下 \u003ccode>.ai/tasks/2026-10-09-evidence-support/baseline-v4-authorized/REPORT.md\u003c/code>；属于未随文档分发的过程材料。公开阅读优先使用上表稳定验收摘要，缺本机材料不伪造逐题复跑证据。\u003c/p>\n\u003ch2 id=\"5-已发现的漂移与待核对\">5. 已发现的漂移与待核对\u003c/h2>\n\u003col>\n\u003cli>工程 backend/database 的“先关键词再 embedding”概述早于独立语义召回；本次以 E-14 为现状，未来工程同步应回链语义实验。此次不修改工程实现文档。\u003c/li>\n\u003cli>DOCTOR_PRD 的 10月3日 Current Product 是当日事实；当前新咨询已存在，不能重复宣称整条回复联通未实现。旧病例页问题仍成立。\u003c/li>\n\u003cli>docs 素材旧导航称占位，与现有 media/README 的录制记录不一致；本次仅修导航。\u003c/li>\n\u003cli>v4无额外模型调用是早先基线；同期新增query-assessment-v3已记录真实模型配对实验与最小接入。两者是不同阶段，不能以早先自然降级否定新实验，也不能把离线回放/模型实验升级成当前页面和数据库验收。最终运行态仍未核对。\u003c/li>\n\u003cli>consultation_action 的 end 分支目前未显式限制医生角色；目标医生结束与患者取消的操作归属需单独核对，不以流程示意图作为权限证明。\u003c/li>\n\u003c/ol>\n\u003cp>未覆盖：所有 provider adapter 出口、完整消息/日志数据流、管理端每个表单、数据库级全约束、当前实例配置/迁移、真实供应商处理、所有 SSE/异步中断分支。全项目文档覆盖不等于所有代码逐分支审计。\u003c/p>\n","search":"# medaxis 项目事实与覆盖矩阵\r\n\r\n> status: review · 核对日期：2026-10-09 · 类型：静态源码与历史证据审阅\r\n>\r\n> 基线 head：`1b95d41a65f493274a8b7ae47e8cdede7e45d539`，分支 master。工作区已有大量未提交改动；本包描述核对时工作区，不等于该 head 或公开克隆已具备全部能力。\r\n\r\n## 1. 覆盖与证据层级\r\n\r\n本次检查三条范围：患者路由/状态/api；ai 编排/检索/报告处理与评测记录；医生/管理角色与运营 api。核心源码树共 265 个文件（读取文件清单计数），并未逐一穷尽所有分支。当前应用实例、数据库、配置、模型、索引和供应商账单未读取或运行。\n\n**工作区同期变化：** 最后范围检查发现6个ai评测/来源筛选相关既有文件与开工哈希不同，非本任务写入路径。主代理于2026-10-09 21:09（utc+8）复核新增记录及相关服务，补入下方问题覆盖v3证据；其他分端结论未用旧哈希冒充最终全工作区快照。变动来源未核实，不自动回滚；清单留在本机任务scope-results.json。\n\r\n| 层级 | 本次可用证据 | 允许结论 |\r\n|---|---|---|\r\n| 源码 | 路由、服务、模型和测试源码；下表定位 | 存在实现或可定位差距 |\r\n| 历史自动化/集成 | 带日期验收与隔离记录 | 只在其样本与环境成立，不是本轮重跑 |\r\n| 当前目标环境 | 本轮 not_run | 不声明当前部署可用 |\r\n| 真人/专业验证 | 缺少可引用的完整证据 | 不声明真实患者价值或临床有效性 |\r\n| 发布 | 无本轮发布动作 | 不声明上线或生产准备完成 |\r\n\r\n系统组成参考 [architecture](../../engineering/architecture.md)：react/mui 前端、fastapi api、postgresql 持久层、redis/celery 异步任务；模型、检索与本地 ocr 是不同依赖。这里的组成关系是静态架构，不是当前运行图。\r\n\r\n## 2. 源码证据索引\r\n\r\n链接定位核对日期附近的行；后续源码变化应按符号重新定位。e 编号是事实引用索引，不替代需求编号。\r\n\r\n| id | 已看到的行为 / 限制 | 精确抓手 |\r\n|---|---|---|\r\n| e-01 | 公共/患者/医生/管理路由；前端 requirerole 允许 admin 绕过角色页面限制，不等于后端授权 | [`app.tsx requirerole/routes`](../../../frontend/src/app.tsx#l52)；api 挂载 [`v1/__init__.py`](../../../backend/app/api/v1/__init__.py#l18) |\r\n| e-02 | 浏览器聊天按身份保存；无 server file_id 的处理中上传刷新后失败；会话 user/guest 归属检查 | [`chathistory.ts`](../../../frontend/src/state/chathistory.ts#l41)、[`agents.py _require_session_access`](../../../backend/app/api/v1/agents.py#l109) |\r\n| e-03 | 主入口流式路由、诊断完成保存；题目语义去重失败保留候选，不是 rag 召回 | [`agents.py`](../../../backend/app/api/v1/agents.py#l1026)、[`orchestrator.py _semantic_dedup`](../../../backend/app/services/orchestrator.py#l621) |\r\n| e-04 | 病例保存按来源会话支持幂等；本人病例恢复、材料过滤 | [`patient_case_persistence.py`](../../../backend/app/services/patient_case_persistence.py#l23)、[`patient.py`](../../../backend/app/api/v1/patient.py#l343) |\r\n| e-05 | 就医准备 revision 冲突 409；当前会话内存草稿刷新不恢复 | [`patient.py`](../../../backend/app/api/v1/patient.py#l523)、[`casepreparation.ts`](../../../frontend/src/state/casepreparation.ts#l4) |\r\n| e-06 | 诊后反馈版本/追加历史；档案 revision；测量 request_id 冲突 | [`patient.py`](../../../backend/app/api/v1/patient.py#l722)、[`patient_profile.py`](../../../backend/app/services/patient_profile.py#l111)、[`health_measurements.py`](../../../backend/app/api/v1/health_measurements.py#l58) |\r\n| e-07 | 计划本人归属、创建指纹、任务首次记录；sent 提醒才可确认，重复确认幂等 | [`care_plans.py`](../../../backend/app/api/v1/care_plans.py#l53)、[`care_plan.py`](../../../backend/app/services/care_plan.py#l95)、[`patient.py`](../../../backend/app/api/v1/patient.py#l853) |\r\n| e-08 | 新报告角色/归属、上传请求指纹与 metadata revision；上传待保存文件仅页面内存 | [`patient_reports.py`](../../../backend/app/api/v1/patient_reports.py#l79)、[`reportuploaddialog.tsx`](../../../frontend/src/patient/components/reportuploaddialog.tsx#l46) |\r\n| e-09 | 草稿、确认历史分开；病例链接固定 source/review version 并标记变化 | [`report_review.py`](../../../backend/app/services/report_review.py#l123)、[`report_links.py`](../../../backend/app/services/report_links.py#l17) |\r\n| e-10 | 诊后候选同意、原文约束、排程、停用和来源变更语义 | [post_visit_ai_actions_spec](../post_visit_ai_actions_spec.md)；属于详细行为与历史验收入口，本轮未重跑 |\r\n| e-11 | 咨询仅患者/认证 active 医生；对象归属、快照指纹、单活动咨询、消息幂等与撤销 | [`consultations.py doctor_available/owned_consultation`](../../../backend/app/api/v1/consultations.py#l32)、[`create_consultation`](../../../backend/app/api/v1/consultations.py#l120)、[`consultation active_states`](../../../backend/app/models/consultation.py#l13) |\r\n| e-12 | 旧医生 helper 仅检查医生角色；列表/详情按患者查会话；部分统计/risk 固定；plan 501 | [`doctor.py _require_doctor`](../../../backend/app/api/v1/doctor.py#l29)、[`list_doctor_cases`](../../../backend/app/api/v1/doctor.py#l98)、[`get_case_detail`](../../../backend/app/api/v1/doctor.py#l159)、[`send_plan_instruction`](../../../backend/app/api/v1/doctor.py#l214) |\r\n| e-13 | 旧医生详情混入 mock_case patient_info/timeline/structured_report；评论客户端有请求而本次 doctor 路由未定位 handler | [`casedetailpage.tsx mock_case`](../../../frontend/src/doctor/pages/casedetailpage.tsx#l80)、[`load`](../../../frontend/src/doctor/pages/casedetailpage.tsx#l161)、[`doctor.ts`](../../../frontend/src/api/doctor.ts#l66) |\r\n| e-14 | rag 两路独立候选并集、同模型 cosine 排序，重排失败保留；空 search_terms 提前返回，向量 valueerror 降为关键词 | [`rag.py ragservice.search`](../../../backend/app/services/rag.py#l237)、[独立召回](../../../backend/app/services/rag.py#l279) |\r\n| e-15 | 缺来源/无有效引用不发布；来源要点判断有降级，相关与覆盖不等于原文支持 | [`agents.py`](../../../backend/app/services/agents.py#l869)、[`knowledge_citations.py rank_knowledge_citations`](../../../backend/app/services/knowledge_citations.py#l313) |\r\n| e-16 | 旧问诊 documents 上传字节入任务；视觉/文件模型可能接收原件 | [`documents.py`](../../../backend/app/api/v1/documents.py#l74)、[`tasks/documents.py`](../../../backend/app/tasks/documents.py#l66) |\r\n| e-17 | 新报告本地取字 worker 禁网；发送绑定预览/来源/接收方且只发文字；失败不自动重发 | [`report_text_worker.py`](../../../backend/app/services
